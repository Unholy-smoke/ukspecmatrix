document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"273ea34f-c0a7-415a-8ed8-bedb4902adfc\"><\u002Fscript>\n<script>window.__RFR_DATA={content:{\n \"meta\": {\n  \"title\": \"Regulations for Registration (RfR)\",\n  \"edition\": \"Fourth edition, Issue 4.4 (March 2025)\",\n  \"banner\": \"Prototype – presents RfR 4.4 content in a digital-first format. Not an authoritative version of the Regulations.\",\n  \"generated\": \"2026-07-24\",\n  \"source\": \"Regulations for Registration v4.4.docx\",\n  \"paragraphs\": 73,\n  \"clauses\": 171\n },\n \"frontmatter\": [\n  {\n   \"id\": \"FM-1\",\n   \"title\": \"Hierarchy of Regulations and Reference Standards\",\n   \"html\": \"<p>Approved text will go here<\\/p>\"\n  },\n  {\n   \"id\": \"FM-2\",\n   \"title\": \"Welcome\",\n   \"html\": \"<p>Approved text will go here<\\/p>\"\n  }\n ],\n \"sections\": [\n  {\n   \"id\": \"S1\",\n   \"title\": \"Introduction and governance\",\n   \"subsections\": [\n    {\n     \"id\": \"S1a\",\n     \"title\": \"Introduction and governance\",\n     \"paragraphs\": [\n      {\n       \"num\": 1,\n       \"id\": \"P-001\",\n       \"clauses\": [\n        \"C-001.01\"\n       ],\n       \"html\": \"<p>These Regulations for Registration are published by the Board of the Engineering Council under Bye-Law 2 and govern the implementation by Licensees of the UK Standard for Professional Engineering Competence and Commitment (UK-SPEC) and related Recognised Standards, and the registration of individuals under those Standards.<\\/p>\",\n       \"text\": \"These Regulations for Registration are published by the Board of the Engineering Council under Bye-Law 2 and govern the implementation by Licensees of the UK Standard for Professional Engineering Competence and Commitment (UK-SPEC) and related Recognised Standards, and the registration of individuals under those Standards.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 2,\n       \"id\": \"P-002\",\n       \"clauses\": [\n        \"C-002.01\"\n       ],\n       \"html\": \"<p>Nothing in these Regulations shall be taken as overriding obligations placed on the Engineering Council and Licensees by national and international legislation, including any requirement to process applicants holding recognised international qualifications or credentials.<\\/p>\",\n       \"text\": \"Nothing in these Regulations shall be taken as overriding obligations placed on the Engineering Council and Licensees by national and international legislation, including any requirement to process applicants holding recognised international qualifications or credentials.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 3,\n       \"id\": \"P-003\",\n       \"clauses\": [\n        \"C-003.01\",\n        \"C-003.02\"\n       ],\n       \"html\": \"<p>Licensees’ application of these Regulations shall be subject to audit by the Engineering Council’s Quality Assurance Committee (QAC) under Bye-Law 16. Licensees shall maintain sufficient records for external audit purposes.<\\/p>\",\n       \"text\": \"Licensees’ application of these Regulations shall be subject to audit by the Engineering Council’s Quality Assurance Committee (QAC) under Bye-Law 16. Licensees shall maintain sufficient records for external audit purposes.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 4,\n       \"id\": \"P-004\",\n       \"clauses\": [\n        \"C-004.01\",\n        \"C-004.02\"\n       ],\n       \"html\": \"<p>The Board of the Engineering Council may add to, amend, or revoke paragraphs in these Regulations, on the recommendation of the Registration Standards Committee, or may delegate responsibility for amendment to that committee. Any such changes shall be communicated to all Licensees.<\\/p>\",\n       \"text\": \"The Board of the Engineering Council may add to, amend, or revoke paragraphs in these Regulations, on the recommendation of the Registration Standards Committee, or may delegate responsibility for amendment to that committee. Any such changes shall be communicated to all Licensees.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 5,\n       \"id\": \"P-005\",\n       \"clauses\": [\n        \"C-005.01\"\n       ],\n       \"html\": \"<p>Licensees shall not register individuals with the Engineering Council, or recognise programmes of development and learning for such registration, outside the terms of these Regulations for Registration, without the authorisation of the Registration Standards Committee.<\\/p>\",\n       \"text\": \"Licensees shall not register individuals with the Engineering Council, or recognise programmes of development and learning for such registration, outside the terms of these Regulations for Registration, without the authorisation of the Registration Standards Committee.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 6,\n       \"id\": \"P-006\",\n       \"clauses\": [\n        \"C-006.01\"\n       ],\n       \"html\": \"<p>Licensees shall have a suitable management system and self-assessment process in place, in order to demonstrate and maintain conformity with the Engineering Council requirements.<\\/p>\",\n       \"text\": \"Licensees shall have a suitable management system and self-assessment process in place, in order to demonstrate and maintain conformity with the Engineering Council requirements.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 7,\n       \"id\": \"P-007\",\n       \"clauses\": [\n        \"C-007.01\",\n        \"C-007.02\"\n       ],\n       \"html\": \"<p>The Engineering Council publishes guidance on the professional review, recognition of learning, and other areas covered by these Regulations. Technical or procedural issues arising in the application of these Regulations shall be referred to the Engineering Council for consideration, following which the Engineering Council may issue further guidance.<\\/p>\",\n       \"text\": \"The Engineering Council publishes guidance on the professional review, recognition of learning, and other areas covered by these Regulations. Technical or procedural issues arising in the application of these Regulations shall be referred to the Engineering Council for consideration, following which the Engineering Council may issue further guidance.\",\n       \"footnotes\": [\n        \"2\"\n       ],\n       \"refs\": []\n      },\n      {\n       \"num\": 8,\n       \"id\": \"P-008\",\n       \"clauses\": [\n        \"C-008.01\"\n       ],\n       \"html\": \"<p>Where these Regulations refer to UK-SPEC or ‘the Standard’, they shall be taken to refer equally to Recognised Standards (see <a class=\\\"xref\\\" href=\\\"#P-013\\\">paragraph 13<\\/a>) derived or developed by Licensees or the Engineering Council, including the Information and Communications Technology Technician (ICTTech) Standard.<\\/p>\",\n       \"text\": \"Where these Regulations refer to UK-SPEC or ‘the Standard’, they shall be taken to refer equally to Recognised Standards (see paragraph 13) derived or developed by Licensees or the Engineering Council, including the Information and Communications Technology Technician (ICTTech) Standard.\",\n       \"footnotes\": [],\n       \"refs\": [\n        \"P-013\"\n       ]\n      }\n     ]\n    }\n   ]\n  },\n  {\n   \"id\": \"S2\",\n   \"title\": \"Professional registration and the Professional Review\",\n   \"subsections\": [\n    {\n     \"id\": \"S2a\",\n     \"title\": \"Registration and the Professional Review\",\n     \"paragraphs\": [\n      {\n       \"num\": 9,\n       \"id\": \"P-009\",\n       \"clauses\": [\n        \"C-009.01\",\n        \"C-009.02\"\n       ],\n       \"html\": \"<p>Licensees may register any person who has demonstrated the competence and commitment appropriate to one of the registration categories, provided they are licensed to register people in that registration category. Under Bye-Law 6, registration in one category of the Register shall not preclude registration in any other category, provided this is with another Licensee.<\\/p>\",\n       \"text\": \"Licensees may register any person who has demonstrated the competence and commitment appropriate to one of the registration categories, provided they are licensed to register people in that registration category. Under Bye-Law 6, registration in one category of the Register shall not preclude registration in any other category, provided this is with another Licensee.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 10,\n       \"id\": \"P-010\",\n       \"clauses\": [\n        \"C-010.01\",\n        \"C-010.02\"\n       ],\n       \"html\": \"<p>In exceptional circumstances an individual may hold more than one title with the same Licensee. Guidance about the exceptional circumstances is available. Applications from individuals who wish to hold final stage (i.e. not interim) registered status in more than one category of the Register with the same Licensee must be considered individually by the Licensee.<\\/p>\",\n       \"text\": \"In exceptional circumstances an individual may hold more than one title with the same Licensee. Guidance about the exceptional circumstances is available. Applications from individuals who wish to hold final stage (i.e. not interim) registered status in more than one category of the Register with the same Licensee must be considered individually by the Licensee.\",\n       \"footnotes\": [\n        \"3\"\n       ],\n       \"refs\": []\n      },\n      {\n       \"num\": 11,\n       \"id\": \"P-011\",\n       \"clauses\": [\n        \"C-011.01\",\n        \"C-011.02\"\n       ],\n       \"html\": \"<p>Competence and commitment will be developed through a combination of:<\\/p><p>underpinning knowledge and understanding;<\\/p><p>professional development and experience.<\\/p><p>Acquisition of these elements, or parts of them, may be integrated or undertaken simultaneously.<\\/p>\",\n       \"text\": \"Competence and commitment will be developed through a combination of: underpinning knowledge and understanding; professional development and experience. Acquisition of these elements, or parts of them, may be integrated or undertaken simultaneously.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 12,\n       \"id\": \"P-012\",\n       \"clauses\": [\n        \"C-012.01\",\n        \"C-012.02\"\n       ],\n       \"html\": \"<p>Licensees shall establish criteria and procedures for assessing applicants for registration. Each Licensee shall adopt its own standard of competence and commitment, derived from and meeting that in UK-SPEC, which can be assessed objectively and which relates to the technologies and applications with which it is concerned.<\\/p>\",\n       \"text\": \"Licensees shall establish criteria and procedures for assessing applicants for registration. Each Licensee shall adopt its own standard of competence and commitment, derived from and meeting that in UK-SPEC, which can be assessed objectively and which relates to the technologies and applications with which it is concerned.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 13,\n       \"id\": \"P-013\",\n       \"clauses\": [\n        \"C-013.01\",\n        \"C-013.02\",\n        \"C-013.03\",\n        \"C-013.04\"\n       ],\n       \"html\": \"<p>Proprietary Standards are standards developed by the Engineering Council, based on and fully meeting the Reference Standard (UK-SPEC), such as sector-specific or specialist standards. Derived Standards may be developed by Licensees, based on and fully meeting UK-SPEC (or a proprietary Standard). All such Derived Standards shall be subject to authorisation by Quality Assurance Committee. Proprietary Standards, Derived Standards, Approved Standards and Mutually Recognised Standards are collectively described as ‘Recognised Standards’.<\\/p>\",\n       \"text\": \"Proprietary Standards are standards developed by the Engineering Council, based on and fully meeting the Reference Standard (UK-SPEC), such as sector-specific or specialist standards. Derived Standards may be developed by Licensees, based on and fully meeting UK-SPEC (or a proprietary Standard). All such Derived Standards shall be subject to authorisation by Quality Assurance Committee. Proprietary Standards, Derived Standards, Approved Standards and Mutually Recognised Standards are collectively described as ‘Recognised Standards’.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 14,\n       \"id\": \"P-014\",\n       \"clauses\": [\n        \"C-014.01\",\n        \"C-014.02\",\n        \"C-014.03\"\n       ],\n       \"html\": \"<p>Recognised Standards may make requirements of the assessment and revalidation of applicants, additional to those in UK-SPEC and these Regulations. Licensees’ processes for assessing applicants for registration and revalidation shall comply with any such requirements. Further guidance is available. Individuals holding registration against a Proprietary Standard may transfer to a corresponding Principal Register category without further assessment, subject to meeting any discipline-specific requirements of the registering Licensee.<\\/p>\",\n       \"text\": \"Recognised Standards may make requirements of the assessment and revalidation of applicants, additional to those in UK-SPEC and these Regulations. Licensees’ processes for assessing applicants for registration and revalidation shall comply with any such requirements. Further guidance is available. Individuals holding registration against a Proprietary Standard may transfer to a corresponding Principal Register category without further assessment, subject to meeting any discipline-specific requirements of the registering Licensee.\",\n       \"footnotes\": [\n        \"4\",\n        \"5\"\n       ],\n       \"refs\": []\n      }\n     ]\n    },\n    {\n     \"id\": \"S2b\",\n     \"title\": \"Interim registration\",\n     \"paragraphs\": [\n      {\n       \"num\": 15,\n       \"id\": \"P-015\",\n       \"clauses\": [\n        \"C-015.01\",\n        \"C-015.02\"\n       ],\n       \"html\": \"<p>Licensees may, under Bye-Law 6, register persons whose underpinning knowledge and understanding have been assessed as meeting the Standard, but who have not yet demonstrated the necessary competence for final stage registration. Such persons shall be considered ‘interim registrants’. An individual shall not be registered in both the final stage and interim sections of any one category of the Register.<\\/p>\",\n       \"text\": \"Licensees may, under Bye-Law 6, register persons whose underpinning knowledge and understanding have been assessed as meeting the Standard, but who have not yet demonstrated the necessary competence for final stage registration. Such persons shall be considered ‘interim registrants’. An individual shall not be registered in both the final stage and interim sections of any one category of the Register.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    }\n   ]\n  },\n  {\n   \"id\": \"S3\",\n   \"title\": \"Assessing applicants for professional registration\",\n   \"subsections\": [\n    {\n     \"id\": \"S3a\",\n     \"title\": \"Initial assessment\",\n     \"paragraphs\": [\n      {\n       \"num\": 16,\n       \"id\": \"P-016\",\n       \"clauses\": [\n        \"C-016.01\"\n       ],\n       \"html\": \"<p>The initial assessment is the process by which an applicant’s documentary evidence of underpinning knowledge and understanding, competence and commitment are assessed.<\\/p>\",\n       \"text\": \"The initial assessment is the process by which an applicant’s documentary evidence of underpinning knowledge and understanding, competence and commitment are assessed.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 17,\n       \"id\": \"P-017\",\n       \"clauses\": [\n        \"C-017.01\",\n        \"C-017.02\",\n        \"C-017.03\"\n       ],\n       \"html\": \"<p>The initial assessment shall be the responsibility of the Licensee’s Committee(s) responsible for registration. Any delegation of functions to staff must be on the basis of clear procedures and guidance established by the panel, and must be subject to internal audit.<\\/p>\",\n       \"text\": \"The initial assessment shall be the responsibility of the Licensee’s Committee(s) responsible for registration. Any delegation of functions to staff must be on the basis of clear procedures and guidance established by the panel, and must be subject to internal audit.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 18,\n       \"id\": \"P-018\",\n       \"clauses\": [\n        \"C-018.01\",\n        \"C-018.02\",\n        \"C-018.03\"\n       ],\n       \"html\": \"<p>The Licensee shall outline to applicants what documentation is required. This may include their:<\\/p><ul><li>career history<\\/li><li>education and training record, and<\\/li><li>any evidence of experiential (on-the-job) learning.<\\/li><\\/ul><p>If, as a result of this initial assessment, the Licensee considers that additional evidence of knowledge and understanding, or competence and commitment, is required, it shall advise the applicant on the nature and extent of this.<\\/p>\",\n       \"text\": \"The Licensee shall outline to applicants what documentation is required. This may include their: career history education and training record, and any evidence of experiential (on-the-job) learning. If, as a result of this initial assessment, the Licensee considers that additional evidence of knowledge and understanding, or competence and commitment, is required, it shall advise the applicant on the nature and extent of this.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    },\n    {\n     \"id\": \"S3b\",\n     \"title\": \"Assessment of competence and commitment\",\n     \"paragraphs\": [\n      {\n       \"num\": 19,\n       \"id\": \"P-019\",\n       \"clauses\": [\n        \"C-019.01\"\n       ],\n       \"html\": \"<p>All applicants for registration, in any registration category, shall have their competence and commitment assessed through a Professional Review, conducted by the Licensee through which they are applying for registration.<\\/p>\",\n       \"text\": \"All applicants for registration, in any registration category, shall have their competence and commitment assessed through a Professional Review, conducted by the Licensee through which they are applying for registration.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 20,\n       \"id\": \"P-020\",\n       \"clauses\": [\n        \"C-020.01\",\n        \"C-020.02\",\n        \"C-020.03\",\n        \"C-020.04\",\n        \"C-020.05\"\n       ],\n       \"html\": \"<p>The Professional Review shall include two components:<\\/p><ul><li>a review of documentary evidence;<\\/li><li>an interview.<\\/li><\\/ul><p>Licensees shall not progress applicants to interview without a recommendation from the initial assessors.<\\/p><p>Except for those covered under <a class=\\\"xref\\\" href=\\\"#P-072\\\">paragraph 72<\\/a>, the interview shall be obligatory for all applicants for final stage CEng or IEng registration and at the discretion of the Licensee for EngTech and ICTTech applicants. Licensees may add other components to the Professional Review.<\\/p>\",\n       \"text\": \"The Professional Review shall include two components: a review of documentary evidence; an interview. Licensees shall not progress applicants to interview without a recommendation from the initial assessors. Except for those covered under paragraph 72, the interview shall be obligatory for all applicants for final stage CEng or IEng registration and at the discretion of the Licensee for EngTech and ICTTech applicants. Licensees may add other components to the Professional Review.\",\n       \"footnotes\": [],\n       \"refs\": [\n        \"P-072\"\n       ]\n      },\n      {\n       \"num\": 21,\n       \"id\": \"P-021\",\n       \"clauses\": [\n        \"C-021.01\",\n        \"C-021.02\"\n       ],\n       \"html\": \"<p>Applicants shall submit evidence in support of their application in a format to be determined by the Licensee. This evidence shall demonstrate the requisite underpinning knowledge and understanding, competence and commitment requirements set out in UK-SPEC.<\\/p>\",\n       \"text\": \"Applicants shall submit evidence in support of their application in a format to be determined by the Licensee. This evidence shall demonstrate the requisite underpinning knowledge and understanding, competence and commitment requirements set out in UK-SPEC.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 22,\n       \"id\": \"P-022\",\n       \"clauses\": [\n        \"C-022.01\",\n        \"C-022.02\",\n        \"C-022.03\",\n        \"C-022.04\"\n       ],\n       \"html\": \"<p>Both elements of the Professional Review (review of documentary evidence and interview) shall be conducted by two suitably qualified and trained assessors. The assessors shall be final stage Engineering Council registrants, at least one of whom shall be at or above the registration category in which the applicant is seeking registration. At least one shall have appropriate and relevant engineering experience. Licensees shall take all reasonable steps in their selection of assessors to ensure that potential conflicts of interest are avoided.<\\/p>\",\n       \"text\": \"Both elements of the Professional Review (review of documentary evidence and interview) shall be conducted by two suitably qualified and trained assessors. The assessors shall be final stage Engineering Council registrants, at least one of whom shall be at or above the registration category in which the applicant is seeking registration. At least one shall have appropriate and relevant engineering experience. Licensees shall take all reasonable steps in their selection of assessors to ensure that potential conflicts of interest are avoided.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 23,\n       \"id\": \"P-023\",\n       \"clauses\": [\n        \"C-023.01\",\n        \"C-023.02\"\n       ],\n       \"html\": \"<p>The application, supporting documentation and interview shall be in English, subject only to the provisions of the Welsh Language Act 1993.<\\/p><p>Another language may be used purely for the clarification of a word or point, to enable the interview to continue.<\\/p>\",\n       \"text\": \"The application, supporting documentation and interview shall be in English, subject only to the provisions of the Welsh Language Act 1993. Another language may be used purely for the clarification of a word or point, to enable the interview to continue.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 24,\n       \"id\": \"P-024\",\n       \"clauses\": [\n        \"C-024.01\",\n        \"C-024.02\"\n       ],\n       \"html\": \"<p>The assessors shall complete a summary report, or reports, covering each component of the Professional Review, with a recommendation for each applicant. The report(s) shall cover the competence and commitment standards and reflect the assessors’ professional judgment of whether the required competence and commitment have been demonstrated.<\\/p>\",\n       \"text\": \"The assessors shall complete a summary report, or reports, covering each component of the Professional Review, with a recommendation for each applicant. The report(s) shall cover the competence and commitment standards and reflect the assessors’ professional judgment of whether the required competence and commitment have been demonstrated.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 25,\n       \"id\": \"P-025\",\n       \"clauses\": [\n        \"C-025.01\",\n        \"C-025.02\",\n        \"C-025.03\",\n        \"C-025.04\",\n        \"C-025.05\",\n        \"C-025.06\",\n        \"C-025.07\",\n        \"C-025.08\",\n        \"C-025.09\",\n        \"C-025.10\"\n       ],\n       \"html\": \"<p>The assessment shall be against the competence and commitment standards adopted by the Licensee under <a class=\\\"xref\\\" href=\\\"#P-012\\\">paragraph 12<\\/a>. The decision whether or not to accept an applicant for registration shall be made by the Licensee’s Committee responsible for registration on the basis of the reports from the Professional Review. Registrants shall be in the majority on the Committee responsible for registration.<\\/p><p>The Licensee’s Committee responsible for registration shall consider the report(s) from the Professional Review, and shall decide whether to confirm the recommendation. The Committee’s decisions, including recommendations, justifications, feedback and moderation, must be documented, transparent and auditable. Details of any international agreements or regulations that have been applied and exemptions given shall be recorded.<\\/p><p>The Committee shall not award a registration title unless it is the recommendation of both assessors to do so. Each Licensee shall have a procedure for the Committee to follow in cases where the decision is not to accept an applicant for registration on the basis of the reports from the Professional Review. The Committee may recommend that the applicant be invited to repeat one or more components of the Professional Review. Conditional passes are not permitted.<\\/p>\",\n       \"text\": \"The assessment shall be against the competence and commitment standards adopted by the Licensee under paragraph 12. The decision whether or not to accept an applicant for registration shall be made by the Licensee’s Committee responsible for registration on the basis of the reports from the Professional Review. Registrants shall be in the majority on the Committee responsible for registration. The Licensee’s Committee responsible for registration shall consider the report(s) from the Professional Review, and shall decide whether to confirm the recommendation. The Committee’s decisions, including recommendations, justifications, feedback and moderation, must be documented, transparent and auditable. Details of any international agreements or regulations that have been applied and exemptions given shall be recorded. The Committee shall not award a registration title unless it is the recommendation of both assessors to do so. Each Licensee shall have a procedure for the Committee to follow in cases where the decision is not to accept an applicant for registration on the basis of the reports from the Professional Review. The Committee may recommend that the applicant be invited to repeat one or more components of the Professional Review. Conditional passes are not permitted.\",\n       \"footnotes\": [],\n       \"refs\": [\n        \"P-012\"\n       ]\n      },\n      {\n       \"num\": 26,\n       \"id\": \"P-026\",\n       \"clauses\": [\n        \"C-026.01\",\n        \"C-026.02\"\n       ],\n       \"html\": \"<p>The applicant shall be informed of the outcome and, if the application has been unsuccessful, shall be advised about appropriate action to address deficiencies.<\\/p>\",\n       \"text\": \"The applicant shall be informed of the outcome and, if the application has been unsuccessful, shall be advised about appropriate action to address deficiencies.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 27,\n       \"id\": \"P-027\",\n       \"clauses\": [\n        \"C-027.01\",\n        \"C-027.02\",\n        \"C-027.03\",\n        \"C-027.04\",\n        \"C-027.05\"\n       ],\n       \"html\": \"<p>Each Licensee shall have an appeals procedure available to unsuccessful applicants.<\\/p><p>Unsuccessful applicants may appeal against the legitimacy of the process followed by the Licensee during Professional Review, but not against the decision itself. Appeals shall be considered by an Appeals Committee composed of registrants who did not materially participate in the appellant’s Professional Review.<\\/p><p>An Appeals Committee may recommend that the applicant be invited to repeat one or more components of the Professional Review, but may not summarily reverse the recommendation of an earlier assessment. The final decision remains with the Committee responsible for registration.<\\/p>\",\n       \"text\": \"Each Licensee shall have an appeals procedure available to unsuccessful applicants. Unsuccessful applicants may appeal against the legitimacy of the process followed by the Licensee during Professional Review, but not against the decision itself. Appeals shall be considered by an Appeals Committee composed of registrants who did not materially participate in the appellant’s Professional Review. An Appeals Committee may recommend that the applicant be invited to repeat one or more components of the Professional Review, but may not summarily reverse the recommendation of an earlier assessment. The final decision remains with the Committee responsible for registration.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    },\n    {\n     \"id\": \"S3c\",\n     \"title\": \"Assessment of underpinning knowledge and understanding\",\n     \"paragraphs\": [\n      {\n       \"num\": 28,\n       \"id\": \"P-028\",\n       \"clauses\": [\n        \"C-028.01\",\n        \"C-028.02\",\n        \"C-028.03\"\n       ],\n       \"html\": \"<p>The knowledge and understanding that underpin performance are an essential component of competence. The necessary knowledge and understanding for professional registration shall be demonstrated through:<\\/p><ul><li>successfully completing a recognised programme;<\\/li><li>successfully completing other programmes, either in whole or in part, as specified by the Licensee;<\\/li><li>providing additional evidence of having completed work-based or experiential learning acceptable to the Licensee;<\\/li><li>for applicants seeking registration as an EngTech or ICTTech, an integrated assessment by a Licensee of their education, training and competence in employment;<\\/li><li>submission of a technical report which is assessed as acceptable by the Licensee<\\/li><li>passing appropriate Engineering Council examinations that were available until May 2012, or;<\\/li><li>any combination of these.<\\/li><\\/ul><p>Regardless of how this component is demonstrated, Licensees must satisfy themselves that the applicant’s knowledge and understanding are sufficient, relevant and applicable to their engineering practice.<\\/p>\",\n       \"text\": \"The knowledge and understanding that underpin performance are an essential component of competence. The necessary knowledge and understanding for professional registration shall be demonstrated through: successfully completing a recognised programme; successfully completing other programmes, either in whole or in part, as specified by the Licensee; providing additional evidence of having completed work-based or experiential learning acceptable to the Licensee; for applicants seeking registration as an EngTech or ICTTech, an integrated assessment by a Licensee of their education, training and competence in employment; submission of a technical report which is assessed as acceptable by the Licensee passing appropriate Engineering Council examinations that were available until May 2012, or; any combination of these. Regardless of how this component is demonstrated, Licensees must satisfy themselves that the applicant’s knowledge and understanding are sufficient, relevant and applicable to their engineering practice.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    },\n    {\n     \"id\": \"S3d\",\n     \"title\": \"Technical report route\",\n     \"paragraphs\": [\n      {\n       \"num\": 29,\n       \"id\": \"P-029\",\n       \"clauses\": [\n        \"C-029.01\",\n        \"C-029.02\",\n        \"C-029.03\",\n        \"C-029.04\"\n       ],\n       \"html\": \"<p>A Licensee may ask an applicant to submit a technical report as a means of demonstrating knowledge and understanding. This report must demonstrate that the applicant has the knowledge and understanding necessary to underpin the UK-SPEC competences for the category of registration sought. Its content must be technical; a pure management study is not acceptable. The scope of the report shall depend upon the applicant’s initial qualifications and any subsequent achievement.<\\/p>\",\n       \"text\": \"A Licensee may ask an applicant to submit a technical report as a means of demonstrating knowledge and understanding. This report must demonstrate that the applicant has the knowledge and understanding necessary to underpin the UK-SPEC competences for the category of registration sought. Its content must be technical; a pure management study is not acceptable. The scope of the report shall depend upon the applicant’s initial qualifications and any subsequent achievement.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 30,\n       \"id\": \"P-030\",\n       \"clauses\": [\n        \"C-030.01\",\n        \"C-030.02\"\n       ],\n       \"html\": \"<p>While the report may include, or be largely based upon, technical reports or design studies written as part of the applicant’s normal employment, it must include a commentary identifying the contribution the reported work has made to the applicant’s knowledge and understanding, and highlight where and how engineering principles have been applied to solve problems.<\\/p>\",\n       \"text\": \"While the report may include, or be largely based upon, technical reports or design studies written as part of the applicant’s normal employment, it must include a commentary identifying the contribution the reported work has made to the applicant’s knowledge and understanding, and highlight where and how engineering principles have been applied to solve problems.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 31,\n       \"id\": \"P-031\",\n       \"clauses\": [\n        \"C-031.01\",\n        \"C-031.02\",\n        \"C-031.03\",\n        \"C-031.04\"\n       ],\n       \"html\": \"<p>The technical report shall be assessed through a process of informed peer assessment. An IEng or CEng applicant whose technical report is assessed as satisfactory shall proceed to a technical report interview. The assessors of the report and the interview must be two registrants, suitably qualified and trained to assess underpinning knowledge and understanding. The assessors shall also consider the applicant’s career history, which must demonstrate that adequate opportunity has been available to gain and demonstrate the requisite underpinning knowledge and understanding.<\\/p>\",\n       \"text\": \"The technical report shall be assessed through a process of informed peer assessment. An IEng or CEng applicant whose technical report is assessed as satisfactory shall proceed to a technical report interview. The assessors of the report and the interview must be two registrants, suitably qualified and trained to assess underpinning knowledge and understanding. The assessors shall also consider the applicant’s career history, which must demonstrate that adequate opportunity has been available to gain and demonstrate the requisite underpinning knowledge and understanding.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 32,\n       \"id\": \"P-032\",\n       \"clauses\": [\n        \"C-032.01\",\n        \"C-032.02\",\n        \"C-032.03\",\n        \"C-032.04\",\n        \"C-032.05\"\n       ],\n       \"html\": \"<p>If the technical report and technical report interview are assessed as satisfactory, then the applicant may be admitted to the interim section of the Register.<\\/p><p>A report of the technical report assessment shall be made available to the Professional Review assessors. While the Professional Review Interview may take place back-to-back with the technical report assessment interview, the two processes must be separately identified and documented.<\\/p><p>Applicants shall, in all cases, be advised of the result of the assessment and Licensees shall keep a record of the results.<\\/p>\",\n       \"text\": \"If the technical report and technical report interview are assessed as satisfactory, then the applicant may be admitted to the interim section of the Register. A report of the technical report assessment shall be made available to the Professional Review assessors. While the Professional Review Interview may take place back-to-back with the technical report assessment interview, the two processes must be separately identified and documented. Applicants shall, in all cases, be advised of the result of the assessment and Licensees shall keep a record of the results.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 33,\n       \"id\": \"P-033\",\n       \"clauses\": [\n        \"C-033.01\",\n        \"C-033.02\"\n       ],\n       \"html\": \"<p>The Professional Review process shall not be complete until the technical report has been completed and assessed, and it shall not be possible for an applicant to be successful in the Professional Review if the technical report has not been assessed as satisfactory.<\\/p>\",\n       \"text\": \"The Professional Review process shall not be complete until the technical report has been completed and assessed, and it shall not be possible for an applicant to be successful in the Professional Review if the technical report has not been assessed as satisfactory.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    }\n   ]\n  },\n  {\n   \"id\": \"S4\",\n   \"title\": \"Recognition of programmes of learning\",\n   \"subsections\": [\n    {\n     \"id\": \"S4a\",\n     \"title\": \"Recognition – general\",\n     \"paragraphs\": [\n      {\n       \"num\": 34,\n       \"id\": \"P-034\",\n       \"clauses\": [\n        \"C-034.01\",\n        \"C-034.02\",\n        \"C-034.03\"\n       ],\n       \"html\": \"<p>Programmes of learning (hereafter ‘programmes’) include degrees, apprenticeships, national and vocational learning, and other types of qualification, including those led by employers and Licensees. Recognition means that a programme fully or partially delivers the learning outcomes, and/or delivers some or all of the competences, for the relevant category of the Register set out in UK-SPEC. <a class=\\\"xref\\\" href=\\\"#P-034\\\">Paragraphs 34-37 and 40<\\/a>-42 of these regulations also apply to IPD schemes, which are further covered in <a class=\\\"xref\\\" href=\\\"#P-060\\\">paragraphs 60-66<\\/a>.<\\/p>\",\n       \"text\": \"Programmes of learning (hereafter ‘programmes’) include degrees, apprenticeships, national and vocational learning, and other types of qualification, including those led by employers and Licensees. Recognition means that a programme fully or partially delivers the learning outcomes, and/or delivers some or all of the competences, for the relevant category of the Register set out in UK-SPEC. Paragraphs 34-37 and 40-42 of these regulations also apply to IPD schemes, which are further covered in paragraphs 60-66.\",\n       \"footnotes\": [],\n       \"refs\": [\n        \"P-035\",\n        \"P-036\",\n        \"P-037\",\n        \"P-040\",\n        \"P-060\",\n        \"P-061\",\n        \"P-062\",\n        \"P-063\",\n        \"P-064\",\n        \"P-065\",\n        \"P-066\"\n       ]\n      },\n      {\n       \"num\": 35,\n       \"id\": \"P-035\",\n       \"clauses\": [\n        \"C-035.01\",\n        \"C-035.02\",\n        \"C-035.03\"\n       ],\n       \"html\": \"<p>Recognition of programmes for the purposes of registration shall only be conducted by Licensees formally licensed to do so by the Engineering Council. Licensees which recognise programmes shall establish criteria and procedures for doing so. Licensees undertaking recognition of programmes shall adopt learning outcomes derived from and meeting those in AHEP and AAQA.<\\/p>\",\n       \"text\": \"Recognition of programmes for the purposes of registration shall only be conducted by Licensees formally licensed to do so by the Engineering Council. Licensees which recognise programmes shall establish criteria and procedures for doing so. Licensees undertaking recognition of programmes shall adopt learning outcomes derived from and meeting those in AHEP and AAQA.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 36,\n       \"id\": \"P-036\",\n       \"clauses\": [\n        \"C-036.01\",\n        \"C-036.02\"\n       ],\n       \"html\": \"<p>Recognition may also attest to the acquisition of both competence and underpinning knowledge and understanding; for example, integrated programmes of learning such as apprenticeships. Where programmes that deliver competence and underpinning knowledge and understanding are to be recognised, Licensees shall adopt competence statements derived from, and meeting, those in AAQA.<\\/p>\",\n       \"text\": \"Recognition may also attest to the acquisition of both competence and underpinning knowledge and understanding; for example, integrated programmes of learning such as apprenticeships. Where programmes that deliver competence and underpinning knowledge and understanding are to be recognised, Licensees shall adopt competence statements derived from, and meeting, those in AAQA.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 37,\n       \"id\": \"P-037\",\n       \"clauses\": [\n        \"C-037.01\",\n        \"C-037.02\",\n        \"C-037.03\"\n       ],\n       \"html\": \"<p>Recognition may take the form either of approval or accreditation. Approval and accreditation are used by Licensees to recognise programmes that provide all, or some, of the underpinning knowledge and understanding, and/or develop competence for eventual registration in a particular registration category. Applicants who have completed a recognised programme will have demonstrated, fully or partially, the underpinning knowledge and understanding and/or competence requirement specified by the Licensee for the relevant category of the Register.<\\/p>\",\n       \"text\": \"Recognition may take the form either of approval or accreditation. Approval and accreditation are used by Licensees to recognise programmes that provide all, or some, of the underpinning knowledge and understanding, and/or develop competence for eventual registration in a particular registration category. Applicants who have completed a recognised programme will have demonstrated, fully or partially, the underpinning knowledge and understanding and/or competence requirement specified by the Licensee for the relevant category of the Register.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    },\n    {\n     \"id\": \"S4b\",\n     \"title\": \"Approval\",\n     \"paragraphs\": [\n      {\n       \"num\": 38,\n       \"id\": \"P-038\",\n       \"clauses\": [\n        \"C-038.01\",\n        \"C-038.02\"\n       ],\n       \"html\": \"<p>Approval of a programme of learning attests to its content. This means the overall design, depth and range of coverage, and validity and reliability of the assessment of the learner. Approval is used to recognise the underpinning knowledge and understanding covered by a programme, and can also be used to recognise the development of competence.<\\/p>\",\n       \"text\": \"Approval of a programme of learning attests to its content. This means the overall design, depth and range of coverage, and validity and reliability of the assessment of the learner. Approval is used to recognise the underpinning knowledge and understanding covered by a programme, and can also be used to recognise the development of competence.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 39,\n       \"id\": \"P-039\",\n       \"clauses\": [\n        \"C-039.01\",\n        \"C-039.02\"\n       ],\n       \"html\": \"<p>Approval attests that a programme of learning meets the learning outcomes at a specific level, as described in AHEP and AAQA, or that it develops competence at a level described in AAQA. As part of the professional review, the Licensee shall ensure that the level of the recognised programme held matches or exceeds the level of registration sought by the applicant.<\\/p>\",\n       \"text\": \"Approval attests that a programme of learning meets the learning outcomes at a specific level, as described in AHEP and AAQA, or that it develops competence at a level described in AAQA. As part of the professional review, the Licensee shall ensure that the level of the recognised programme held matches or exceeds the level of registration sought by the applicant.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    },\n    {\n     \"id\": \"S4c\",\n     \"title\": \"Accreditation\",\n     \"paragraphs\": [\n      {\n       \"num\": 40,\n       \"id\": \"P-040\",\n       \"clauses\": [\n        \"C-040.01\",\n        \"C-040.02\",\n        \"C-040.03\",\n        \"C-040.04\"\n       ],\n       \"html\": \"<p>Accreditation of a programme of learning confirms that its delivery is recognised at a specific site or sites. The accreditation process shall include a visit by the Licensee to the site of delivery. In certain circumstances visits may be remote; further guidance is available. Where the same programme is delivered at multiple sites, the accrediting Licensee(s) must satisfy themselves that standards are met at each site for which accreditation will apply. This may require additional visits.<\\/p><p>Accreditation incorporates approval: if the delivery of a programme is accredited, approval of the underlying content or syllabus is implicit.<\\/p>\",\n       \"text\": \"Accreditation of a programme of learning confirms that its delivery is recognised at a specific site or sites. The accreditation process shall include a visit by the Licensee to the site of delivery. In certain circumstances visits may be remote; further guidance is available. Where the same programme is delivered at multiple sites, the accrediting Licensee(s) must satisfy themselves that standards are met at each site for which accreditation will apply. This may require additional visits. Accreditation incorporates approval: if the delivery of a programme is accredited, approval of the underlying content or syllabus is implicit.\",\n       \"footnotes\": [\n        \"6\"\n       ],\n       \"refs\": []\n      },\n      {\n       \"num\": 41,\n       \"id\": \"P-041\",\n       \"clauses\": [\n        \"C-041.01\",\n        \"C-041.02\",\n        \"C-041.03\"\n       ],\n       \"html\": \"<p>Licensees holding a licence to recognise programmes shall appoint a committee or board that takes the decisions about whether or not a programme will be recognised. Registrants shall be in the majority on the recognition committee or board. Decisions shall be based on the report from the accreditation or approval panel.<\\/p>\",\n       \"text\": \"Licensees holding a licence to recognise programmes shall appoint a committee or board that takes the decisions about whether or not a programme will be recognised. Registrants shall be in the majority on the recognition committee or board. Decisions shall be based on the report from the accreditation or approval panel.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    },\n    {\n     \"id\": \"S4d\",\n     \"title\": \"Recognition panels, learning outcomes and decision-making\",\n     \"paragraphs\": [\n      {\n       \"num\": 42,\n       \"id\": \"P-042\",\n       \"clauses\": [\n        \"C-042.01\"\n       ],\n       \"html\": \"<p>Licensees undertaking recognition shall establish detailed criteria and procedures for recognition, whether applied by the Licensee only or within a ‘joint board’ arrangement, which shall specify:<\\/p><ul><li>the process of selecting and training accreditation or approval assessors<\\/li><li>the constitution of accreditation and approval panels;<\\/li><li>there shall be a balance of academic and industry assessors<\\/li><li>reasonable steps must be taken to avoid conflicts of interest<\\/li><li>the panel shall include assessors with experience relevant to the appropriate registration category<\\/li><li>the form of the submission required from the provider<\\/li><li>any charges which may be levied upon the provider or awarding organisation<\\/li><li>the outline agendas for accreditation visits appropriate to the range of programmes<\\/li><li>the criteria against which the judgment will be made, including learning outcomes mapped to the generic statement of learning outcomes adopted by the Licensee, as described in <a class=\\\"xref\\\" href=\\\"#P-036\\\">paragraph 36<\\/a><\\/li><li>the processes by which further consultation with the provider is carried out, decisions are made, and feedback is given to the provider concerned, and<\\/li><li>the processes by which appeals against decisions are considered, and the decisions notified to the Engineering Council.<\\/li><\\/ul>\",\n       \"text\": \"Licensees undertaking recognition shall establish detailed criteria and procedures for recognition, whether applied by the Licensee only or within a ‘joint board’ arrangement, which shall specify: the process of selecting and training accreditation or approval assessors the constitution of accreditation and approval panels; there shall be a balance of academic and industry assessors reasonable steps must be taken to avoid conflicts of interest the panel shall include assessors with experience relevant to the appropriate registration category the form of the submission required from the provider any charges which may be levied upon the provider or awarding organisation the outline agendas for accreditation visits appropriate to the range of programmes the criteria against which the judgment will be made, including learning outcomes mapped to the generic statement of learning outcomes adopted by the Licensee, as described in paragraph 36 the processes by which further consultation with the provider is carried out, decisions are made, and feedback is given to the provider concerned, and the processes by which appeals against decisions are considered, and the decisions notified to the Engineering Council.\",\n       \"footnotes\": [],\n       \"refs\": [\n        \"P-036\"\n       ]\n      },\n      {\n       \"num\": 43,\n       \"id\": \"P-043\",\n       \"clauses\": [\n        \"C-043.01\",\n        \"C-043.02\",\n        \"C-043.03\"\n       ],\n       \"html\": \"<p>In making a judgment, Licensees shall consider evidence from a range of indicators. These shall include:<\\/p><ul><li>the learning outcomes of the programme<\\/li><li>the teaching and learning processes<\\/li><li>the assessment strategies employed<\\/li><li>the human, physical and material resources involved<\\/li><li>quality assurance arrangements<\\/li><li>feedback from meetings with students<\\/li><li>how previous accreditation or approval recommendations and requirements have been dealt with, and<\\/li><li>entry to the programme and how the cohort entry extremes will be supported.<\\/li><\\/ul><p>In the case of degree accreditation, the evidence considered shall include the awarding institution’s regulations regarding progression and the award of degrees.<\\/p><p>In the case of approval of a formal qualification, they shall include:<\\/p><ul><li>that it has clearly defined outcomes and is of an appropriate technical nature, and;<\\/li><li>that it has satisfactory quality assurance arrangements.<\\/li><\\/ul>\",\n       \"text\": \"In making a judgment, Licensees shall consider evidence from a range of indicators. These shall include: the learning outcomes of the programme the teaching and learning processes the assessment strategies employed the human, physical and material resources involved quality assurance arrangements feedback from meetings with students how previous accreditation or approval recommendations and requirements have been dealt with, and entry to the programme and how the cohort entry extremes will be supported. In the case of degree accreditation, the evidence considered shall include the awarding institution’s regulations regarding progression and the award of degrees. In the case of approval of a formal qualification, they shall include: that it has clearly defined outcomes and is of an appropriate technical nature, and; that it has satisfactory quality assurance arrangements.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 44,\n       \"id\": \"P-044\",\n       \"clauses\": [\n        \"C-044.01\"\n       ],\n       \"html\": \"<p>Any decision by a Licensee to recognise a programme of learning for which it, itself, is the awarding institution, shall be submitted to the Registration Standards Committee for authorisation.<\\/p>\",\n       \"text\": \"Any decision by a Licensee to recognise a programme of learning for which it, itself, is the awarding institution, shall be submitted to the Registration Standards Committee for authorisation.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 45,\n       \"id\": \"P-045\",\n       \"clauses\": [\n        \"C-045.01\"\n       ],\n       \"html\": \"<p>In considering applications for recognition, Licensees shall:<\\/p><ul><li>recognise only programmes which provide awards granted on the basis of clearly defined learning outcomes<\\/li><li>ensure that the programme is at the appropriate level in the applicable UK qualifications framework or at an equivalent level within an appropriate international framework<\\/li><li>monitor the accuracy of information published about the programme’s recognition status and registration<\\/li><li>visit the awarding institution as part of the assessment if necessary, and<\\/li><li>ensure that where recognition will attest to acquisition of competence, the programme covers the relevant competence standards in UK-SPEC or AAQA.<\\/li><\\/ul>\",\n       \"text\": \"In considering applications for recognition, Licensees shall: recognise only programmes which provide awards granted on the basis of clearly defined learning outcomes ensure that the programme is at the appropriate level in the applicable UK qualifications framework or at an equivalent level within an appropriate international framework monitor the accuracy of information published about the programme’s recognition status and registration visit the awarding institution as part of the assessment if necessary, and ensure that where recognition will attest to acquisition of competence, the programme covers the relevant competence standards in UK-SPEC or AAQA.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 46,\n       \"id\": \"P-046\",\n       \"clauses\": [\n        \"C-046.01\",\n        \"C-046.02\",\n        \"C-046.03\",\n        \"C-046.04\",\n        \"C-046.05\",\n        \"C-046.06\"\n       ],\n       \"html\": \"<p>In the consideration of the accreditation of engineering degree programmes, Licensees shall ensure that, regardless of options taken and allowing for the maximum number of credits permitted as failed by University regulations, all students will achieve all AHEP learning outcomes. Further guidance is available.<\\/p><ul><li>Evidence that all AHEP learning outcomes are met by all variants of each programme must be provided before accreditation can be granted.<\\/li><li>No condonement of modules delivering AHEP learning outcomes is allowed.<\\/li><li>A maximum of 30 credits in a Bachelors or Integrated Masters degree programme can be compensated, and a maximum of 20 credits in a Masters degree other than the Integrated Masters degree.<\\/li><li>Major individual and group-based project modules must not be compensated.<\\/li><li>The minimum module mark for which compensation is allowed is no more than ten percentage points below the nominal module pass mark (or equivalent if a grade-based marking scheme is used).<\\/li><\\/ul>\",\n       \"text\": \"In the consideration of the accreditation of engineering degree programmes, Licensees shall ensure that, regardless of options taken and allowing for the maximum number of credits permitted as failed by University regulations, all students will achieve all AHEP learning outcomes. Further guidance is available. Evidence that all AHEP learning outcomes are met by all variants of each programme must be provided before accreditation can be granted. No condonement of modules delivering AHEP learning outcomes is allowed. A maximum of 30 credits in a Bachelors or Integrated Masters degree programme can be compensated, and a maximum of 20 credits in a Masters degree other than the Integrated Masters degree. Major individual and group-based project modules must not be compensated. The minimum module mark for which compensation is allowed is no more than ten percentage points below the nominal module pass mark (or equivalent if a grade-based marking scheme is used).\",\n       \"footnotes\": [\n        \"7\"\n       ],\n       \"refs\": []\n      }\n     ]\n    },\n    {\n     \"id\": \"S4e\",\n     \"title\": \"Recognition outcomes and renewal\",\n     \"paragraphs\": [\n      {\n       \"num\": 47,\n       \"id\": \"P-047\",\n       \"clauses\": [\n        \"C-047.01\",\n        \"C-047.02\"\n       ],\n       \"html\": \"<p>The outcome of a recognition assessment of a programme shall be one of the following:<\\/p><ul><li>The qualification or programme of learning is recognised as fully meeting the learning outcomes and/or competence statements at the requisite level.<\\/li><li>The qualification or programme of learning is recognised as partially meeting the learning outcomes and/or competence statements at the requisite level.<\\/li><li>Either of the above, and additionally that the programme fully or partially meets the competence requirement for the relevant category of UK-SPEC.<\\/li><li>Either of the above, provided specified constraints are met and/or specified modifications are made within a set timetable. Licensees shall notify the Engineering Council about any constraints which would restrict the eligibility of award holders.<\\/li><li>The qualification or programme of learning is not recognised.<\\/li><\\/ul>\",\n       \"text\": \"The outcome of a recognition assessment of a programme shall be one of the following: The qualification or programme of learning is recognised as fully meeting the learning outcomes and/or competence statements at the requisite level. The qualification or programme of learning is recognised as partially meeting the learning outcomes and/or competence statements at the requisite level. Either of the above, and additionally that the programme fully or partially meets the competence requirement for the relevant category of UK-SPEC. Either of the above, provided specified constraints are met and/or specified modifications are made within a set timetable. Licensees shall notify the Engineering Council about any constraints which would restrict the eligibility of award holders. The qualification or programme of learning is not recognised.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 48,\n       \"id\": \"P-048\",\n       \"clauses\": [\n        \"C-048.01\"\n       ],\n       \"html\": \"<p>Programmes shall be recognised for a fixed period of not more than five years.<\\/p>\",\n       \"text\": \"Programmes shall be recognised for a fixed period of not more than five years.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 49,\n       \"id\": \"P-049\",\n       \"clauses\": [\n        \"C-049.01\",\n        \"C-049.02\"\n       ],\n       \"html\": \"<p>Where a programme has been recognised and its curriculum does not change during the five year period, recognition may be renewed if the Licensee is satisfied that it remains relevant and continues to meet the required standards.<\\/p><p>Recognition may be extended by a maximum of one year, once only per recognition period.<\\/p>\",\n       \"text\": \"Where a programme has been recognised and its curriculum does not change during the five year period, recognition may be renewed if the Licensee is satisfied that it remains relevant and continues to meet the required standards. Recognition may be extended by a maximum of one year, once only per recognition period.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 50,\n       \"id\": \"P-050\",\n       \"clauses\": [\n        \"C-050.01\",\n        \"C-050.02\"\n       ],\n       \"html\": \"<p>Recognition may be backdated to allow cohorts whose work has been reviewed as part of the recognition process to benefit from the decision. Backdating should apply for a period immediately before forwards recognition being considered. Earlier backdating may be considered for RSC authorisation on a case-by-case basis. Such decisions must be fully documented, transparent and auditable.<\\/p>\",\n       \"text\": \"Recognition may be backdated to allow cohorts whose work has been reviewed as part of the recognition process to benefit from the decis
