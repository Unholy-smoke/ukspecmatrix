ght: 600;\n  font-display: swap;\n  src: url(\"be4ec302-6ee7-46d0-b012-af674f2b13a1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3c2b27fa-90c3-457f-bf21-4276640753ac\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"8c104299-275d-4dd8-a4f3-8a30ff91596c\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"eeaeab0b-bdd0-496a-bd93-56a28344d012\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"be4ec302-6ee7-46d0-b012-af674f2b13a1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"3c2b27fa-90c3-457f-bf21-4276640753ac\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"8c104299-275d-4dd8-a4f3-8a30ff91596c\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"eeaeab0b-bdd0-496a-bd93-56a28344d012\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"be4ec302-6ee7-46d0-b012-af674f2b13a1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"3c2b27fa-90c3-457f-bf21-4276640753ac\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ------------------------------------------------------------------\n   Engineering Council — Colour tokens\n   --------------------------------------------------------------------\n   Copper is the HERO colour and should feature prominently. Despite its\n   name, the brand \"Copper\" is a bright aqua/turquoise (#35ffdc,\n   Pantone 333C) — the colour the brand wants to be known for.\n\n   Black provides strong contrast with Copper. Three supporting tones —\n   Orange, Blue, Red — add flexibility and are typically used as\n   background colours with black or white text over them.\n\n   Colour rules (from the guidelines):\n     • Never place Copper directly beside a supporting colour — always\n       keep visual separation.\n     • Copper on Black for headlines and large page titles.\n     • Supporting colours are usually background colours.\n     • Lead with Copper for hero communications; a supporting colour may\n       lead day-to-day design (social, slides).\n   ------------------------------------------------------------------ */\n\n:root {\n  /* ---- Brand palette (raw values) ---- */\n  --ec-copper: #35ffdc;   /* HERO — Pantone 333C */\n  --ec-orange: #ff9c3e;   /* Pantone 157C */\n  --ec-blue:   #4797f7;   /* Pantone 2727C */\n  --ec-red:    #ff7277;   /* Pantone 1777C */\n  --ec-black:  #000000;\n  --ec-white:  #ffffff;\n\n  /* ---- Accessibility text-blacks (WCAG AAA) ----\n     Use these instead of pure black when text sits ON a brand colour. */\n  --ec-black-on-blue:   #010000; /* black text over Blue */\n  --ec-black-on-warm:   #1d1d1b; /* black text over Copper, Orange, Red */\n\n  /* ---- Neutral scale (derived, for UI surfaces & borders) ---- */\n  --ec-ink:      #000000; /* primary text */\n  --ec-ink-2:    #1d1d1b; /* near-black text on warm colour */\n  --ec-grey-900: #111110;\n  --ec-grey-700: #3a3a37;\n  --ec-grey-600: #5c5c58;\n  --ec-grey-500: #78787330;\n  --ec-grey-500-solid: #787873;\n  --ec-grey-400: #a3a39d;\n  --ec-grey-300: #cfcfc9;\n  --ec-grey-200: #e6e6e1;\n  --ec-grey-100: #f2f2ee;\n  --ec-grey-050: #f9f9f6;\n\n  /* ---- Copper tint (for subtle fills on light UI) ---- */\n  --ec-copper-tint:   #e4fff9;\n  --ec-copper-strong: #10c9a6; /* accessible copper for small text/links on white */\n\n  /* =============================================================\n     SEMANTIC ALIASES — reference these in components, not the raw\n     values above.\n     ============================================================= */\n\n  /* Surfaces */\n  --surface-page:      var(--ec-white);\n  --surface-inverse:   var(--ec-black);\n  --surface-card:      var(--ec-white);\n  --surface-muted:     var(--ec-grey-050);\n  --surface-sunken:    var(--ec-grey-100);\n  --surface-copper:    var(--ec-copper);\n  --surface-orange:    var(--ec-orange);\n  --surface-blue:      var(--ec-blue);\n  --surface-red:       var(--ec-red);\n\n  /* Text */\n  --text-body:         var(--ec-ink);\n  --text-muted:        var(--ec-grey-600);\n  --text-subtle:       var(--ec-grey-500-solid);\n  --text-on-inverse:   var(--ec-white);\n  --text-on-copper:    var(--ec-black-on-warm);\n  --text-on-blue:      var(--ec-black-on-blue);\n  --text-link:         var(--ec-copper-strong);\n\n  /* Borders & lines */\n  --border-default:    var(--ec-grey-200);\n  --border-strong:     var(--ec-grey-300);\n  --border-ink:        var(--ec-black);\n  --border-focus:      var(--ec-blue);\n\n  /* Interactive (actions lead with Copper on Black or Black on Copper) */\n  --action-primary-bg:       var(--ec-black);\n  --action-primary-fg:       var(--ec-copper);\n  --action-primary-hover-bg: var(--ec-grey-900);\n  --action-secondary-bg:     var(--ec-copper);\n  --action-secondary-fg:     var(--ec-black-on-warm);\n  --action-secondary-hover-bg:#2be6c5;\n\n  /* Feedback (reuse brand supporting tones) */\n  --feedback-info:     var(--ec-blue);\n  --feedback-warning:  var(--ec-orange);\n  --feedback-danger:   var(--ec-red);\n  --feedback-success:  var(--ec-copper-strong);\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Typography tokens\n   --------------------------------------------------------------------\n   Primary typeface: Söhne (substituted here with Hanken Grotesk).\n   Fallback / Office system font: Aptos.\n\n   Type styles (from the guidelines):\n     • Display  — Söhne Halbfett (700), ALL CAPS, short phrases only.\n     • Headline — Söhne Kräftig (600), sentence case.\n     • Body     — Söhne Buch (400).\n     • Paragraph titles — Söhne Kräftig (600).\n\n   General rules: no custom kerning / tracking. Text is aligned left or\n   centred. Line-height 120–130% based on size.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* Families */\n  --font-brand: 'Hanken Grotesk', 'Söhne', 'Aptos', -apple-system, 'Segoe UI', system-ui, sans-serif;\n  --font-sans:  var(--font-brand);\n  --font-mono:  ui-monospace, 'SFMono-Regular', 'Consolas', monospace;\n\n  /* Weights (mapped from Söhne: Leicht/Buch/Kräftig/Halbfett) */\n  --fw-light:    300; /* @kind font */\n  --fw-book:     400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* Fluid display sizes (clamped for responsive hero use) */\n  --fs-display-xl: clamp(3rem, 1.5rem + 6vw, 6rem); /* @kind other */\n  --fs-display-lg: clamp(2.5rem, 1.4rem + 4.5vw, 4.5rem); /* @kind other */\n  --fs-display-md: clamp(2rem, 1.2rem + 3vw, 3.25rem); /* @kind other */\n\n  /* Static type scale */\n  --fs-h1: 2.5rem; /* @kind font */\n  --fs-h2: 2rem; /* @kind font */\n  --fs-h3: 1.5rem; /* @kind font */\n  --fs-h4: 1.25rem; /* @kind font */\n  --fs-lead: 1.25rem; /* @kind font */\n  --fs-body: 1rem; /* @kind font */\n  --fs-sm: 0.875rem; /* @kind font */\n  --fs-xs: 0.75rem; /* @kind font */\n  --fs-eyebrow: 0.8125rem; /* @kind font */\n\n  /* Line-heights (120–130% brand range; looser for body) */\n  --lh-display: 1.05; /* @kind font */\n  --lh-heading: 1.15; /* @kind font */\n  --lh-snug:    1.25; /* @kind font */\n  --lh-body:    1.5; /* @kind font */\n\n  /* Letter-spacing — brand avoids tracking; only eyebrows get a touch */\n  --ls-tight:   -0.01em; /* @kind font */\n  --ls-normal:  0; /* @kind font */\n  --ls-eyebrow: 0.08em; /* @kind font */\n\n  /* Semantic aliases */\n  --text-display-weight: var(--fw-bold);\n  --text-heading-weight: var(--fw-semibold);\n  --text-body-weight:    var(--fw-book);\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Spacing & layout tokens\n   --------------------------------------------------------------------\n   The brand embraces clean lines and purposeful negative space, so the\n   spacing scale is generous. 4px base unit.\n   ------------------------------------------------------------------ */\n\n:root {\n  --space-0:  0;\n  --space-1:  0.25rem;  /* 4  */\n  --space-2:  0.5rem;   /* 8  */\n  --space-3:  0.75rem;  /* 12 */\n  --space-4:  1rem;     /* 16 */\n  --space-5:  1.5rem;   /* 24 */\n  --space-6:  2rem;     /* 32 */\n  --space-7:  3rem;     /* 48 */\n  --space-8:  4rem;     /* 64 */\n  --space-9:  6rem;     /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-narrow: 760px;\n  --gutter: clamp(1rem, 4vw, 3rem); /* @kind spacing */\n  --section-y: clamp(3rem, 6vw, 6rem); /* @kind spacing */\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Radius, borders, shadow & the Stack shape\n   --------------------------------------------------------------------\n   The signature brand device is \"The Stack\": a rectangle with a curved\n   (semicircle) edge at the beginning OR the end, inspired by the bars of\n   the monogram. The --stack-radius token drives that half-round end.\n\n   The overall visual style is refined and sharp with clean lines, so\n   general UI radii are modest and elevation is used sparingly.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* General UI radii */\n  --radius-none: 0;\n  --radius-xs: 3px;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-pill: 999px;      /* fully rounded — both ends (stadium) */\n\n  /* The Stack — half-round end. Applied to one side only, e.g.\n     border-radius: 0 var(--stack-radius) var(--stack-radius) 0; */\n  --stack-radius: 999px;\n\n  /* Border widths */\n  --border-1: 1px; /* @kind other */\n  --border-2: 2px; /* @kind other */\n\n  /* Elevation — sparing, neutral, low-spread. */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);\n  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.08);\n  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);\n\n  /* Focus ring */\n  --ring-focus: 0 0 0 3px rgba(71, 151, 247, 0.45); /* Blue @ 45% */\n\n  /* Motion — calm, confident. Short fades / eases; no bounce. */\n  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-med: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Base element defaults\n   --------------------------------------------------------------------\n   Light, unobtrusive resets + brand typographic defaults. Keeps\n   specimens and consuming pages consistent without heavy opinionated\n   normalisation.\n   ------------------------------------------------------------------ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-brand);\n  font-weight: var(--fw-book);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headlines — Söhne Kräftig (600), sentence case, tight leading */\nh1, h2, h3, h4, h5, h6 {\n  margin: 0 0 0.5em;\n  font-weight: var(--fw-semibold);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--ls-tight);\n  color: var(--text-body);\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); }\nh4 { font-size: var(--fs-h4); }\n\np { margin: 0 0 1em; text-wrap: pretty; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; }\n\n/* Display utility — Söhne Halbfett, ALL CAPS, short phrases only */\n.ec-display {\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-display-lg);\n  line-height: var(--lh-display);\n  letter-spacing: var(--ls-tight);\n  text-transform: uppercase;\n}\n\n/* Eyebrow / label */\n.ec-eyebrow {\n  font-size: var(--fs-eyebrow);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--ring-focus);\n  border-radius: var(--radius-xs);\n}\n\nimg { max-width: 100%; display: block; }\n\n<\u002Fstyle>\n<script src=\"54dd3a1a-672d-4109-9ac6-4c34e35c5382\"><\u002Fscript>\n<style>\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%}\nbody{font-family:var(--font-brand);background:var(--ec-white);color:var(--ec-ink);-webkit-font-smoothing:antialiased}\na{color:var(--ec-copper-strong);text-decoration:none}\na:hover{color:var(--ec-copper-strong);text-decoration:underline}\nsummary{list-style:none}\nsummary::-webkit-details-marker{display:none}\n:focus-visible{outline:3px solid var(--ec-blue);outline-offset:2px}\n.rfr-app{display:flex;flex-direction:column;height:100vh;min-height:0}\n\n/* ---- sticky top: header + banner ---- */\n.rfr-top{flex:none;position:relative;z-index:40}\n.rfr-header{background:var(--ec-black);color:#fff;display:flex;align-items:center;gap:26px;padding:0 28px;height:66px}\n.rfr-header-nav{display:flex;gap:20px;flex:1;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden}\n.rfr-header-nav a{color:#fff}\n.rfr-header-nav a.here{color:var(--ec-copper)}\n.rfr-header-ed{font-size:12.5px;color:var(--ec-grey-400);white-space:nowrap}\n.rfr-menu-btn{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:8px;margin-left:-8px}\n.rfr-menu-btn span{width:22px;height:2px;background:#fff;display:block}\n.rfr-banner{background:var(--ec-orange);color:var(--ec-black-on-warm);padding:9px 28px;font-size:13.5px;line-height:1.45;display:flex;gap:10px;align-items:baseline}\n.rfr-banner strong{font-weight:700;letter-spacing:.03em;text-transform:uppercase;font-size:12px}\n\n/* ---- layout row ---- */\n.rfr-row{display:flex;flex:1;min-height:0}\n\n/* ---- nav ---- */\n.rfr-nav{flex:none;width:340px;background:var(--ec-grey-050);border-right:1px solid var(--border-default);display:flex;flex-direction:column;min-height:0}\n.rfr-nav-scroll{flex:1;overflow:auto;padding:20px 16px 40px}\n.rfr-search{position:relative;display:flex;align-items:center;background:#fff;border:1.5px solid var(--border-strong);border-radius:999px;padding:0 12px;height:44px;margin-bottom:6px}\n.rfr-search:focus-within{border-color:var(--ec-blue);box-shadow:0 0 0 3px rgba(71,151,247,.25)}\n.rfr-search svg{flex:none;color:var(--ec-grey-500-solid)}\n.rfr-search input{flex:1;border:none;outline:none;background:none;font:inherit;font-size:15px;padding:0 8px;min-width:0}\n.rfr-search-clear{display:none;background:none;border:none;cursor:pointer;color:var(--ec-grey-600);font-size:18px;line-height:1;padding:4px}\n.rfr-search-clear.on{display:block}\n.rfr-status{margin:0 0 14px;padding:0 6px;font-size:12px;color:var(--ec-grey-600);min-height:15px}\n.rfr-nav-h{margin:14px 6px 6px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ec-grey-500-solid)}\n.rfr-nav-link{display:flex;justify-content:space-between;gap:10px;align-items:baseline;text-decoration:none;color:var(--ec-grey-700);padding:7px 10px;border-radius:7px;border-left:2px solid transparent;font-size:13.5px;line-height:1.4}\n.rfr-nav-link:hover{background:var(--ec-copper-tint);text-decoration:none;color:var(--ec-ink)}\n.rfr-nav-link.active{color:var(--ec-ink);font-weight:600;background:#fff;border-left-color:var(--ec-copper);box-shadow:var(--shadow-sm)}\n.rfr-nav-sec{margin-top:4px}\n.rfr-nav-sum{display:flex;align-items:baseline;gap:10px;cursor:pointer;padding:9px 10px;border-radius:7px;border-left:2px solid transparent}\n.rfr-nav-sum:hover{background:var(--ec-copper-tint)}\n.rfr-nav-sum.active{background:#fff;border-left-color:var(--ec-copper);box-shadow:var(--shadow-sm)}\n.rfr-nav-secnum{flex:none;width:22px;height:16px;display:flex;align-items:center;justify-content:center;background:var(--ec-copper);color:var(--ec-black-on-warm);font-weight:700;font-size:10.5px;border-radius:0 999px 999px 0}\n.rfr-nav-sectitle{flex:1;font-size:14px;font-weight:600;color:var(--ec-ink);line-height:1.35}\n.rfr-nav-toggle{flex:none;background:none;border:none;cursor:pointer;padding:5px;margin:-5px;display:flex;border-radius:6px;color:var(--ec-grey-500-solid)}\n.rfr-nav-toggle:hover{background:rgba(0,0,0,.08);color:var(--ec-ink)}\n.rfr-nav-toggle .chev{font-size:11px;transition:transform .2s ease;display:block}\n.rfr-nav-sec[open]>.rfr-nav-sum .rfr-nav-toggle .chev{transform:rotate(180deg)}\n.rfr-nav-subs{padding:2px 0 6px 14px;display:flex;flex-direction:column;gap:1px}\n.rfr-nav-sub.dimmed{opacity:.32}\n.rfr-nav-count{flex:none;font:700 11px ui-monospace,Menlo,monospace;color:var(--ec-copper-strong)}\n.rfr-nav-foot{border-top:1px solid var(--border-default);padding:14px 20px;display:flex;flex-direction:column;gap:6px}\n.rfr-nav-foot a{font-size:13px;color:var(--ec-copper-strong)}\n.rfr-print{margin-top:8px;background:none;border:1.5px solid var(--ec-black);color:var(--ec-ink);font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}\n.rfr-print:hover{background:var(--ec-black);color:var(--ec-copper)}\n\n/* ---- main ---- */\n.rfr-main{flex:1;min-width:0;overflow:auto;position:relative;scroll-behavior:smooth;background:#fff}\n.rfr-hero{background:var(--ec-black);color:#fff;padding:56px 48px 46px}\n.rfr-hero-inner{max-width:860px;margin:0 auto}\n.rfr-hero-kicker{margin:0 0 18px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ec-grey-400)}\n.rfr-hero-title{margin:0 0 20px;font-size:66px;line-height:1.0;font-weight:700;text-transform:uppercase;color:var(--ec-copper)}\n.rfr-hero-lead{margin:0;font-size:19px;line-height:1.55;max-width:640px;color:var(--ec-grey-100);text-wrap:pretty}\n.rfr-hero-stats{display:flex;gap:52px;border-top:1px solid rgba(255,255,255,.14);padding-top:24px;margin-top:34px;flex-wrap:wrap}\n.rfr-hero-stats .v{margin:0;font-size:34px;font-weight:700;color:var(--ec-copper)}\n.rfr-hero-stats .l{margin:4px 0 0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ec-grey-400)}\n\n.rfr-doc{max-width:860px;margin:0 auto;padding:44px 48px 80px}\n\n/* ---- front matter ---- */\n.rfr-fm{padding-bottom:34px;margin-bottom:34px;border-bottom:1px solid var(--border-default)}\n.rfr-fm-title{margin:0 0 16px;font-size:28px;font-weight:600;color:var(--ec-ink);scroll-margin-top:20px}\n.rfr-fm-body{font-size:16px;line-height:1.7;color:var(--ec-grey-700)}\n.rfr-fm-body p{margin:0 0 12px}\n\n/* ---- section / subsection ---- */\n.rfr-sec{margin-top:8px}\n.rfr-sec-head{padding:26px 0 20px;scroll-margin-top:20px}\n.rfr-sec-kicker{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ec-grey-600);margin-bottom:14px}\n.rfr-sec-kicker::before{content:\"\";width:34px;height:12px;background:var(--ec-copper);border-radius:0 999px 999px 0}\n.rfr-sec-title{margin:0;font-size:34px;font-weight:700;line-height:1.1;color:var(--ec-ink);text-wrap:pretty}\n.rfr-sub{scroll-margin-top:20px}\n.rfr-sub-title{margin:24px 0 4px;font-size:19px;font-weight:600;color:var(--ec-copper-strong);text-wrap:pretty}\n\n/* ---- paragraph ---- */\n.rfr-para{position:relative;display:grid;grid-template-columns:56px 1fr;gap:22px;padding:16px 0;scroll-margin-top:24px;border-radius:8px}\n.rfr-para+.rfr-para{border-top:1px solid var(--ec-grey-050)}\n.rfr-para:focus-visible{outline:3px solid var(--ec-blue);outline-offset:3px}\n.rfr-para-num{font-size:26px;font-weight:300;line-height:1.2;color:var(--ec-copper-strong);text-align:right;user-select:none}\n.rfr-para-main{min-width:0}\n.rfr-para-body{font-size:16.5px;line-height:1.68;color:var(--ec-ink)}\n.rfr-para-body p{margin:0 0 12px}\n.rfr-para-body p:last-child{margin-bottom:0}\n.rfr-para-body ul{margin:11px 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}\n.rfr-para-body li{position:relative;padding-left:26px;line-height:1.6}\n.rfr-para-body li::before{content:\"\";position:absolute;left:0;top:.62em;width:14px;height:7px;background:var(--ec-copper);border-radius:0 999px 999px 0}\n.rfr-flash{animation:rfrflash 1.7s ease}\n@keyframes rfrflash{0%,22%{background:var(--ec-copper-tint)}100%{background:transparent}}\n\n/* inline enriched bits */\n.xref{color:var(--ec-copper-strong);font-weight:500;border-bottom:1px solid rgba(16,201,166,.4)}\n.xref:hover{text-decoration:none;border-bottom-color:currentColor}\n.rfr-ext{color:var(--ec-copper-strong);border-bottom:1px solid rgba(16,201,166,.35)}\n.rfr-ext:hover{text-decoration:none;border-bottom-color:currentColor}\n.rfr-ext-icon{font-size:.78em;vertical-align:.15em;margin-left:1px}\n.rfr-footlink{font-size:.82em;vertical-align:.14em;font-weight:600;white-space:nowrap;margin-left:2px}\n.rfr-ext-stub{background:none;border:none;padding:0;font:inherit;color:var(--ec-grey-700);cursor:help;border-bottom:1px dashed var(--ec-grey-400)}\n.rfr-term{background:none;border:none;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1.6px dotted var(--ec-copper-strong)}\n.rfr-term:hover{color:var(--ec-copper-strong)}\nmark{background:var(--ec-copper);color:var(--ec-black-on-warm);border-radius:2px;padding:0 1px}\n\n/* footnotes */\n.rfr-fn-wrap{line-height:0}\n.rfr-fn{background:var(--ec-copper-tint);border:1px solid var(--ec-copper-strong);color:var(--ec-copper-strong);font:700 10px/1 var(--font-brand);cursor:pointer;border-radius:4px;padding:2px 4px;vertical-align:super;margin-left:1px}\n.rfr-fn[aria-expanded=\"true\"]{background:var(--ec-copper-strong);color:#fff}\n.rfr-fn-panel{margin:12px 0 4px;background:var(--ec-grey-050);border-left:3px solid var(--ec-copper-strong);border-radius:0 8px 8px 0;padding:12px 16px;font-size:13.5px;line-height:1.6;color:var(--ec-grey-700)}\n.rfr-fn-panel::before{content:\"Footnote\";display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ec-grey-500-solid);margin-bottom:4px}\n\n/* hover chip */\n.rfr-chip{position:absolute;top:8px;right:0;display:flex;align-items:center;gap:2px;background:var(--ec-black);border-radius:999px;padding:4px 6px 4px 12px;opacity:0;transform:translateY(-3px);transition:opacity .13s ease,transform .13s ease;pointer-events:none;box-shadow:var(--shadow-md);z-index:5}\n.rfr-para:hover .rfr-chip,.rfr-para:focus-within .rfr-chip,.rfr-chip:focus-within{opacity:1;transform:none;pointer-events:auto}\n.rfr-chip-id{font:600 11px ui-monospace,Menlo,monospace;color:var(--ec-copper);padding-right:4px}\n.rfr-chip-btn{background:none;border:none;cursor:pointer;color:#fff;font:600 11.5px/1 var(--font-brand);padding:5px 8px;border-radius:999px}\n.rfr-chip-btn:hover{background:rgba(255,255,255,.14)}\n.rfr-chip-clauses{margin:6px 0 0;font:500 11px ui-monospace,Menlo,monospace;color:var(--ec-grey-500-solid);word-spacing:2px}\n\n/* guidance overlay */\n.rfr-guid{margin-top:14px}\n.rfr-guid-toggle{display:inline-flex;align-items:center;gap:8px;background:none;border:1.5px solid var(--ec-blue);color:#116; color:var(--ec-black-on-blue);background:rgba(71,151,247,.1);font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer}\n.rfr-guid-toggle:hover{background:rgba(71,151,247,.2)}\n.rfr-guid-toggle .ic{font-size:15px;line-height:1;color:var(--ec-blue)}\n.rfr-guid-panel{margin-top:12px;background:#eef5fe;border:1px solid rgba(71,151,247,.5);border-left:4px solid var(--ec-blue);border-radius:0 10px 10px 0;padding:18px 20px}\n.rfr-guid-panel[hidden]{display:none}\n.rfr-guid-badge{display:inline-block;background:var(--ec-blue);color:var(--ec-black-on-blue);font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:999px;margin-bottom:10px}\n.rfr-guid-panel h4{margin:0 0 8px;font-size:16px;font-weight:700;color:var(--ec-ink)}\n.rfr-guid-panel p{margin:0;font-size:14.5px;line-height:1.62;color:var(--ec-grey-700)}\n\n/* footer */\n.rfr-foot{background:var(--ec-black);color:var(--ec-grey-400);padding:30px 48px}\n.rfr-foot-inner{max-width:860px;margin:0 auto;display:flex;gap:22px;align-items:baseline;flex-wrap:wrap}\n.rfr-foot-inner span{flex:1;font-size:12px;min-width:220px}\n.rfr-foot-inner a{color:var(--ec-copper);font-size:13.5px}\n\n/* popover */\n.rfr-pop{position:fixed;inset:auto;margin:0;width:360px;max-width:90vw;background:var(--ec-white);color:var(--ec-ink);border:2px solid var(--ec-black);border-radius:12px;padding:18px 20px;box-shadow:0 14px 40px rgba(0,0,0,.24);font-family:var(--font-brand)}\n.rfr-pop-kicker{margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ec-grey-600)}\n.rfr-pop-title{margin:0 0 8px;font-size:17px;font-weight:700}\n.rfr-pop-body{margin:0;font-size:14.5px;line-height:1.6;color:var(--ec-grey-700)}\n.rfr-pop-tag{display:inline-block;margin-top:12px;background:var(--ec-copper-tint);color:var(--ec-copper-strong);font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px}\n\n/* mobile drawer */\n.rfr-backdrop{display:none}\n@media(max-width:880px){\n  .rfr-menu-btn{display:flex}\n  .rfr-header-nav{display:none}\n  .rfr-nav{position:fixed;top:0;left:0;bottom:0;z-index:70;width:86%;max-width:350px;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 50px rgba(0,0,0,.35)}\n  .rfr-app.nav-open .rfr-nav{transform:none}\n  .rfr-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:65}\n  .rfr-app.nav-open .rfr-backdrop{display:block}\n  .rfr-hero{padding:38px 22px 34px}\n  .rfr-hero-title{font-size:42px}\n  .rfr-doc{padding:28px 20px 64px}\n  .rfr-para{grid-template-columns:38px 1fr;gap:14px}\n  .rfr-para-num{font-size:20px}\n  .rfr-chip{position:static;opacity:1;transform:none;pointer-events:auto;margin-top:10px;justify-content:flex-start;box-shadow:none;background:var(--ec-grey-050);padding:6px 8px 6px 12px}\n  .rfr-chip-id{color:var(--ec-copper-strong)}\n  .rfr-chip-btn{color:var(--ec-ink)}\n  .rfr-foot{padding:26px 20px}\n}\n@media(prefers-reduced-motion:reduce){\n  .rfr-main{scroll-behavior:auto}\n  .rfr-flash{animation:none}\n  .rfr-nav,.rfr-chip,.rfr-nav-sum .chev{transition:none}\n}\n@media print{\n  .rfr-top,.rfr-nav,.rfr-backdrop,.rfr-chip,.rfr-foot{display:none!important}\n  .rfr-app,.rfr-row,.rfr-main{display:block;height:auto;overflow:visible}\n  .rfr-para{display:grid!important;break-inside:avoid}\n  .rfr-hero{background:#fff;color:#000;padding:0 0 20px}\n  .rfr-hero-title{color:#000;font-size:34px}\n  .rfr-hero-kicker,.rfr-hero-lead,.rfr-hero-stats .l{color:#333}\n  .rfr-hero-stats .v{color:#000}\n  .rfr-guid-panel,.rfr-fn-panel{display:block!important}\n  .rfr-print-banner{display:block;border:2px solid var(--ec-orange);padding:8px 12px;margin-bottom:16px;font-size:12px;font-weight:600}\n}\n.rfr-print-banner{display:none}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"rfr-app\" id=\"rfr-app\">\n  <div class=\"rfr-top\">\n    <header class=\"rfr-header\">\n      <button type=\"button\" class=\"rfr-menu-btn\" aria-label=\"Open contents\" sc-camel-on-click=\"{{ toggleNav }}\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fbutton>\n      <x-import component-from-global-scope=\"EngineeringCouncilDesignSystem_019dd8.Logo\" tone=\"copper-on-black\" height=\"30\" hint-size=\"140px,30px\"><\u002Fx-import>\n      <nav class=\"rfr-header-nav\" aria-label=\"Main\">\n        <a href=\"#rfr-app\" class=\"here\">Our role as regulator<\u002Fa>\n        <a href=\"#rfr-app\">Registration<\u002Fa>\n        <a href=\"#rfr-app\">Guidance<\u002Fa>\n        <a href=\"#rfr-app\">Education &amp; skills<\u002Fa>\n        <a href=\"#rfr-app\">International<\u002Fa>\n      <\u002Fnav>\n      <span class=\"rfr-header-ed\">RfR · fourth edition<\u002Fspan>\n    <\u002Fheader>\n    <div class=\"rfr-banner\" role=\"note\" aria-label=\"Prototype notice\">\n      <strong>Prototype<\u002Fstrong>\n      <span>Presents RfR 4.4 content in a digital-first format. Not an authoritative version of the Regulations.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"rfr-row\">\n    <aside class=\"rfr-nav\" id=\"rfr-nav\" aria-label=\"Contents and search\">\n      <div class=\"rfr-nav-scroll\">\n        <div class=\"rfr-search\" role=\"search\">\n          <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"21\" y1=\"21\" x2=\"16.5\" y2=\"16.5\"><\u002Fline><\u002Fsvg>\n          <input id=\"rfr-q\" type=\"search\" autocomplete=\"off\" spellcheck=\"false\" placeholder=\"Search the regulations…\" aria-label=\"Search the regulations\">\n          <button type=\"button\" class=\"rfr-search-clear\" id=\"rfr-clear\" aria-label=\"Clear search\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <p class=\"rfr-status\" id=\"rfr-status\" role=\"status\" aria-live=\"polite\"><\u002Fp>\n\n        <nav aria-label=\"Document contents\">\n          <p class=\"rfr-nav-h\">Front matter<\u002Fp>\n          <sc-for list=\"{{ navFront }}\" as=\"f\" hint-placeholder-count=\"2\">\n            <a class=\"rfr-nav-link\" href=\"#{{ f.anchor }}\" data-nav=\"{{ f.anchor }}\" sc-camel-on-click=\"{{ navClick }}\"><span>{{ f.title }}<\u002Fspan><\u002Fa>\n          <\u002Fsc-for>\n\n          <p class=\"rfr-nav-h\">The Regulations<\u002Fp>\n          <sc-for list=\"{{ navSections }}\" as=\"s\" hint-placeholder-count=\"7\">\n            <details class=\"rfr-nav-sec\" open=\"\" data-sec=\"{{ s.id }}\">\n              <summary class=\"rfr-nav-sum\" data-nav=\"{{ s.anchor }}\" sc-camel-on-click=\"{{ navClick }}\">\n                <span class=\"rfr-nav-secnum\" aria-hidden=\"true\">{{ s.num }}<\u002Fspan>\n                <span class=\"rfr-nav-sectitle\">{{ s.title }}<\u002Fspan>\n                <sc-if value=\"{{ s.hasSubs }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" class=\"rfr-nav-toggle\" aria-label=\"Show or hide subsections\" sc-camel-on-click=\"{{ toggleSec }}\"><span class=\"chev\" aria-hidden=\"true\">▾<\u002Fspan><\u002Fbutton><\u002Fsc-if>\n              <\u002Fsummary>\n              <div class=\"rfr-nav-subs\">\n                <sc-for list=\"{{ s.subs }}\" as=\"sub\" hint-placeholder-count=\"2\">\n                  <a class=\"rfr-nav-link rfr-nav-sub\" href=\"#{{ sub.anchor }}\" data-nav=\"{{ sub.anchor }}\" data-subid=\"{{ sub.id }}\" sc-camel-on-click=\"{{ navClick }}\"><span>{{ sub.title }}<\u002Fspan><span class=\"rfr-nav-count\" data-count-for=\"{{ sub.id }}\"><\u002Fspan><\u002Fa>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdetails>\n          <\u002Fsc-for>\n        <\u002Fnav>\n      <\u002Fdiv>\n      <div class=\"rfr-nav-foot\">\n        <a href=\"https://www.engc.org.uk/\" target=\"_blank\" rel=\"noopener\">Engineering Council website ↗<\u002Fa>\n        <button type=\"button\" class=\"rfr-print\" sc-camel-on-click=\"{{ printPage }}\">Print / save PDF<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Faside>\n\n    <main class=\"rfr-main\" id=\"rfr-main\" tabindex=\"-1\">\n      <div class=\"rfr-hero\">\n        <div class=\"rfr-hero-inner\">\n          <p class=\"rfr-hero-kicker\">Engineering Council<\u002Fp>\n          <h1 class=\"rfr-hero-title\">Regulations for<br>Registration<\u002Fh1>\n          <p class=\"rfr-hero-lead\">The Regulations that Licensees of the Engineering Council must adhere to when registering applicants, recognising programmes of learning and development, and undertaking related processes.<\u002Fp>\n          <div class=\"rfr-hero-stats\">\n            <div><p class=\"v\">7<\u002Fp><p class=\"l\">Sections<\u002Fp><\u002Fdiv>\n            <div><p class=\"v\">73<\u002Fp><p class=\"l\">Paragraphs<\u002Fp><\u002Fdiv>\n            <div><p class=\"v\">4.4<\u002Fp><p class=\"l\">Fourth edition · March 2025<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"rfr-doc\" id=\"rfr-doc\">\n        <p class=\"rfr-print-banner\">PROTOTYPE – presents RfR 4.4 content in a digital-first format. Not an authoritative version of the Regulations.<\u002Fp>\n      <\u002Fdiv>\n      <footer class=\"rfr-foot\">\n        <div class=\"rfr-foot-inner\">\n          <span>© Engineering Council 2026. Registered Charity Number 286142. This digital prototype is not an authoritative version of the Regulations for Registration.<\u002Fspan>\n          <a href=\"https://www.engc.org.uk/\" target=\"_blank\" rel=\"noopener\">engc.org.uk ↗<\u002Fa>\n        <\u002Fdiv>\n      <\u002Ffooter>\n    <\u002Fmain>\n\n    <div class=\"rfr-backdrop\" id=\"rfr-backdrop\" sc-camel-on-click=\"{{ toggleNav }}\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"rfr-pop\" popover=\"auto\" class=\"rfr-pop\">\n  <p class=\"rfr-pop-kicker\" id=\"rfr-pop-kicker\"><\u002Fp>\n  <h4 class=\"rfr-pop-title\" id=\"rfr-pop-title\"><\u002Fh4>\n  <div class=\"rfr-pop-body\" id=\"rfr-pop-body\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 820},\n  &quot;showClauseIds&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Reading surface&quot;, &quot;description&quot;: &quot;Reveal constituent clause IDs (C-0NN.NN) in each paragraph's hover chip&quot;},\n  &quot;openGuidanceByDefault&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Reading surface&quot;, &quot;description&quot;: &quot;Expand the illustrative guidance panels by default instead of behind a toggle&quot;}\n}\">\nclass Component extends DCLogic {\n  state = { content: null, glossary: null, guidance: null, links: null };\n\n  componentDidMount() {\n    const emb = window.__RFR_DATA || {};\n    // Prefer the live data/ files (edit-and-refresh); fall back to any data\n    // embedded in the page so a single self-contained file still works.\n    const grab = (f, key) => fetch(f + '?v=' + Date.now())\n      .then((r) => { if (!r.ok) throw new Error('http'); return r.json(); })\n      .catch(() => (emb[key] ? emb[key] : Promise.reject(new Error('no data: ' + key))));\n    Promise.all([\n      grab('data/content.json', 'content'),\n      grab('data/glossary.json', 'glossary'),\n      grab('data/guidance.json', 'guidance'),\n      grab('data/links.json', 'links'),\n    ])\n      .then(([content, glossary, guidance, links]) =>\n        this.setState({ content, glossary, guidance, links }))\n      .catch((err) => console.error('RfR data load failed', err));\n  }\n\n  componentDidUpdate() {\n    const { content, glossary, guidance, links } = this.state;\n    if (!content || !glossary || !guidance || !links) return;\n    const sig = JSON.stringify([!!this.props.showClauseIds, !!this.props.openGuidanceByDefault]);\n    const docEl = document.getElementById('rfr-doc');\n    if (this.built && this.builtSig === sig && docEl && docEl.querySelector('.rfr-para')) return;\n    this.builtSig = sig;\n    this.buildDoc();\n  }\n\n  /* ---------- helpers ---------- */\n  isURL(s) { return /^https?:\\/\\//i.test((s || '').trim()); }\n\n  reduceMotion() { return window.matchMedia('(prefers-reduced-motion:reduce)').matches; }\n\n  scrollToEl(el, flash) {\n    if (!el) return;\n    const main = document.getElementById('rfr-main');\n    const top = el.offsetTop - 16;\n    main.scrollTo({ top, behavior: this.reduceMotion() ? 'auto' : 'smooth' });\n    if (flash) {\n      el.classList.remove('rfr-flash');\n      void el.offsetWidth;\n      el.classList.add('rfr-flash');\n    }\n  }\n\n  wrapPass(root, skipSel, cands, used, make) {\n    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {\n      acceptNode: (n) => {\n        if (!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;\n        if (n.parentElement && n.parentElement.closest(skipSel)) return NodeFilter.FILTER_REJECT;\n        return NodeFilter.FILTER_ACCEPT;\n      },\n    });\n    const nodes = [];\n    let w;\n    while ((w = walker.nextNode())) nodes.push(w);\n    const isWord = (c) => c && /[A-Za-z0-9]/.test(c);\n    for (const node of nodes) {\n      const text = node.nodeValue;\n      const frag = document.createDocumentFragment();\n      let buf = '';\n      let i = 0;\n      let changed = false;\n      const flush = () => { if (buf) { frag.appendChild(document.createTextNode(buf)); buf = ''; } };\n      while (i < text.length) {\n        let hit = null;\n        for (const c of cands) {\n          if (used.has(c.key)) continue;\n          const seg = text.substr(i, c.form.length);\n          if (seg.toLowerCase() !== c.form.toLowerCase()) continue;\n          const before = text[i - 1], after = text[i + c.form.length];\n          const leftOK = i === 0 || !(isWord(before) && isWord(c.form[0]));\n          const rightOK = i + c.form.length >= text.length || !(isWord(after) && isWord(c.form[c.form.length - 1]));\n          if (leftOK && rightOK) { hit = { c, seg }; break; }\n        }\n        if (hit) {\n          flush();\n          frag.appendChild(make(hit.c, hit.seg));\n          used.add(hit.c.key);\n          i += hit.c.form.length;\n          changed = true;\n        } else { buf += text[i]; i++; }\n      }\n      flush();\n      if (changed) node.parentNode.replaceChild(frag, node);\n    }\n  }\n\n  makeExt(c, seg) {\n    const link = c.link;\n    if (link.url) {\n      const a = document.createElement('a');\n      a.className = 'rfr-ext';\n      a.href = link.url;\n      a.target = '_blank';\n      a.rel = 'noopener noreferrer';\n      a.title = link.verified ? 'Opens engc.org.uk in a new tab' : 'External link (unverified) \\u2013 opens in a new tab';\n      a.appendChild(document.createTextNode(seg));\n      a.insertAdjacentHTML('beforeend', ' <span class=\"rfr-ext-icon\" aria-hidden=\"true\">↗<\u002Fspan>');\n      return a;\n    }\n    const b = document.createElement('button');\n    b.type = 'button';\n    b.className = 'rfr-ext-stub';\n    b.dataset.stubNote = link.note || 'external document';\n    b.dataset.stubLabel = link.match;\n    b.textContent = seg;\n    return b;\n  }\n\n  makeGl(c, seg) {\n    const b = document.createElement('button');\n    b.type = 'button';\n    b.className = 'rfr-term';\n    b.dataset.gi = c.gi;\n    b.setAttribute('aria-haspopup', 'dialog');\n    b.textContent = seg;\n    return b;\n  }\n\n  enrichBody(html) {\n    const root = document.createElement('div');\n    root.className = 'rfr-para-body';\n    root.innerHTML = html;\n    const used = new Set();\n    const skip = 'a,button,h1,h2,h3,h4';\n    this.wrapPass(root, skip, this._extCands, used, (c, s) => this.makeExt(c, s));\n    this.wrapPass(root, skip, this._glCands, used, (c, s) => this.makeGl(c, s));\n    return root;\n  }\n\n  addFootnotes(root, para) {\n    if (!para.footnotes || !para.footnotes.length) return;\n    const blocks = root.querySelectorAll(':scope > p');\n    const host = blocks.length ? blocks[blocks.length - 1] : root;\n    for (const id of para.footnotes) {\n      const txt = this._footnotes[id] || '';\n      const m = txt.match(/(https?:\\/\\/[^\\s]+|www\\.[^\\s]+)/i);\n      host.appendChild(document.createTextNode(' '));\n      if (m) {\n        // Footnote that just points to other guidance → external link, new tab.\n        let url = m[0].replace(/[.,;]+$/, '');\n        if (/^www\\./i.test(url)) url = 'https://' + url;\n        let label = txt.slice(0, m.index).replace(/[:\\u2013\\u2014\\-\\s]+$/, '').trim();\n        if (!label) label = 'Related guidance';\n        const a = document.createElement('a');\n        a.className = 'rfr-ext rfr-footlink';\n        a.href = url;\n        a.target = '_blank';\n        a.rel = 'noopener noreferrer';\n        a.title = 'Opens in a new tab';\n        a.appendChild(document.createTextNode(label));\n        a.insertAdjacentHTML('beforeend', ' <span class=\"rfr-ext-icon\" aria-hidden=\"true\">↗<\u002Fspan>');\n        host.appendChild(a);\n      } else {\n        // Explanatory footnote → superscript marker → popover bubble.\n        const sup = document.createElement('sup');\n        sup.className = 'rfr-fn-wrap';\n        const btn = document.createElement('button');\n        btn.type = 'button';\n        btn.className = 'rfr-fn';\n        btn.dataset.fn = id;\n        btn.setAttribute('aria-haspopup', 'dialog');\n        btn.setAttribute('aria-label', 'Footnote ' + id + ' \\u2013 show note');\n        btn.textContent = id;\n        sup.appendChild(btn);\n        host.appendChild(sup);\n      }\n    }\n  }\n\n  buildParagraph(para, sub, sec) {\n    const art = document.createElement('article');\n    art.className = 'rfr-para';\n    art.id = para.id;\n    art.tabIndex = 0;\n    art.dataset.pid = para.id;\n    art.dataset.num = para.num;\n    art.setAttribute('aria-label', 'Paragraph ' + para.num);\n\n    const num = document.createElement('div');\n    num.className = 'rfr-para-num';\n    num.setAttribute('aria-hidden', 'true');\n    num.textContent = para.num;\n    art.appendChild(num);\n\n    const main = document.createElement('div');\n    main.className = 'rfr-para-main';\n    const body = this.enrichBody(para.html);\n    this.addFootnotes(body, para);\n    this._base[para.id] = body.innerHTML;\n    main.appendChild(body);\n\n    const g = this._guidByTarget[para.id];\n    if (g) {\n      const wrap = document.createElement('div');\n      wrap.className = 'rfr-guid';\n      const open = !!this.props.openGuidanceByDefault;\n      wrap.innerHTML =\n        '<button type=\"button\" class=\"rfr-guid-toggle\" data-guid=\"1\" aria-expanded=\"' + open + '\">' +\n        '<span class=\"ic\">' + (open ? '–' : '+') + '<\u002Fspan><span class=\"lbl\">' + (open ? 'Hide guidance' : 'Guidance available') + '<\u002Fspan><\u002Fbutton>' +\n        '<div class=\"rfr-guid-panel\"' + (open ? '' : ' hidden') + '>' +\n        '<span class=\"rfr-guid-badge\">Illustrative \\u2013 not approved guidance<\u002Fspan>' +\n        '<h4><\u002Fh4><p><\u002Fp><\u002Fdiv>';\n      wrap.querySelector('h4').textContent = g.title;\n      wrap.querySelector('.rfr-guid-panel p').textContent = g.body;\n      main.appendChild(wrap);\n    }\n    art.appendChild(main);\n\n    const chip = document.createElement('div');\n    chip.className = 'rfr-chip';\n    chip.setAttribute('role', 'group');\n    chip.setAttribute('aria-label', 'Paragraph ' + para.num + ' tools');\n    let chipHTML =\n      '<span class=\"rfr-chip-id\">' + para.id + '<\u002Fspan>' +\n      '<button type=\"button\" class=\"rfr-chip-btn\" data-act=\"copylink\" data-pid=\"' + para.id + '\">Copy link<\u002Fbutton>' +\n      '<button type=\"button\" class=\"rfr-chip-btn\" data-act=\"copycite\" data-num=\"' + para.num + '\">Copy citation<\u002Fbutton>';\n    chip.innerHTML = chipHTML;\n    if (this.props.showClauseIds && para.clauses && para.clauses.length) {\n      const cl = document.createElement('div');\n      cl.className = 'rfr-chip-clauses';\n      cl.textContent = para.clauses.join('  ');\n      main.appendChild(cl);\n    }\n    art.appendChild(chip);\n    return art;\n  }\n\n  buildDoc() {\n    const { content, glossary, guidance, links } = this.state;\n    this._footnotes = content.footnotes || {};\n    this._base = {};\n    this._match = {};\n    this._fmMatch = {};\n    this._glossary = glossary.terms;\n    this._guidByTarget = {};\n    (guidance.overlays || []).forEach((o) => { this._guidByTarget[o.target] = o; });\n\n    this._extCands = (links.links || [])\n      .map((link, i) => ({ key: 'ext:' + i, form: link.match, link }))\n      .sort((a, b) => b.form.length - a.form.length);\n    this._glCands = [];\n    glossary.terms.forEach((t, gi) => {\n      [t.term, ...(t.variants || [])].forEach((form) => {\n        if (form) this._glCands.push({ key: 'gl:' + gi, form, gi });\n      });\n    });\n    this._glCands.sort((a, b) => b.form.length - a.form.length);\n\n    const docEl = document.getElementById('rfr-doc');\n    const banner = docEl.querySelector('.rfr-print-banner');\n    docEl.innerHTML = '';\n    if (banner) docEl.appendChild(banner);\n\n    content.frontmatter.forEach((fm) => {\n      const sec = document.createElement('section');\n      sec.className = 'rfr-fm';\n      sec.id = 'sec-' + fm.id;\n      sec.dataset.spy = '1';\n      sec.dataset.activeTarget = 'sec-' + fm.id;\n      const h = document.createElement('h2');\n      h.className = 'rfr-fm-title';\n      h.textContent = fm.title;\n      sec.appendChild(h);\n      const body = this.enrichBody(fm.html);\n      body.className = 'rfr-fm-body';\n      sec.appendChild(body);\n      docEl.appendChild(sec);\n      const tmp = document.createElement('div');\n      tmp.innerHTML = fm.html;\n      this._fmMatch['sec-' + fm.id] = (fm.title + ' ' + tmp.textContent).toLowerCase();\n    });\n\n    content.sections.forEach((s, si) => {\n      const sec = document.createElement('section');\n      sec.className = 'rfr-sec';\n      sec.id = 'sec-' + s.id;\n      const head = document.createElement('header');\n      head.className = 'rfr-sec-head';\n      head.id = 'sec-' + s.id + '-head';\n      head.innerHTML = '<span class=\"rfr-sec-kicker\">Section ' + (si + 1) + '<\u002Fspan>';\n      const ht = document.createElement('h2');\n      ht.className = 'rfr-sec-title';\n      ht.textContent = s.title;\n      head.appendChild(ht);\n      sec.appendChild(head);\n\n      const single = s.subsections.length === 1;\n      s.subsections.forEach((ss) => {\n        const sub = document.createElement('div');\n        sub.className = 'rfr-sub';\n        sub.id = 'sub-' + ss.id;\n        sub.dataset.subid = ss.id;\n        sub.dataset.spy = '1';\n        const sameAsSection = ss.title.trim() === s.title.trim();\n        sub.dataset.activeTarget = (single && sameAsSection) ? 'sec-' + s.id : 'sub-' + ss.id;\n        if (!(single && sameAsSection)) {\n          const h3 = document.createElement('h3');\n          h3.className = 'rfr-sub-title';\n          h3.textContent = ss.title;\n          sub.appendChild(h3);\n        }\n        ss.paragraphs.forEach((p) => {\n          const art = this.buildParagraph(p, ss, s);\n          sub.appendChild(art);\n          this._match[p.id] = [\n            p.text, ss.title, s.title, p.id,\n            'para ' + p.num, String(p.num),\n            (p.clauses || []).join(' '),\n          ].join(' ').toLowerCase();\n        });\n        sec.appendChild(sub);\n      });\n      docEl.appendChild(sec);\n    });\n\n    document.querySelectorAll('.rfr-nav-sec').forEach((d) => { d.open = true; });\n    this.wireDoc();\n    this.wireSearch();\n    this.wireSpy();\n    this.built = true;\n    this.handleHash();\n    if (!this._hashWired) {\n      window.addEventListener('hashchange', () => this.handleHash());\n      this._hashWired = true;\n    }\n  }\n\n  /* ---------- interactions ---------- */\n  wireDoc() {\n    const docEl = document.getElementById('rfr-doc');\n    if (this._docWired) return;\n    this._docWired = true;\n    docEl.addEventListener('click', (e) => {\n      const xref = e.target.closest('a.xref');\n      if (xref) {\n        e.preventDefault();\n        const id = (xref.getAttribute('href') || '').replace('#', '');\n        this.scrollToEl(document.getElementById(id), true);\n        history.replaceState(null, '', '#' + id);\n        return;\n      }\n      const fn = e.target.closest('button.rfr-fn');\n      if (fn) { this.openFootnotePop(fn); return; }\n      const term = e.target.closest('button.rfr-term');\n      if (term) { this.openTermPop(term); return; }\n      const stub = e.target.closest('.rfr-ext-stub');\n      if (stub) { this.openStubPop(stub); return; }\n      const guid = e.target.closest('button.rfr-guid-toggle');\n      if (guid) {\n        const panel = guid.parentElement.querySelector('.rfr-guid-panel');\n        const open = guid.getAttribute('aria-expanded') === 'true';\n        guid.setAttribute('aria-expanded', String(!open));\n        panel.hidden = open;\n        guid.querySelector('.ic').textContent = open ? '+' : '–';\n        guid.querySelector('.lbl').textContent = open ? 'Guidance available' : 'Hide guidance';\n        return;\n      }\n      const act = e.target.closest('.rfr-chip-btn');\n      if (act) { this.doCopy(act); return; }\n    });\n  }\n\n  doCopy(btn) {\n    let text;\n    if (btn.dataset.act === 'copylink') {\n      text = location.origin + location.pathname + '#' + btn.dataset.pid;\n    } else {\n      text = 'RfR 4.4, para ' + btn.dataset.num;\n    }\n    const done = () => {\n      const old = btn.textContent;\n      btn.textContent = 'Copied ✓';\n      setTimeout(() => { btn.textContent = old; }, 1400);\n    };\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text).then(done).catch(() => this.fallbackCopy(text, done));\n    } else { this.fallbackCopy(text, done); }\n  }\n\n  fallbackCopy(text, done) {\n    const ta = document.createElement('textarea');\n    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';\n    document.body.appendChild(ta); ta.select();\n    try { document.execCommand('copy'); done(); } catch (_) {}\n    document.body.removeChild(ta);\n  }\n\n  positionPop(anchor) {\n    const el = document.getElementById('rfr-pop');\n    if (!el || !el.showPopover) return null;\n    try { el.hidePopover(); } catch (_) {}\n    const rect = anchor.getBoundingClientRect();\n    const left = Math.max(12, Math.min(rect.left, window.innerWidth - 384));\n    let top = rect.bottom + 8;\n    if (top > window.innerHeight - 240) top = Math.max(12, rect.top - 244);\n    el.style.left = left + 'px';\n    el.style.top = top + 'px';\n    return el;\n  }\n\n  openTermPop(btn) {\n    const t = this._glossary[+btn.dataset.gi];\n    if (!t) return;\n    const el = this.positionPop(btn);\n    if (!el) return;\n    document.getElementById('rfr-pop-kicker').textContent = 'Glossary term · drafted for prototype';\n    const gtitle = document.getElementById('rfr-pop-title');\n    gtitle.style.display = '';\n    gtitle.textContent = t.term;\n    document.getElementById('rfr-pop-body').innerHTML =\n      this.esc(t.definition) + '<span class=\"rfr-pop-tag\">Drafted for prototype<\u002Fspan>';\n    el.showPopover();\n  }\n\n  openStubPop(btn) {\n    const el = this.positionPop(btn);\n    if (!el) return;\n    document.getElementById('rfr-pop-kicker').textContent = 'External link · prototype stub';\n    const stitle = document.getElementById('rfr-pop-title');\n    stitle.style.display = '';\n    stitle.textContent = btn.dataset.stubLabel || 'External document';\n    document.getElementById('rfr-pop-body').textContent = 'Would link to: ' + (btn.dataset.stubNote || '');\n    el.showPopover();\n  }\n\n  openFootnotePop(btn) {\n    const el = this.positionPop(btn);\n    if (!el) return;\n    document.getElementById('rfr-pop-kicker').textContent = 'Footnote ' + btn.dataset.fn;\n    const title = document.getElementById('rfr-pop-title');\n    title.style.display = 'none';\n    document.getElementById('rfr-pop-body').textContent = this._footnotes[btn.dataset.fn] || '';\n    el.showPopover();\n  }\n\n  esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }\n\n  /* ---------- search ---------- */\n  wireSearch() {\n    if (this._searchWired) return;\n    this._searchWired = true;\n    const input = document.getElementById('rfr-q');\n    const clear = document.getElementById('rfr-clear');\n    let tmr = null;\n    const run = () => this.applySearch(input.value.trim());\n    input.addEventListener('input', () => {\n      clear.classList.toggle('on', !!input.value);\n      clearTimeout(tmr);\n      tmr = setTimeout(run, 120);\n    });\n    input.addEventListener('keydown', (e) => {\n      if (e.key === 'Escape') { input.value = ''; clear.classList.remove('on'); this.applySearch(''); }\n    });\n    clear.addEventListener('click', () => {\n      input.value = ''; clear.classList.remove('on'); input.focus(); this.applySearch('');\n    });\n  }\n\n  highlight(html, q) {\n    const root = document.createElement('div');\n    root.innerHTML = html;\n    const rx = new RegExp('(' + q.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + ')', 'gi');\n    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {\n      acceptNode: (n) => {\n        if (!n.nodeValue) return NodeFilter.FILTER_REJECT;\n        if (n.parentElement && n.parentElement.closest('mark,script,style')) return NodeFilter.FILTER_REJECT;\n        return rx.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;\n      },\n    });\n    const nodes = [];\n    let w;\n    while ((w = walker.nextNode())) nodes.push(w);\n    nodes.forEach((n) => {\n      const span = document.createElement('span');\n      span.innerHTML = n.nodeValue.replace(rx, '<mark>$1<\u002Fmark>');\n      n.parentNode.replaceChild(span, n);\n      while (span.firstChild) span.parentNode.insertBefore(span.firstChild, span);\n      span.remove();\n    });\n    return root.innerHTML;\n  }\n\n  applySearch(q) {\n    const docEl = document.getElementById('rfr-doc');\n    const status = document.getElementById('rfr-status');\n    const ql = q.toLowerCase();\n    const total = Object.keys(this._match).length;\n\n    if (!q) {\n      docEl.querySelectorAll('.rfr-para').forEach((a) => {\n        a.style.display = '';\n        a.querySelector('.rfr-para-body').innerHTML = this._base[a.dataset.pid];\n      });\n      docEl.querySelectorAll('.rfr-fm').forEach((s) => { s.style.display = ''; });\n      docEl.querySelectorAll('.rfr-sub').forEach((s) => { s.style.display = ''; });\n      docEl.querySelectorAll('.rfr-sec').forEach((s) => { s.style.display = ''; });\n      document.querySelectorAll('.rfr-nav-count').forEach((c) => { c.textContent = ''; });\n      document.querySelectorAll('.rfr-nav-sub').forEach((l) => l.classList.remove('dimmed'));\n      document.querySelectorAll('.rfr-nav-sec').forEach((d) => { d.style.display = ''; });\n      status.textContent = '';\n      return;\n    }\n\n    const subCounts = {};\n    docEl.querySelectorAll('.rfr-para').forEach((a) => {\n      const pid = a.dataset.pid;\n      const hit = this._match[pid].indexOf(ql) !== -1;\n      a.style.display = hit ? '' : 'none';\n      const body = a.querySelector('.rfr-para-body');\n      body.innerHTML = hit ? this.highlight(this._base[pid], q) : this._base[pid];\n      if (hit) {\n        const sub = a.closest('.rfr-sub');\n        if (sub) subCounts[sub.dataset.subid] = (subCounts[sub.dataset.subid] || 0) + 1;\n      }\n    });\n\n    let shown = 0;\n    Object.values(subCounts).forEach((n) => (shown += n));\n\n    docEl.querySelectorAll('.rfr-sub').forEach((sub) => {\n      const n = subCounts[sub.dataset.subid] || 0;\n      sub.style.display = n ? '' : 'none';\n    });\n    docEl.querySelectorAll('.rfr-sec').forEach((sec) => {\n      const anyVisible = sec.querySelector('.rfr-sub:not([style*=\"display: none\"])');\n      const has = Array.from(sec.querySelectorAll('.rfr-sub')).some((s) => s.style.display !== 'none');\n      sec.style.display = has ? '' : 'none';\n    });\n    docEl.querySelectorAll('.rfr-fm').forEach((s) => {\n      const hit = (this._fmMatch[s.id] || '').indexOf(ql) !== -1;\n      s.style.display = hit ? '' : 'none';\n      const body = s.querySelector('.rfr-fm-body');\n      if (hit && body) body.innerHTML = this.highlight(body.innerHTML, q);\n    });\n\n    document.querySelectorAll('.rfr-nav-sub').forEach((link) => {\n      const id = link.dataset.subid;\n      const n = subCounts[id] || 0;\n      const badge = link.querySelector('.rfr-nav-count');\n      if (badge) badge.textContent = n ? String(n) : '';\n      link.classList.toggle('dimmed', n === 0);\n    });\n    document.querySelectorAll('.rfr-nav-sec').forEach((d) => {\n      const secId = d.dataset.sec;\n      const subs = Array.from(d.querySelectorAll('.rfr-nav-sub'));\n      const any = subs.some((l) => !l.classList.contains('dimmed'));\n      d.open = any;\n      d.style.display = subs.length && !any ? '' : '';\n    });\n\n    status.textContent = 'Showing ' + shown + ' of ' + total + ' paragraphs';\n  }\n\n  /* ---------- scroll-spy ---------- */\n  wireSpy() {\n    if (this._spyWired) return;\n    this._spyWired = true;\n    const main = document.getElementById('rfr-main');\n    let ticking = false;\n    const onScroll = () => {\n      if (ticking) return;\n      ticking = true;\n      requestAnimationFrame(() => {\n        this.updateSpy();\n        ticking = false;\n      });\n    };\n    main.addEventListener('scroll', onScroll, { passive: true });\n    this.updateSpy();\n  }\n\n  updateSpy() {\n    const main = document.getElementById('rfr-main');\n    const docEl = document.getElementById('rfr-doc');\n    const els = Array.from(docEl.querySelectorAll('[data-spy]')).filter((e) => e.style.display !== 'none');\n    if (!els.length) return;\n    const y = main.scrollTop + 150;\n    let cur = els[0];\n    for (const el of els) { if (el.offsetTop <= y) cur = el; }\n    const target = cur.dataset.activeTarget || cur.id;\n    document.querySelectorAll('.rfr-nav-link.active,.rfr-nav-sum.active').forEach((l) => l.classList.remove('active'));\n    const link = document.querySelector('[data-nav=\"' + target + '\"]');\n    if (link) link.classList.add('active');\n  }\n\n  handleHash() {\n    const h = (location.hash || '').replace('#', '');\n    if (!h || h === 'rfr-app') return;\n    const el = document.getElementById(h);\n    if (el) setTimeout(() => this.scrollToEl(el, true), 60);\n  }\n\n  toggleNav = () => {\n    document.getElementById('rfr-app').classList.toggle('nav-open');\n  };\n\n  toggleSec = (e) => {\n    e.preventDefault();\n    e.stopPropagation();\n    const d = e.currentTarget.closest('details');\n    if (d) d.open = !d.open;\n  };\n\n  navClick = (e) => {\n    e.preventDefault();\n    const target = e.currentTarget.dataset.nav;\n    const el = document.getElementById(target);\n    this.scrollToEl(el, false);\n    history.replaceState(null, '', '#' + target);\n    document.getElementById('rfr-app').classList.remove('nav-open');\n  };\n\n  renderVals() {\n    const c = this.state.content;\n    let navFront, navSections;\n    if (c) {\n      navFront = c.frontmatter.map((fm) => ({ title: fm.title, anchor: 'sec-' + fm.id }));\n      navSections = c.sections.map((s, i) => {\n        const single = s.subsections.length === 1 && s.subsections[0].title.trim() === s.title.trim();\n        const subs = single ? [] : s.subsections.map((ss) => ({ id: ss.id, title: ss.title, anchor: 'sub-' + ss.id }));\n        return {\n          id: s.id,\n          num: i + 1,\n          title: s.title,\n          anchor: 'sec-' + s.id,\n          hasSubs: subs.length > 0,\n          subs,\n        };\n      });\n    }\n    return {\n      navFront,\n      navSections,\n      navClick: this.navClick,\n      toggleSec: this.toggleSec,\n      toggleNav: this.toggleNav,\n      printPage: () => window.print(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
