ion. Backdating should apply for a period immediately before forwards recognition being considered. Earlier backdating may be considered for RSC authorisation on a case-by-case basis. Such decisions must be fully documented, transparent and auditable.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 51,\n       \"id\": \"P-051\",\n       \"clauses\": [\n        \"C-051.01\"\n       ],\n       \"html\": \"<p>Licensees must place on the provider or awarding institution a requirement to inform the Licensee of any major changes to the programme during the period of recognition.<\\/p>\",\n       \"text\": \"Licensees must place on the provider or awarding institution a requirement to inform the Licensee of any major changes to the programme during the period of recognition.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 52,\n       \"id\": \"P-052\",\n       \"clauses\": [\n        \"C-052.01\",\n        \"C-052.02\"\n       ],\n       \"html\": \"<p>Programmes may be recognised which, at the time of application, do not have an output cohort. Licensees shall monitor the output of such programmes until such time as at least one cohort has completed the programme, and review their recognition accordingly.<\\/p>\",\n       \"text\": \"Programmes may be recognised which, at the time of application, do not have an output cohort. Licensees shall monitor the output of such programmes until such time as at least one cohort has completed the programme, and review their recognition accordingly.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 53,\n       \"id\": \"P-053\",\n       \"clauses\": [\n        \"C-053.01\"\n       ],\n       \"html\": \"<p>Renewal of recognition of a programme shall be by the same process as for initial recognition, unless there is in place an arrangement for continuing periodic audit and review which has been authorised by the Registration Standards Committee. Such arrangements may involve evidence obtained by other bodies.<\\/p>\",\n       \"text\": \"Renewal of recognition of a programme shall be by the same process as for initial recognition, unless there is in place an arrangement for continuing periodic audit and review which has been authorised by the Registration Standards Committee. Such arrangements may involve evidence obtained by other bodies.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 54,\n       \"id\": \"P-054\",\n       \"clauses\": [\n        \"C-054.01\",\n        \"C-054.02\",\n        \"C-054.03\"\n       ],\n       \"html\": \"<p>Licensees shall notify the Engineering Council of all programmes recognised under these Regulations, by listing them on the Engineering Council recognised programmes database. Licensees shall ensure that data they have listed on the database is current, complete and accurate. Where a proposed addition to the database indicates recognition outside the terms of these Regulations for Registration, recognition must be authorised by Registration Standards Committee before the programme is added to the database.<\\/p>\",\n       \"text\": \"Licensees shall notify the Engineering Council of all programmes recognised under these Regulations, by listing them on the Engineering Council recognised programmes database. Licensees shall ensure that data they have listed on the database is current, complete and accurate. Where a proposed addition to the database indicates recognition outside the terms of these Regulations for Registration, recognition must be authorised by Registration Standards Committee before the programme is added to the database.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 55,\n       \"id\": \"P-055\",\n       \"clauses\": [\n        \"C-055.01\",\n        \"C-055.02\"\n       ],\n       \"html\": \"<p>If a Licensee decides to remove recognition from a programme before the end of the original recognition period, it shall alert the Engineering Council as early as possible in the decision-making process. In such instances, Licensees shall require that the affected awarding organisation or provider notifies individuals affected with an explanation of the support available to them, the implication of the decision for their future registration, and anything additional they must achieve to meet registration requirements.<\\/p>\",\n       \"text\": \"If a Licensee decides to remove recognition from a programme before the end of the original recognition period, it shall alert the Engineering Council as early as possible in the decision-making process. In such instances, Licensees shall require that the affected awarding organisation or provider notifies individuals affected with an explanation of the support available to them, the implication of the decision for their future registration, and anything additional they must achieve to meet registration requirements.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    },\n    {\n     \"id\": \"S4f\",\n     \"title\": \"Waiving accreditation visits\",\n     \"paragraphs\": [\n      {\n       \"num\": 56,\n       \"id\": \"P-056\",\n       \"clauses\": [\n        \"C-056.01\",\n        \"C-056.02\"\n       ],\n       \"html\": \"<p>A Licensee may waive the requirement for an accreditation visit where the programme concerned has significant commonality with programmes already accredited by the Licensee, and provided that sufficient evidence is available. Such evidence must show that factors which can normally only be reviewed during a visit are satisfactory.<\\/p>\",\n       \"text\": \"A Licensee may waive the requirement for an accreditation visit where the programme concerned has significant commonality with programmes already accredited by the Licensee, and provided that sufficient evidence is available. Such evidence must show that factors which can normally only be reviewed during a visit are satisfactory.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 57,\n       \"id\": \"P-057\",\n       \"clauses\": [\n        \"C-057.01\"\n       ],\n       \"html\": \"<p>Sufficient documentary evidence must be submitted attesting to the:<\\/p><ul><li>content<\\/li><li>learning outcomes<\\/li><li>teaching, learning and assessment<\\/li><li>human, physical and material resources<\\/li><li>student entry requirements, and<\\/li><li>the academic level of new or additional programme(s) content which has not previously been scrutinised by the Licensee.<\\/li><\\/ul>\",\n       \"text\": \"Sufficient documentary evidence must be submitted attesting to the: content learning outcomes teaching, learning and assessment human, physical and material resources student entry requirements, and the academic level of new or additional programme(s) content which has not previously been scrutinised by the Licensee.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 58,\n       \"id\": \"P-058\",\n       \"clauses\": [\n        \"C-058.01\",\n        \"C-058.02\",\n        \"C-058.03\"\n       ],\n       \"html\": \"<p>Accreditation without a visit cannot occur where there is a significant difference from what has previously been accredited. If more than 30% of a recognised programme is additional or new, an accreditation visit may not be waived.<\\/p><p>Previous evidence or visit reports must not give grounds for any concerns about students’ or apprentices’ experience, performance, facilities, industrial engagement and validity of programme(s).<\\/p><p>Any requirements from the previous visit must have been addressed and proved acceptable.<\\/p>\",\n       \"text\": \"Accreditation without a visit cannot occur where there is a significant difference from what has previously been accredited. If more than 30% of a recognised programme is additional or new, an accreditation visit may not be waived. Previous evidence or visit reports must not give grounds for any concerns about students’ or apprentices’ experience, performance, facilities, industrial engagement and validity of programme(s). Any requirements from the previous visit must have been addressed and proved acceptable.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 59,\n       \"id\": \"P-059\",\n       \"clauses\": [\n        \"C-059.01\",\n        \"C-059.02\",\n        \"C-059.03\"\n       ],\n       \"html\": \"<p>Where some of a programme of learning is delivered by a provider, or providers, other than the awarding institution, the Licensee shall visit those provider(s) as part of any accreditation exercise. The only exception will be where the Licensee can assure itself that systems are in place to ensure that the learning outcomes adopted by the Licensee are being delivered, or if that part of the programme does not contribute to the final award. A decision not to visit on this basis applies only to that accreditation exercise and does not cover future re-accreditation. The basis for the decision not to undertake a visit must be recorded.<\\/p>\",\n       \"text\": \"Where some of a programme of learning is delivered by a provider, or providers, other than the awarding institution, the Licensee shall visit those provider(s) as part of any accreditation exercise. The only exception will be where the Licensee can assure itself that systems are in place to ensure that the learning outcomes adopted by the Licensee are being delivered, or if that part of the programme does not contribute to the final award. A decision not to visit on this basis applies only to that accreditation exercise and does not cover future re-accreditation. The basis for the decision not to undertake a visit must be recorded.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    }\n   ]\n  },\n  {\n   \"id\": \"S5\",\n   \"title\": \"Professional Development\",\n   \"subsections\": [\n    {\n     \"id\": \"S5a\",\n     \"title\": \"Initial Professional Development (IPD)\",\n     \"paragraphs\": [\n      {\n       \"num\": 60,\n       \"id\": \"P-060\",\n       \"clauses\": [\n        \"C-060.01\",\n        \"C-060.02\"\n       ],\n       \"html\": \"<p>The nature, purpose and value of IPD, and the processes for accrediting structured IPD schemes, are described in the IPD Policy Statement. Licensees shall give appropriate information and advice to potential registrants on ways in which IPD may be managed and recorded, and on mentoring arrangements.<\\/p>\",\n       \"text\": \"The nature, purpose and value of IPD, and the processes for accrediting structured IPD schemes, are described in the IPD Policy Statement. Licensees shall give appropriate information and advice to potential registrants on ways in which IPD may be managed and recorded, and on mentoring arrangements.\",\n       \"footnotes\": [\n        \"8\"\n       ],\n       \"refs\": []\n      },\n      {\n       \"num\": 61,\n       \"id\": \"P-061\",\n       \"clauses\": [\n        \"C-061.01\"\n       ],\n       \"html\": \"<p>Where an individual applicant has progressed independently towards acquiring competence and commitment, Licensees shall provide for the retrospective assessment of a portfolio of evidence by registrants with relevant engineering experience.<\\/p>\",\n       \"text\": \"Where an individual applicant has progressed independently towards acquiring competence and commitment, Licensees shall provide for the retrospective assessment of a portfolio of evidence by registrants with relevant engineering experience.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 62,\n       \"id\": \"P-062\",\n       \"clauses\": [\n        \"C-062.01\",\n        \"C-062.02\",\n        \"C-062.03\"\n       ],\n       \"html\": \"<p>Licensees who are licensed to do so may accredit structured IPD schemes. Accreditation attests to an IPD scheme’s overall design, content, and the validity and reliability of its assessments. Additionally, it confirms that its delivery is recognised at a specific site or sites, or at a specific organisation. The accrediting Licensee must satisfy itself that standards are met at each location for which accreditation will apply.<\\/p>\",\n       \"text\": \"Licensees who are licensed to do so may accredit structured IPD schemes. Accreditation attests to an IPD scheme’s overall design, content, and the validity and reliability of its assessments. Additionally, it confirms that its delivery is recognised at a specific site or sites, or at a specific organisation. The accrediting Licensee must satisfy itself that standards are met at each location for which accreditation will apply.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 63,\n       \"id\": \"P-063\",\n       \"clauses\": [\n        \"C-063.01\"\n       ],\n       \"html\": \"<p>Licensees who are licensed to accredit structured IPD schemes shall develop detailed criteria and procedures, whether applied by the Licensee only or through a joint board arrangement, which shall specify the:<\\/p><ul><li>selection, training and approval of accreditation assessors;<\\/li><li>arrangements for ensuring registrant oversight and authorisation of accreditation decisions;<\\/li><li>arrangements for ensuring balance and consistency of standards among those involved;<\\/li><li>form of the submission expected from the company or provider seeking accreditation;<\\/li><li>outline programmes for accreditation visits, appropriate to the range of schemes and programmes;<\\/li><li>detailed criteria against which the accreditation judgment will be given, which shall relate to the general criteria set out in <a class=\\\"xref\\\" href=\\\"#P-065\\\">paragraph 65<\\/a>;<\\/li><li>range of possible accreditation outcomes, and;<\\/li><li>the process by which judgments and decisions are made.<\\/li><\\/ul>\",\n       \"text\": \"Licensees who are licensed to accredit structured IPD schemes shall develop detailed criteria and procedures, whether applied by the Licensee only or through a joint board arrangement, which shall specify the: selection, training and approval of accreditation assessors; arrangements for ensuring registrant oversight and authorisation of accreditation decisions; arrangements for ensuring balance and consistency of standards among those involved; form of the submission expected from the company or provider seeking accreditation; outline programmes for accreditation visits, appropriate to the range of schemes and programmes; detailed criteria against which the accreditation judgment will be given, which shall relate to the general criteria set out in paragraph 65; range of possible accreditation outcomes, and; the process by which judgments and decisions are made.\",\n       \"footnotes\": [],\n       \"refs\": [\n        \"P-065\"\n       ]\n      },\n      {\n       \"num\": 64,\n       \"id\": \"P-064\",\n       \"clauses\": [\n        \"C-064.01\",\n        \"C-064.02\",\n        \"C-064.03\"\n       ],\n       \"html\": \"<p>Licensees should undertake a risk assessment ahead of each IPD accreditation exercise, to inform a decision on whether or not an in-person element to a visit is required. The risk assessments should be based on informed decision-making by the Licensee’s accreditation panel, including but not limited to:<\\/p><ul><li>a submission of documentation from the employer;<\\/li><li>consideration of the outcomes from the previous accreditation review, and;<\\/li><li>any ongoing communications between the employer and Licensee since the previous accreditation exercise.<\\/li><\\/ul><p>Risk assessments must be documented, transparent and auditable. Where an employer requests an in-person element, it must be granted by the Licensee.<\\/p>\",\n       \"text\": \"Licensees should undertake a risk assessment ahead of each IPD accreditation exercise, to inform a decision on whether or not an in-person element to a visit is required. The risk assessments should be based on informed decision-making by the Licensee’s accreditation panel, including but not limited to: a submission of documentation from the employer; consideration of the outcomes from the previous accreditation review, and; any ongoing communications between the employer and Licensee since the previous accreditation exercise. Risk assessments must be documented, transparent and auditable. Where an employer requests an in-person element, it must be granted by the Licensee.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 65,\n       \"id\": \"P-065\",\n       \"clauses\": [\n        \"C-065.01\"\n       ],\n       \"html\": \"<p>To be accredited, a scheme must:<\\/p><ul><li>have clear objectives to be achieved, which satisfy the standards of competence and commitment adopted by the Licensee;<\\/li><li>have systems to provide formative and summative assessment against these objectives;<\\/li><li>provide certification of achievement of objectives, in a way which records evidence sufficiently for the Professional Review;<\\/li><li>have the commitment of senior and line management and be fully integrated into staff development policies, and;<\\/li><li>have satisfactory quality assurance arrangements.<\\/li><\\/ul>\",\n       \"text\": \"To be accredited, a scheme must: have clear objectives to be achieved, which satisfy the standards of competence and commitment adopted by the Licensee; have systems to provide formative and summative assessment against these objectives; provide certification of achievement of objectives, in a way which records evidence sufficiently for the Professional Review; have the commitment of senior and line management and be fully integrated into staff development policies, and; have satisfactory quality assurance arrangements.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 66,\n       \"id\": \"P-066\",\n       \"clauses\": [\n        \"C-066.01\"\n       ],\n       \"html\": \"<p>Licensees may also accredit integrated development schemes which combine programmes of learning with IPD.<\\/p>\",\n       \"text\": \"Licensees may also accredit integrated development schemes which combine programmes of learning with IPD.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    },\n    {\n     \"id\": \"S5b\",\n     \"title\": \"Continuing Professional Development (CPD)\",\n     \"paragraphs\": [\n      {\n       \"num\": 67,\n       \"id\": \"P-067\",\n       \"clauses\": [\n        \"C-067.01\",\n        \"C-067.02\"\n       ],\n       \"html\": \"<p>The nature, purpose and value of CPD for practising engineers are described in the CPD Policy Statement. At Professional Review, all applicants for registration shall demonstrate how they intend to maintain and enhance their professional competence.<\\/p>\",\n       \"text\": \"The nature, purpose and value of CPD for practising engineers are described in the CPD Policy Statement. At Professional Review, all applicants for registration shall demonstrate how they intend to maintain and enhance their professional competence.\",\n       \"footnotes\": [\n        \"9\"\n       ],\n       \"refs\": []\n      },\n      {\n       \"num\": 68,\n       \"id\": \"P-068\",\n       \"clauses\": [\n        \"C-068.01\"\n       ],\n       \"html\": \"<p>Licensees shall establish and implement appropriate policies and practices for supporting and assuring their registrants’ CPD, and in particular shall:<\\/p><ul><li>establish and keep under review an appropriate CPD policy;<\\/li><li>promote to registrants and employers the aims, importance and benefits of CPD;<\\/li><li>encourage provision to meet the needs of members;<\\/li><li>guide and support registrants to achieve benefits from CPD;<\\/li><li>offer to registrants a system for planning, recording and sharing their CPD.<\\/li><\\/ul>\",\n       \"text\": \"Licensees shall establish and implement appropriate policies and practices for supporting and assuring their registrants’ CPD, and in particular shall: establish and keep under review an appropriate CPD policy; promote to registrants and employers the aims, importance and benefits of CPD; encourage provision to meet the needs of members; guide and support registrants to achieve benefits from CPD; offer to registrants a system for planning, recording and sharing their CPD.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 69,\n       \"id\": \"P-069\",\n       \"clauses\": [\n        \"C-069.01\",\n        \"C-069.02\",\n        \"C-069.03\"\n       ],\n       \"html\": \"<p>Licensees shall undertake an annual sample of no less than 5% of their Engineering Council registrants’ CPD records, responding with appropriate feedback. Registrants who were not professionally active during the period of the sample, or who can demonstrate extenuating circumstances that prevented them from maintaining their CPD records, may request exemption from the audit. Exemption shall be at the Licensee’s discretion. Registrants who maintain a CPD record for their employer or another body may be permitted to submit such a record, but may not request exemption from the Licensee’s sample. Further detail and guidance on CPD sampling can be found in the CPD Policy Statement and Guidance Note on CPD Sampling.<\\/p>\",\n       \"text\": \"Licensees shall undertake an annual sample of no less than 5% of their Engineering Council registrants’ CPD records, responding with appropriate feedback. Registrants who were not professionally active during the period of the sample, or who can demonstrate extenuating circumstances that prevented them from maintaining their CPD records, may request exemption from the audit. Exemption shall be at the Licensee’s discretion. Registrants who maintain a CPD record for their employer or another body may be permitted to submit such a record, but may not request exemption from the Licensee’s sample. Further detail and guidance on CPD sampling can be found in the CPD Policy Statement and Guidance Note on CPD Sampling.\",\n       \"footnotes\": [\n        \"10\",\n        \"11\"\n       ],\n       \"refs\": []\n      },\n      {\n       \"num\": 70,\n       \"id\": \"P-070\",\n       \"clauses\": [\n        \"C-070.01\"\n       ],\n       \"html\": \"<p>Licensees shall adopt a policy and process for removal from the Register of individuals who persistently do not respond to, or engage with, requests for a CPD record. Additional guidance on this regulation is available.<\\/p>\",\n       \"text\": \"Licensees shall adopt a policy and process for removal from the Register of individuals who persistently do not respond to, or engage with, requests for a CPD record. Additional guidance on this regulation is available.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    }\n   ]\n  },\n  {\n   \"id\": \"S6\",\n   \"title\": \"International agreements\",\n   \"subsections\": [\n    {\n     \"id\": \"S6a\",\n     \"title\": \"International agreements\",\n     \"paragraphs\": [\n      {\n       \"num\": 71,\n       \"id\": \"P-071\",\n       \"clauses\": [\n        \"C-071.01\",\n        \"C-071.02\"\n       ],\n       \"html\": \"<p>The Engineering Council may enter into agreements with overseas bodies regarding mutual recognition of recognised qualifications, following consultation with Licensees. Such recognised overseas qualifications shall, for registration purposes, be treated as equivalent to accredited UK qualifications.<\\/p>\",\n       \"text\": \"The Engineering Council may enter into agreements with overseas bodies regarding mutual recognition of recognised qualifications, following consultation with Licensees. Such recognised overseas qualifications shall, for registration purposes, be treated as equivalent to accredited UK qualifications.\",\n       \"footnotes\": [],\n       \"refs\": []\n      },\n      {\n       \"num\": 72,\n       \"id\": \"P-072\",\n       \"clauses\": [\n        \"C-072.01\",\n        \"C-072.02\"\n       ],\n       \"html\": \"<p>Following consultation with Licensees, the Engineering Council may enter into agreements with overseas bodies regarding mutual recognition of overseas titles, or may authorise agreements made by Licensees. Such agreements shall exempt appropriate applicants from all, or part, of the registration requirements, depending on the scope of the particular agreement.<\\/p>\",\n       \"text\": \"Following consultation with Licensees, the Engineering Council may enter into agreements with overseas bodies regarding mutual recognition of overseas titles, or may authorise agreements made by Licensees. Such agreements shall exempt appropriate applicants from all, or part, of the registration requirements, depending on the scope of the particular agreement.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    }\n   ]\n  },\n  {\n   \"id\": \"S7\",\n   \"title\": \"Transition\",\n   \"subsections\": [\n    {\n     \"id\": \"S7a\",\n     \"title\": \"Transition\",\n     \"paragraphs\": [\n      {\n       \"num\": 73,\n       \"id\": \"P-073\",\n       \"clauses\": [\n        \"C-073.01\"\n       ],\n       \"html\": \"<p>Applicants with qualifications which, at the time they gained them, were recognised under previous Engineering Council regulations for a particular registration category, shall be considered to continue to hold a recognised qualification for that registration category under these Regulations.<\\/p>\",\n       \"text\": \"Applicants with qualifications which, at the time they gained them, were recognised under previous Engineering Council regulations for a particular registration category, shall be considered to continue to hold a recognised qualification for that registration category under these Regulations.\",\n       \"footnotes\": [],\n       \"refs\": []\n      }\n     ]\n    }\n   ]\n  }\n ],\n \"footnotes\": {\n  \"1\": \"Between version 3 and version 4.1 this document was entitled ‘Registration Code of Practice’ (RCoP).\",\n  \"2\": \"https://partner.engc.org.uk/institution-guidance/registration-guidance/\",\n  \"3\": \"https://partner.engc.org.uk/institution-guidance/registration-guidance/\",\n  \"4\": \"Guidance Note on Recognised Standards: www.engc.org.uk/recognisedstandards\",\n  \"5\": \"For example a transfer from Chartered Engineer (HRB) to Chartered Engineer on the Principal Register.\",\n  \"6\": \"Risk Based Accreditation Visits Policy: http://partner.engc.org.uk/institution-guidance/standards-related-guidance-and-statements/\",\n  \"7\": \"Guidance on Compensation and Condonement: https://www.engc.org.uk/compensation\",\n  \"8\": \"https://www.engc.org.uk/ipd\",\n  \"9\": \"CPD Policy Statement: https://www.engc.org.uk/cpd\",\n  \"10\": \"The minimum sample size requirement takes effect from January 2026.\",\n  \"11\": \"https://partner.engc.org.uk/institution-guidance/standards-related-guidance-and-statements/ under heading ‘Professional Development’\"\n }\n},glossary:{\n \"note\": \"Drafted for the prototype from RfR 4.4 and related documents; not approved definitions. Edit freely – the prototype should re-render from this file.\",\n \"terms\": [\n  {\n   \"term\": \"Licensee\",\n   \"variants\": [\n    \"Licensees\",\n    \"Licensee's\",\n    \"Licensees'\"\n   ],\n   \"definition\": \"A professional engineering institution (PEI) licensed by the Engineering Council to carry out registration-related activities – assessing and registering individuals, and/or recognising programmes of learning – under these Regulations and its Licence.\"\n  },\n  {\n   \"term\": \"Engineering Council\",\n   \"variants\": [],\n   \"definition\": \"The UK regulatory body for the engineering profession. It sets and maintains the standards for professional registration, licenses PEIs, and holds the national Register.\"\n  },\n  {\n   \"term\": \"the Register\",\n   \"variants\": [\n    \"Register\"\n   ],\n   \"definition\": \"The national register of professionally registered engineers and technicians held by the Engineering Council, with categories including CEng, IEng, EngTech and ICTTech, each with final-stage and interim sections.\"\n  },\n  {\n   \"term\": \"registrant\",\n   \"variants\": [\n    \"registrants\"\n   ],\n   \"definition\": \"An individual holding registration with the Engineering Council in any category.\"\n  },\n  {\n   \"term\": \"Professional Review\",\n   \"variants\": [],\n   \"definition\": \"The assessment by which a Licensee determines an applicant's competence and commitment for registration. It comprises a review of documentary evidence and an interview (with further components at the Licensee's discretion).\"\n  },\n  {\n   \"term\": \"initial assessment\",\n   \"variants\": [],\n   \"definition\": \"The process by which an applicant's documentary evidence of underpinning knowledge and understanding, and competence and commitment, is first assessed, and by which the applicant is advised of any additional evidence required.\"\n  },\n  {\n   \"term\": \"interim registration\",\n   \"variants\": [\n    \"interim registrants\",\n    \"interim registrant\",\n    \"interim\"\n   ],\n   \"definition\": \"Registration available to a person whose underpinning knowledge and understanding have been assessed as meeting the Standard, but who has not yet demonstrated the competence required for final-stage registration.\"\n  },\n  {\n   \"term\": \"UK-SPEC\",\n   \"variants\": [],\n   \"definition\": \"The UK Standard for Professional Engineering Competence and Commitment – the competence and commitment statements for CEng, IEng and EngTech registration.\"\n  },\n  {\n   \"term\": \"AHEP\",\n   \"variants\": [],\n   \"definition\": \"Accreditation of Higher Education Programmes – the Engineering Council's learning outcomes framework for accredited higher-education programmes.\"\n  },\n  {\n   \"term\": \"AAQA\",\n   \"variants\": [],\n   \"definition\": \"Approval and Accreditation of Qualifications and Apprenticeships – the learning-outcomes and competence framework for approved qualifications and apprenticeships.\"\n  },\n  {\n   \"term\": \"ICTTech Standard\",\n   \"variants\": [\n    \"ICTTech\"\n   ],\n   \"definition\": \"The Information and Communications Technology Technician Standard – competence and commitment statements for ICTTech registration. (ICTTech: Information and Communications Technology Technician.)\"\n  },\n  {\n   \"term\": \"Recognised Standards\",\n   \"variants\": [\n    \"Recognised Standard\"\n   ],\n   \"definition\": \"Collective term for Proprietary, Derived, Approved and Mutually Recognised Standards – standards based on and fully meeting UK-SPEC against which registration may take place.\"\n  },\n  {\n   \"term\": \"Proprietary Standards\",\n   \"variants\": [\n    \"Proprietary Standard\"\n   ],\n   \"definition\": \"Standards developed by the Engineering Council, based on and fully meeting UK-SPEC – for example sector-specific or specialist standards.\"\n  },\n  {\n   \"term\": \"Derived Standards\",\n   \"variants\": [\n    \"Derived Standard\"\n   ],\n   \"definition\": \"Standards developed by Licensees, based on and fully meeting UK-SPEC or a Proprietary Standard, subject to authorisation by the Quality Assurance Committee.\"\n  },\n  {\n   \"term\": \"Registration Standards Committee\",\n   \"variants\": [\n    \"RSC\"\n   ],\n   \"definition\": \"The Engineering Council committee responsible for registration standards, which approves the Regulations for Registration and authorises certain arrangements under them.\"\n  },\n  {\n   \"term\": \"Quality Assurance Committee\",\n   \"variants\": [\n    \"QAC\"\n   ],\n   \"definition\": \"The Engineering Council committee that audits Licensees' application of these Regulations under Bye-Law 16.\"\n  },\n  {\n   \"term\": \"Bye-Law\",\n   \"variants\": [\n    \"Bye-Laws\",\n    \"Bye-law\"\n   ],\n   \"definition\": \"The Engineering Council's Bye-Laws, made under its Royal Charter, from which these Regulations derive their authority.\"\n  },\n  {\n   \"term\": \"CEng\",\n   \"variants\": [],\n   \"definition\": \"Chartered Engineer – a registration category of the Engineering Council Register.\"\n  },\n  {\n   \"term\": \"IEng\",\n   \"variants\": [],\n   \"definition\": \"Incorporated Engineer – a registration category of the Engineering Council Register.\"\n  },\n  {\n   \"term\": \"EngTech\",\n   \"variants\": [],\n   \"definition\": \"Engineering Technician – a registration category of the Engineering Council Register.\"\n  },\n  {\n   \"term\": \"CPD\",\n   \"variants\": [],\n   \"definition\": \"Continuing Professional Development – the maintenance and enhancement of professional competence throughout a registrant's career.\"\n  },\n  {\n   \"term\": \"IPD\",\n   \"variants\": [],\n   \"definition\": \"Initial Professional Development – the development of competence and commitment between formation (education) and the Professional Review.\"\n  },\n  {\n   \"term\": \"approval\",\n   \"variants\": [\n    \"Approval\"\n   ],\n   \"definition\": \"Recognition attesting that a programme's syllabus or qualification delivers specified learning outcomes (contrast accreditation, which attests to delivery).\"\n  },\n  {\n   \"term\": \"accreditation\",\n   \"variants\": [\n    \"Accreditation\",\n    \"accredit\",\n    \"accredited\"\n   ],\n   \"definition\": \"Recognition attesting that the delivery of a programme of learning at a specific site or sites meets the required learning outcomes. Accreditation incorporates approval.\"\n  },\n  {\n   \"term\": \"recognition\",\n   \"variants\": [\n    \"recognised programme\",\n    \"Recognition\"\n   ],\n   \"definition\": \"The umbrella term for a Licensee's approval or accreditation of programmes of learning against the relevant learning-outcomes frameworks.\"\n  },\n  {\n   \"term\": \"technical report\",\n   \"variants\": [\n    \"Technical report\"\n   ],\n   \"definition\": \"A report submitted by an applicant as a means of demonstrating underpinning knowledge and understanding, assessed through informed peer assessment and (for IEng/CEng) a technical report interview.\"\n  },\n  {\n   \"term\": \"informed peer assessment\",\n   \"variants\": [\n    \"peer assessment\"\n   ],\n   \"definition\": \"Assessment by registrants who are peers of the applicant – suitably qualified and trained for the assessment in question. (A single authoritative definition is under consideration for the next RfR.)\"\n  },\n  {\n   \"term\": \"experiential learning\",\n   \"variants\": [\n    \"experiential (on-the-job) learning\"\n   ],\n   \"definition\": \"Learning gained through work and experience rather than formal programmes; may be evidenced toward the underpinning knowledge and understanding requirement.\"\n  },\n  {\n   \"term\": \"competence and commitment\",\n   \"variants\": [],\n   \"definition\": \"The qualities an applicant must demonstrate for registration, as set out in UK-SPEC: the ability to carry out professional engineering work to the necessary standard, and commitment to professional standards, ethics and development.\"\n  },\n  {\n   \"term\": \"Regulations for Licensing\",\n   \"variants\": [\n    \"RfL\"\n   ],\n   \"definition\": \"The Engineering Council's regulations governing the licensing of professional engineering institutions (a sibling document to RfR).\"\n  }\n ]\n},guidance:{\n \"note\": \"Illustrative applicant-facing guidance overlays, drafted for the prototype. NOT approved guidance. Edit or add entries; 'target' is the paragraph stable ID.\",\n \"overlays\": [\n  {\n   \"target\": \"P-018\",\n   \"title\": \"What you'll be asked to provide\",\n   \"status\": \"illustrative\",\n   \"body\": \"Your institution will tell you exactly what documents it needs, but expect to provide three things: a career history (a CV focused on your engineering responsibilities), your education and training record (certificates, transcripts, apprenticeship records), and evidence of learning gained on the job – projects, reports or a portfolio showing how your experience has built your engineering knowledge. Don't worry if your background is non-standard: the initial assessment exists partly to tell you what additional evidence would strengthen your application, and your institution must advise you on exactly what's needed and why.\"\n  },\n  {\n   \"target\": \"P-015\",\n   \"title\": \"What interim registration means\",\n   \"status\": \"illustrative\",\n   \"body\": \"Interim registration recognises that you've met the knowledge requirement for your registration category before you've demonstrated the competence that comes with experience. It's a public marker of progress – you appear on the interim section of the Register while you complete your professional development toward the full Professional Review. You can't hold interim and full registration in the same category at once, and interim registration is optional: many applicants go straight to the Professional Review without it.\"\n  },\n  {\n   \"target\": \"P-028\",\n   \"title\": \"Ways to demonstrate your knowledge\",\n   \"status\": \"illustrative\",\n   \"body\": \"There's no single 'right' route to demonstrating the knowledge that underpins competence. An accredited degree is one way – but only one. Other programmes (in whole or in part), evidence from work-based learning, an integrated assessment (for EngTech and ICTTech), or a technical report all count, in any combination. Your institution will help you identify the pathway that fits your background. What matters is the destination – sufficient knowledge and understanding for your category – not the road you took.\"\n  }\n ]\n},links:{\n \"note\": \"External-link inventory. Verified = URL taken from a live fetch of engc.org.uk on 2026-07-24 (site was restructured; old /standards-guidance/ paths are dead). url:null would mean render as stub. Deep links to specific PDFs still to confirm where noted. NB engc.org.uk has its own glossary at /our-role-as-regulator/faqs/glossary/ – cross-check our drafted definitions against it before any external demo.\",\n \"links\": [\n  {\n   \"match\": \"UK-SPEC\",\n   \"url\": \"https://www.engc.org.uk/our-role-as-regulator/setting-standards/professional-engineering-competence-and-commitment/\",\n   \"verified\": true,\n   \"note\": \"Verified 2026-07-24 (redirect target of /ukspec)\"\n  },\n  {\n   \"match\": \"ICTTech Standard\",\n   \"url\": \"https://www.engc.org.uk/our-role-as-regulator/setting-standards/professional-engineering-competence-and-commitment/icttech-standard/\",\n   \"verified\": true,\n   \"note\": \"Verified via site nav 2026-07-24\"\n  },\n  {\n   \"match\": \"Recognised Standards\",\n   \"url\": \"https://www.engc.org.uk/our-role-as-regulator/setting-standards/professional-engineering-competence-and-commitment/recognised-standards/\",\n   \"verified\": true,\n   \"note\": \"Verified via site nav 2026-07-24\"\n  },\n  {\n   \"match\": \"AHEP\",\n   \"url\": \"https://www.engc.org.uk/our-role-as-regulator/setting-standards/recognising-learning-and-development-programmes/\",\n   \"verified\": true,\n   \"note\": \"Landing page (verified via nav); AHEP document deep-link to confirm\"\n  },\n  {\n   \"match\": \"AAQA\",\n   \"url\": \"https://www.engc.org.uk/our-role-as-regulator/setting-standards/recognising-learning-and-development-programmes/\",\n   \"verified\": true,\n   \"note\": \"Landing page (verified via nav); AAQA document deep-link to confirm\"\n  },\n  {\n   \"match\": \"Regulations for Licensing\",\n   \"url\": \"https://www.engc.org.uk/our-role-as-regulator/licensing-professional-engineering-institutions/\",\n   \"verified\": true,\n   \"note\": \"Licensing page (verified via na lay: swap;\n  src: url(\"3c2b27fa-90c3-457f-bf21-4276640753ac\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Colour tokens\n   --------------------------------------------------------------------\n   Copper is the HERO colour and should feature prominently. Despite its\n   name, the brand \"Copper\" is a bright aqua/turquoise (#35ffdc,\n   Pantone 333C) — the colour the brand wants to be known for.\n\n   Black provides strong contrast with Copper. Three supporting tones —\n   Orange, Blue, Red — add flexibility and are typically used as\n   background colours with black or white text over them.\n\n   Colour rules (from the guidelines):\n     • Never place Copper directly beside a supporting colour — always\n       keep visual separation.\n     • Copper on Black for headlines and large page titles.\n     • Supporting colours are usually background colours.\n     • Lead with Copper for hero communications; a supporting colour may\n       lead day-to-day design (social, slides).\n   ------------------------------------------------------------------ */\n\n:root {\n  /* ---- Brand palette (raw values) ---- */\n  --ec-copper: #35ffdc;   /* HERO — Pantone 333C */\n  --ec-orange: #ff9c3e;   /* Pantone 157C */\n  --ec-blue:   #4797f7;   /* Pantone 2727C */\n  --ec-red:    #ff7277;   /* Pantone 1777C */\n  --ec-black:  #000000;\n  --ec-white:  #ffffff;\n\n  /* ---- Accessibility text-blacks (WCAG AAA) ----\n     Use these instead of pure black when text sits ON a brand colour. */\n  --ec-black-on-blue:   #010000; /* black text over Blue */\n  --ec-black-on-warm:   #1d1d1b; /* black text over Copper, Orange, Red */\n\n  /* ---- Neutral scale (derived, for UI surfaces & borders) ---- */\n  --ec-ink:      #000000; /* primary text */\n  --ec-ink-2:    #1d1d1b; /* near-black text on warm colour */\n  --ec-grey-900: #111110;\n  --ec-grey-700: #3a3a37;\n  --ec-grey-600: #5c5c58;\n  --ec-grey-500: #78787330;\n  --ec-grey-500-solid: #787873;\n  --ec-grey-400: #a3a39d;\n  --ec-grey-300: #cfcfc9;\n  --ec-grey-200: #e6e6e1;\n  --ec-grey-100: #f2f2ee;\n  --ec-grey-050: #f9f9f6;\n\n  /* ---- Copper tint (for subtle fills on light UI) ---- */\n  --ec-copper-tint:   #e4fff9;\n  --ec-copper-strong: #10c9a6; /* accessible copper for small text/links on white */\n\n  /* =============================================================\n     SEMANTIC ALIASES — reference these in components, not the raw\n     values above.\n     ============================================================= */\n\n  /* Surfaces */\n  --surface-page:      var(--ec-white);\n  --surface-inverse:   var(--ec-black);\n  --surface-card:      var(--ec-white);\n  --surface-muted:     var(--ec-grey-050);\n  --surface-sunken:    var(--ec-grey-100);\n  --surface-copper:    var(--ec-copper);\n  --surface-orange:    var(--ec-orange);\n  --surface-blue:      var(--ec-blue);\n  --surface-red:       var(--ec-red);\n\n  /* Text */\n  --text-body:         var(--ec-ink);\n  --text-muted:        var(--ec-grey-600);\n  --text-subtle:       var(--ec-grey-500-solid);\n  --text-on-inverse:   var(--ec-white);\n  --text-on-copper:    var(--ec-black-on-warm);\n  --text-on-blue:      var(--ec-black-on-blue);\n  --text-link:         var(--ec-copper-strong);\n\n  /* Borders & lines */\n  --border-default:    var(--ec-grey-200);\n  --border-strong:     var(--ec-grey-300);\n  --border-ink:        var(--ec-black);\n  --border-focus:      var(--ec-blue);\n\n  /* Interactive (actions lead with Copper on Black or Black on Copper) */\n  --action-primary-bg:       var(--ec-black);\n  --action-primary-fg:       var(--ec-copper);\n  --action-primary-hover-bg: var(--ec-grey-900);\n  --action-secondary-bg:     var(--ec-copper);\n  --action-secondary-fg:     var(--ec-black-on-warm);\n  --action-secondary-hover-bg:#2be6c5;\n\n  /* Feedback (reuse brand supporting tones) */\n  --feedback-info:     var(--ec-blue);\n  --feedback-warning:  var(--ec-orange);\n  --feedback-danger:   var(--ec-red);\n  --feedback-success:  var(--ec-copper-strong);\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Typography tokens\n   --------------------------------------------------------------------\n   Primary typeface: Söhne (substituted here with Hanken Grotesk).\n   Fallback / Office system font: Aptos.\n\n   Type styles (from the guidelines):\n     • Display  — Söhne Halbfett (700), ALL CAPS, short phrases only.\n     • Headline — Söhne Kräftig (600), sentence case.\n     • Body     — Söhne Buch (400).\n     • Paragraph titles — Söhne Kräftig (600).\n\n   General rules: no custom kerning / tracking. Text is aligned left or\n   centred. Line-height 120–130% based on size.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* Families */\n  --font-brand: 'Hanken Grotesk', 'Söhne', 'Aptos', -apple-system, 'Segoe UI', system-ui, sans-serif;\n  --font-sans:  var(--font-brand);\n  --font-mono:  ui-monospace, 'SFMono-Regular', 'Consolas', monospace;\n\n  /* Weights (mapped from Söhne: Leicht/Buch/Kräftig/Halbfett) */\n  --fw-light:    300; /* @kind font */\n  --fw-book:     400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* Fluid display sizes (clamped for responsive hero use) */\n  --fs-display-xl: clamp(3rem, 1.5rem + 6vw, 6rem); /* @kind other */\n  --fs-display-lg: clamp(2.5rem, 1.4rem + 4.5vw, 4.5rem); /* @kind other */\n  --fs-display-md: clamp(2rem, 1.2rem + 3vw, 3.25rem); /* @kind other */\n\n  /* Static type scale */\n  --fs-h1: 2.5rem; /* @kind font */\n  --fs-h2: 2rem; /* @kind font */\n  --fs-h3: 1.5rem; /* @kind font */\n  --fs-h4: 1.25rem; /* @kind font */\n  --fs-lead: 1.25rem; /* @kind font */\n  --fs-body: 1rem; /* @kind font */\n  --fs-sm: 0.875rem; /* @kind font */\n  --fs-xs: 0.75rem; /* @kind font */\n  --fs-eyebrow: 0.8125rem; /* @kind font */\n\n  /* Line-heights (120–130% brand range; looser for body) */\n  --lh-display: 1.05; /* @kind font */\n  --lh-heading: 1.15; /* @kind font */\n  --lh-snug:    1.25; /* @kind font */\n  --lh-body:    1.5; /* @kind font */\n\n  /* Letter-spacing — brand avoids tracking; only eyebrows get a touch */\n  --ls-tight:   -0.01em; /* @kind font */\n  --ls-normal:  0; /* @kind font */\n  --ls-eyebrow: 0.08em; /* @kind font */\n\n  /* Semantic aliases */\n  --text-display-weight: var(--fw-bold);\n  --text-heading-weight: var(--fw-semibold);\n  --text-body-weight:    var(--fw-book);\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Spacing & layout tokens\n   --------------------------------------------------------------------\n   The brand embraces clean lines and purposeful negative space, so the\n   spacing scale is generous. 4px base unit.\n   ------------------------------------------------------------------ */\n\n:root {\n  --space-0:  0;\n  --space-1:  0.25rem;  /* 4  */\n  --space-2:  0.5rem;   /* 8  */\n  --space-3:  0.75rem;  /* 12 */\n  --space-4:  1rem;     /* 16 */\n  --space-5:  1.5rem;   /* 24 */\n  --space-6:  2rem;     /* 32 */\n  --space-7:  3rem;     /* 48 */\n  --space-8:  4rem;     /* 64 */\n  --space-9:  6rem;     /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-narrow: 760px;\n  --gutter: clamp(1rem, 4vw, 3rem); /* @kind spacing */\n  --section-y: clamp(3rem, 6vw, 6rem); /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Radius, borders, shadow & the Stack shape\n   --------------------------------------------------------------------\n   The signature brand device is \"The Stack\": a rectangle with a curved\n   (semicircle) edge at the beginning OR the end, inspired by the bars of\n   the monogram. The --stack-radius token drives that half-round end.\n\n   The overall visual style is refined and sharp with clean lines, so\n   general UI radii are modest and elevation is used sparingly.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* General UI radii */\n  --radius-none: 0;\n  --radius-xs: 3px;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-pill: 999px;      /* fully rounded — both ends (stadium) */\n\n  /* The Stack — half-round end. Applied to one side only, e.g.\n     border-radius: 0 var(--stack-radius) var(--stack-radius) 0; */\n  --stack-radius: 999px;\n\n  /* Border widths */\n  --border-1: 1px; /* @kind other */\n  --border-2: 2px; /* @kind other */\n\n  /* Elevation — sparing, neutral, low-spread. */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);\n  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.08);\n  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);\n\n  /* Focus ring */\n  --ring-focus: 0 0 0 3px rgba(71, 151, 247, 0.45); /* Blue @ 45% */\n\n  /* Motion — calm, confident. Short fades / eases; no bounce. */\n  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-med: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Base element defaults\n   --------------------------------------------------------------------\n   Light, unobtrusive resets + brand typographic defaults. Keeps\n   specimens and consuming pages consistent without heavy opinionated\n   normalisation.\n   ------------------------------------------------------------------ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-brand);\n  font-weight: var(--fw-book);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headlines — Söhne Kräftig (600), sentence case, tight leading */\nh1, h2, h3, h4, h5, h6 {\n  margin: 0 0 0.5em;\n  font-weight: var(--fw-semibold);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--ls-tight);\n  color: var(--text-body);\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); }\nh4 { font-size: var(--fs-h4); }\n\np { margin: 0 0 1em; text-wrap: pretty; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; }\n\n/* Display utility — Söhne Halbfett, ALL CAPS, short phrases only */\n.ec-display {\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-display-lg);\n  line-height: var(--lh-display);\n  letter-spacing: var(--ls-tight);\n  text-transform: uppercase;\n}\n\n/* Eyebrow / label */\n.ec-eyebrow {\n  font-size: var(--fs-eyebrow);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--ring-focus);\n  border-radius: var(--radius-xs);\n}\n\nimg { max-width: 100%; display: block; }\n<\u002Fstyle>\n<style>/* ==================================================================\n   Engineering Council — Design System\n   Global stylesheet entry point.\n\n   Consumers link THIS file only. It is a manifest of @import lines;\n   never add rules directly here.\n   ================================================================== */\n\n/* ------------------------------------------------------------------\n   Engineering Council — Webfonts\n   --------------------------------------------------------------------\n   Brand primary typeface is Söhne (Klim Type Foundry, commercial).\n   Söhne is NOT freely redistributable, so this system ships a close\n   open substitute — Hanken Grotesk — a neutral grotesque with subtle\n   humanist touches that mirrors Söhne's proportions and weight range.\n   Replace with licensed Söhne web binaries when available.\n\n   Weight map (Söhne -> substitute):\n     Söhne Leicht (Light)      -> 300\n     Söhne Buch (Book)         -> 400\n     Söhne Kräftig (Semi-Bold) -> 600\n     Söhne Halbfett (Bold)     -> 700\n   ------------------------------------------------------------------ */\n\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"8c104299-275d-4dd8-a4f3-8a30ff91596c\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"eeaeab0b-bdd0-496a-bd93-56a28344d012\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"be4ec302-6ee7-46d0-b012-af674f2b13a1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"3c2b27fa-9
