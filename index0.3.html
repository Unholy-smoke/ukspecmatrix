document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Colour tokens\n   --------------------------------------------------------------------\n   Copper is the HERO colour and should feature prominently. Despite its\n   name, the brand \"Copper\" is a bright aqua/turquoise (#35ffdc,\n   Pantone 333C) — the colour the brand wants to be known for.\n\n   Black provides strong contrast with Copper. Three supporting tones —\n   Orange, Blue, Red — add flexibility and are typically used as\n   background colours with black or white text over them.\n\n   Colour rules (from the guidelines):\n     • Never place Copper directly beside a supporting colour — always\n       keep visual separation.\n     • Copper on Black for headlines and large page titles.\n     • Supporting colours are usually background colours.\n     • Lead with Copper for hero communications; a supporting colour may\n       lead day-to-day design (social, slides).\n   ------------------------------------------------------------------ */\n\n:root {\n  /* ---- Brand palette (raw values) ---- */\n  --ec-copper: #35ffdc;   /* HERO — Pantone 333C */\n  --ec-orange: #ff9c3e;   /* Pantone 157C */\n  --ec-blue:   #4797f7;   /* Pantone 2727C */\n  --ec-red:    #ff7277;   /* Pantone 1777C */\n  --ec-black:  #000000;\n  --ec-white:  #ffffff;\n\n  /* ---- Accessibility text-blacks (WCAG AAA) ----\n     Use these instead of pure black when text sits ON a brand colour. */\n  --ec-black-on-blue:   #010000; /* black text over Blue */\n  --ec-black-on-warm:   #1d1d1b; /* black text over Copper, Orange, Red */\n\n  /* ---- Neutral scale (derived, for UI surfaces & borders) ---- */\n  --ec-ink:      #000000; /* primary text */\n  --ec-ink-2:    #1d1d1b; /* near-black text on warm colour */\n  --ec-grey-900: #111110;\n  --ec-grey-700: #3a3a37;\n  --ec-grey-600: #5c5c58;\n  --ec-grey-500: #78787330;\n  --ec-grey-500-solid: #787873;\n  --ec-grey-400: #a3a39d;\n  --ec-grey-300: #cfcfc9;\n  --ec-grey-200: #e6e6e1;\n  --ec-grey-100: #f2f2ee;\n  --ec-grey-050: #f9f9f6;\n\n  /* ---- Copper tint (for subtle fills on light UI) ---- */\n  --ec-copper-tint:   #e4fff9;\n  --ec-copper-strong: #10c9a6; /* accessible copper for small text/links on white */\n\n  /* =============================================================\n     SEMANTIC ALIASES — reference these in components, not the raw\n     values above.\n     ============================================================= */\n\n  /* Surfaces */\n  --surface-page:      var(--ec-white);\n  --surface-inverse:   var(--ec-black);\n  --surface-card:      var(--ec-white);\n  --surface-muted:     var(--ec-grey-050);\n  --surface-sunken:    var(--ec-grey-100);\n  --surface-copper:    var(--ec-copper);\n  --surface-orange:    var(--ec-orange);\n  --surface-blue:      var(--ec-blue);\n  --surface-red:       var(--ec-red);\n\n  /* Text */\n  --text-body:         var(--ec-ink);\n  --text-muted:        var(--ec-grey-600);\n  --text-subtle:       var(--ec-grey-500-solid);\n  --text-on-inverse:   var(--ec-white);\n  --text-on-copper:    var(--ec-black-on-warm);\n  --text-on-blue:      var(--ec-black-on-blue);\n  --text-link:         var(--ec-copper-strong);\n\n  /* Borders & lines */\n  --border-default:    var(--ec-grey-200);\n  --border-strong:     var(--ec-grey-300);\n  --border-ink:        var(--ec-black);\n  --border-focus:      var(--ec-blue);\n\n  /* Interactive (actions lead with Copper on Black or Black on Copper) */\n  --action-primary-bg:       var(--ec-black);\n  --action-primary-fg:       var(--ec-copper);\n  --action-primary-hover-bg: var(--ec-grey-900);\n  --action-secondary-bg:     var(--ec-copper);\n  --action-secondary-fg:     var(--ec-black-on-warm);\n  --action-secondary-hover-bg:#2be6c5;\n\n  /* Feedback (reuse brand supporting tones) */\n  --feedback-info:     var(--ec-blue);\n  --feedback-warning:  var(--ec-orange);\n  --feedback-danger:   var(--ec-red);\n  --feedback-success:  var(--ec-copper-strong);\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Typography tokens\n   --------------------------------------------------------------------\n   Primary typeface: Söhne (substituted here with Hanken Grotesk).\n   Fallback / Office system font: Aptos.\n\n   Type styles (from the guidelines):\n     • Display  — Söhne Halbfett (700), ALL CAPS, short phrases only.\n     • Headline — Söhne Kräftig (600), sentence case.\n     • Body     — Söhne Buch (400).\n     • Paragraph titles — Söhne Kräftig (600).\n\n   General rules: no custom kerning / tracking. Text is aligned left or\n   centred. Line-height 120–130% based on size.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* Families */\n  --font-brand: 'Hanken Grotesk', 'Söhne', 'Aptos', -apple-system, 'Segoe UI', system-ui, sans-serif;\n  --font-sans:  var(--font-brand);\n  --font-mono:  ui-monospace, 'SFMono-Regular', 'Consolas', monospace;\n\n  /* Weights (mapped from Söhne: Leicht/Buch/Kräftig/Halbfett) */\n  --fw-light:    300; /* @kind font */\n  --fw-book:     400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* Fluid display sizes (clamped for responsive hero use) */\n  --fs-display-xl: clamp(3rem, 1.5rem + 6vw, 6rem); /* @kind other */\n  --fs-display-lg: clamp(2.5rem, 1.4rem + 4.5vw, 4.5rem); /* @kind other */\n  --fs-display-md: clamp(2rem, 1.2rem + 3vw, 3.25rem); /* @kind other */\n\n  /* Static type scale */\n  --fs-h1: 2.5rem; /* @kind font */\n  --fs-h2: 2rem; /* @kind font */\n  --fs-h3: 1.5rem; /* @kind font */\n  --fs-h4: 1.25rem; /* @kind font */\n  --fs-lead: 1.25rem; /* @kind font */\n  --fs-body: 1rem; /* @kind font */\n  --fs-sm: 0.875rem; /* @kind font */\n  --fs-xs: 0.75rem; /* @kind font */\n  --fs-eyebrow: 0.8125rem; /* @kind font */\n\n  /* Line-heights (120–130% brand range; looser for body) */\n  --lh-display: 1.05; /* @kind font */\n  --lh-heading: 1.15; /* @kind font */\n  --lh-snug:    1.25; /* @kind font */\n  --lh-body:    1.5; /* @kind font */\n\n  /* Letter-spacing — brand avoids tracking; only eyebrows get a touch */\n  --ls-tight:   -0.01em; /* @kind font */\n  --ls-normal:  0; /* @kind font */\n  --ls-eyebrow: 0.08em; /* @kind font */\n\n  /* Semantic aliases */\n  --text-display-weight: var(--fw-bold);\n  --text-heading-weight: var(--fw-semibold);\n  --text-body-weight:    var(--fw-book);\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Spacing & layout tokens\n   --------------------------------------------------------------------\n   The brand embraces clean lines and purposeful negative space, so the\n   spacing scale is generous. 4px base unit.\n   ------------------------------------------------------------------ */\n\n:root {\n  --space-0:  0;\n  --space-1:  0.25rem;  /* 4  */\n  --space-2:  0.5rem;   /* 8  */\n  --space-3:  0.75rem;  /* 12 */\n  --space-4:  1rem;     /* 16 */\n  --space-5:  1.5rem;   /* 24 */\n  --space-6:  2rem;     /* 32 */\n  --space-7:  3rem;     /* 48 */\n  --space-8:  4rem;     /* 64 */\n  --space-9:  6rem;     /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-narrow: 760px;\n  --gutter: clamp(1rem, 4vw, 3rem); /* @kind spacing */\n  --section-y: clamp(3rem, 6vw, 6rem); /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Radius, borders, shadow & the Stack shape\n   --------------------------------------------------------------------\n   The signature brand device is \"The Stack\": a rectangle with a curved\n   (semicircle) edge at the beginning OR the end, inspired by the bars of\n   the monogram. The --stack-radius token drives that half-round end.\n\n   The overall visual style is refined and sharp with clean lines, so\n   general UI radii are modest and elevation is used sparingly.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* General UI radii */\n  --radius-none: 0;\n  --radius-xs: 3px;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-pill: 999px;      /* fully rounded — both ends (stadium) */\n\n  /* The Stack — half-round end. Applied to one side only, e.g.\n     border-radius: 0 var(--stack-radius) var(--stack-radius) 0; */\n  --stack-radius: 999px;\n\n  /* Border widths */\n  --border-1: 1px; /* @kind other */\n  --border-2: 2px; /* @kind other */\n\n  /* Elevation — sparing, neutral, low-spread. */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);\n  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.08);\n  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);\n\n  /* Focus ring */\n  --ring-focus: 0 0 0 3px rgba(71, 151, 247, 0.45); /* Blue @ 45% */\n\n  /* Motion — calm, confident. Short fades / eases; no bounce. */\n  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-med: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Base element defaults\n   --------------------------------------------------------------------\n   Light, unobtrusive resets + brand typographic defaults. Keeps\n   specimens and consuming pages consistent without heavy opinionated\n   normalisation.\n   ------------------------------------------------------------------ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-brand);\n  font-weight: var(--fw-book);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headlines — Söhne Kräftig (600), sentence case, tight leading */\nh1, h2, h3, h4, h5, h6 {\n  margin: 0 0 0.5em;\n  font-weight: var(--fw-semibold);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--ls-tight);\n  color: var(--text-body);\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); }\nh4 { font-size: var(--fs-h4); }\n\np { margin: 0 0 1em; text-wrap: pretty; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; }\n\n/* Display utility — Söhne Halbfett, ALL CAPS, short phrases only */\n.ec-display {\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-display-lg);\n  line-height: var(--lh-display);\n  letter-spacing: var(--ls-tight);\n  text-transform: uppercase;\n}\n\n/* Eyebrow / label */\n.ec-eyebrow {\n  font-size: var(--fs-eyebrow);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--ring-focus);\n  border-radius: var(--radius-xs);\n}\n\nimg { max-width: 100%; display: block; }\n<\u002Fstyle>\n<style>/* ==================================================================\n   Engineering Council — Design System\n   Global stylesheet entry point.\n\n   Consumers link THIS file only. It is a manifest of @import lines;\n   never add rules directly here.\n   ================================================================== */\n\n/* ------------------------------------------------------------------\n   Engineering Council — Webfonts\n   --------------------------------------------------------------------\n   Brand primary typeface is Söhne (Klim Type Foundry, commercial).\n   Söhne is NOT freely red -face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"0ad5686e-e30c-46aa-b520-ad4789b172bc\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"88b2eec0-4b62-4d3e-b553-08a1badd2829\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"018a6c22-d30b-499f-8273-e4fc5088a61c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"6afe2544-9d6b-4b36-a22b-1e894bf3f0e3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ------------------------------------------------------------------\n   Engineering Council — Colour tokens\n   --------------------------------------------------------------------\n   Copper is the HERO colour and should feature prominently. Despite its\n   name, the brand \"Copper\" is a bright aqua/turquoise (#35ffdc,\n   Pantone 333C) — the colour the brand wants to be known for.\n\n   Black provides strong contrast with Copper. Three supporting tones —\n   Orange, Blue, Red — add flexibility and are typically used as\n   background colours with black or white text over them.\n\n   Colour rules (from the guidelines):\n     • Never place Copper directly beside a supporting colour — always\n       keep visual separation.\n     • Copper on Black for headlines and large page titles.\n     • Supporting colours are usually background colours.\n     • Lead with Copper for hero communications; a supporting colour may\n       lead day-to-day design (social, slides).\n   ------------------------------------------------------------------ */\n\n:root {\n  /* ---- Brand palette (raw values) ---- */\n  --ec-copper: #35ffdc;   /* HERO — Pantone 333C */\n  --ec-orange: #ff9c3e;   /* Pantone 157C */\n  --ec-blue:   #4797f7;   /* Pantone 2727C */\n  --ec-red:    #ff7277;   /* Pantone 1777C */\n  --ec-black:  #000000;\n  --ec-white:  #ffffff;\n\n  /* ---- Accessibility text-blacks (WCAG AAA) ----\n     Use these instead of pure black when text sits ON a brand colour. */\n  --ec-black-on-blue:   #010000; /* black text over Blue */\n  --ec-black-on-warm:   #1d1d1b; /* black text over Copper, Orange, Red */\n\n  /* ---- Neutral scale (derived, for UI surfaces & borders) ---- */\n  --ec-ink:      #000000; /* primary text */\n  --ec-ink-2:    #1d1d1b; /* near-black text on warm colour */\n  --ec-grey-900: #111110;\n  --ec-grey-700: #3a3a37;\n  --ec-grey-600: #5c5c58;\n  --ec-grey-500: #78787330;\n  --ec-grey-500-solid: #787873;\n  --ec-grey-400: #a3a39d;\n  --ec-grey-300: #cfcfc9;\n  --ec-grey-200: #e6e6e1;\n  --ec-grey-100: #f2f2ee;\n  --ec-grey-050: #f9f9f6;\n\n  /* ---- Copper tint (for subtle fills on light UI) ---- */\n  --ec-copper-tint:   #e4fff9;\n  --ec-copper-strong: #10c9a6; /* accessible copper for small text/links on white */\n\n  /* =============================================================\n     SEMANTIC ALIASES — reference these in components, not the raw\n     values above.\n     ============================================================= */\n\n  /* Surfaces */\n  --surface-page:      var(--ec-white);\n  --surface-inverse:   var(--ec-black);\n  --surface-card:      var(--ec-white);\n  --surface-muted:     var(--ec-grey-050);\n  --surface-sunken:    var(--ec-grey-100);\n  --surface-copper:    var(--ec-copper);\n  --surface-orange:    var(--ec-orange);\n  --surface-blue:      var(--ec-blue);\n  --surface-red:       var(--ec-red);\n\n  /* Text */\n  --text-body:         var(--ec-ink);\n  --text-muted:        var(--ec-grey-600);\n  --text-subtle:       var(--ec-grey-500-solid);\n  --text-on-inverse:   var(--ec-white);\n  --text-on-copper:    var(--ec-black-on-warm);\n  --text-on-blue:      var(--ec-black-on-blue);\n  --text-link:         var(--ec-copper-strong);\n\n  /* Borders & lines */\n  --border-default:    var(--ec-grey-200);\n  --border-strong:     var(--ec-grey-300);\n  --border-ink:        var(--ec-black);\n  --border-focus:      var(--ec-blue);\n\n  /* Interactive (actions lead with Copper on Black or Black on Copper) */\n  --action-primary-bg:       var(--ec-black);\n  --action-primary-fg:       var(--ec-copper);\n  --action-primary-hover-bg: var(--ec-grey-900);\n  --action-secondary-bg:     var(--ec-copper);\n  --action-secondary-fg:     var(--ec-black-on-warm);\n  --action-secondary-hover-bg:#2be6c5;\n\n  /* Feedback (reuse brand supporting tones) */\n  --feedback-info:     var(--ec-blue);\n  --feedback-warning:  var(--ec-orange);\n  --feedback-danger:   var(--ec-red);\n  --feedback-success:  var(--ec-copper-strong);\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Typography tokens\n   --------------------------------------------------------------------\n   Primary typeface: Söhne (substituted here with Hanken Grotesk).\n   Fallback / Office system font: Aptos.\n\n   Type styles (from the guidelines):\n     • Display  — Söhne Halbfett (700), ALL CAPS, short phrases only.\n     • Headline — Söhne Kräftig (600), sentence case.\n     • Body     — Söhne Buch (400).\n     • Paragraph titles — Söhne Kräftig (600).\n\n   General rules: no custom kerning / tracking. Text is aligned left or\n   centred. Line-height 120–130% based on size.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* Families */\n  --font-brand: 'Hanken Grotesk', 'Söhne', 'Aptos', -apple-system, 'Segoe UI', system-ui, sans-serif;\n  --font-sans:  var(--font-brand);\n  --font-mono:  ui-monospace, 'SFMono-Regular', 'Consolas', monospace;\n\n  /* Weights (mapped from Söhne: Leicht/Buch/Kräftig/Halbfett) */\n  --fw-light:    300; /* @kind font */\n  --fw-book:     400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* Fluid display sizes (clamped for responsive hero use) */\n  --fs-display-xl: clamp(3rem, 1.5rem + 6vw, 6rem); /* @kind other */\n  --fs-display-lg: clamp(2.5rem, 1.4rem + 4.5vw, 4.5rem); /* @kind other */\n  --fs-display-md: clamp(2rem, 1.2rem + 3vw, 3.25rem); /* @kind other */\n\n  /* Static type scale */\n  --fs-h1: 2.5rem; /* @kind font */\n  --fs-h2: 2rem; /* @kind font */\n  --fs-h3: 1.5rem; /* @kind font */\n  --fs-h4: 1.25rem; /* @kind font */\n  --fs-lead: 1.25rem; /* @kind font */\n  --fs-body: 1rem; /* @kind font */\n  --fs-sm: 0.875rem; /* @kind font */\n  --fs-xs: 0.75rem; /* @kind font */\n  --fs-eyebrow: 0.8125rem; /* @kind font */\n\n  /* Line-heights (120–130% brand range; looser for body) */\n  --lh-display: 1.05; /* @kind font */\n  --lh-heading: 1.15; /* @kind font */\n  --lh-snug:    1.25; /* @kind font */\n  --lh-body:    1.5; /* @kind font */\n\n  /* Letter-spacing — brand avoids tracking; only eyebrows get a touch */\n  --ls-tight:   -0.01em; /* @kind font */\n  --ls-normal:  0; /* @kind font */\n  --ls-eyebrow: 0.08em; /* @kind font */\n\n  /* Semantic aliases */\n  --text-display-weight: var(--fw-bold);\n  --text-heading-weight: var(--fw-semibold);\n  --text-body-weight:    var(--fw-book);\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Spacing & layout tokens\n   --------------------------------------------------------------------\n   The brand embraces clean lines and purposeful negative space, so the\n   spacing scale is generous. 4px base unit.\n   ------------------------------------------------------------------ */\n\n:root {\n  --space-0:  0;\n  --space-1:  0.25rem;  /* 4  */\n  --space-2:  0.5rem;   /* 8  */\n  --space-3:  0.75rem;  /* 12 */\n  --space-4:  1rem;     /* 16 */\n  --space-5:  1.5rem;   /* 24 */\n  --space-6:  2rem;     /* 32 */\n  --space-7:  3rem;     /* 48 */\n  --space-8:  4rem;     /* 64 */\n  --space-9:  6rem;     /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-narrow: 760px;\n  --gutter: clamp(1rem, 4vw, 3rem); /* @kind spacing */\n  --section-y: clamp(3rem, 6vw, 6rem); /* @kind spacing */\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Radius, borders, shadow & the Stack shape\n   --------------------------------------------------------------------\n   The signature brand device is \"The Stack\": a rectangle with a curved\n   (semicircle) edge at the beginning OR the end, inspired by the bars of\n   the monogram. The --stack-radius token drives that half-round end.\n\n   The overall visual style is refined and sharp with clean lines, so\n   general UI radii are modest and elevation is used sparingly.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* General UI radii */\n  --radius-none: 0;\n  --radius-xs: 3px;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-pill: 999px;      /* fully rounded — both ends (stadium) */\n\n  /* The Stack — half-round end. Applied to one side only, e.g.\n     border-radius: 0 var(--stack-radius) var(--stack-radius) 0; */\n  --stack-radius: 999px;\n\n  /* Border widths */\n  --border-1: 1px; /* @kind other */\n  --border-2: 2px; /* @kind other */\n\n  /* Elevation — sparing, neutral, low-spread. */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);\n  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.08);\n  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);\n\n  /* Focus ring */\n  --ring-focus: 0 0 0 3px rgba(71, 151, 247, 0.45); /* Blue @ 45% */\n\n  /* Motion — calm, confident. Short fades / eases; no bounce. */\n  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-med: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Base element defaults\n   --------------------------------------------------------------------\n   Light, unobtrusive resets + brand typographic defaults. Keeps\n   specimens and consuming pages consistent without heavy opinionated\n   normalisation.\n   ------------------------------------------------------------------ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-brand);\n  font-weight: var(--fw-book);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headlines — Söhne Kräftig (600), sentence case, tight leading */\nh1, h2, h3, h4, h5, h6 {\n  margin: 0 0 0.5em;\n  font-weight: var(--fw-semibold);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--ls-tight);\n  color: var(--text-body);\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); }\nh4 { font-size: var(--fs-h4); }\n\np { margin: 0 0 1em; text-wrap: pretty; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; }\n\n/* Display utility — Söhne Halbfett, ALL CAPS, short phrases only */\n.ec-display {\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-display-lg);\n  line-height: var(--lh-display);\n  letter-spacing: var(--ls-tight);\n  text-transform: uppercase;\n}\n\n/* Eyebrow / label */\n.ec-eyebrow {\n  font-size: var(--fs-eyebrow);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--ring-focus);\n  border-radius: var(--radius-xs);\n}\n\nimg { max-width: 100%; display: block; }\n\n<\u002Fstyle>\n<script src=\"efe4abe2-3e3f-461a-a971-69d451c3db4f\"><\u002Fscript>\n<style>\nbody{margin:0;background:#edebe5;font-family:var(--font-brand)}\nsummary{list-style:none}\nsummary::-webkit-details-marker{display:none}\ndetails[open] > summary .chev{transform:rotate(180deg)}\nbutton:focus-visible, summary:focus-visible, a:focus-visible{outline:3px solid var(--ec-blue);outline-offset:2px}\n.dv-turn{padding:40px 44px 32px;border-bottom:1px solid rgba(0,0,0,.08);scroll-margin-top:16px}\n.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 20px}\n.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none}\n.dv-tname{font:600 13px/1.2 var(--font-brand);color:#1a1a1a}\n.dv-opts{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}\n.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}\n.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none}\n.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 var(--font-brand);color:rgba(0,0,0,.55)}\n.dv-card{max-width:100%;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:8px;box-shadow:0 1px 3px r column; gap:12px\">\n  <a href=\"#1d\" style=\"color:var(--ec-copper); text-decoration:none; font-size:14px\">Statement of Ethical Principles<\u002Fa>\n  <span style=\"font-size:11px; margin-top:6px\">© Engineering Council 2026. Registered Charity Number 286142<\u002Fspan>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Try next: \"combine <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa> with the <a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa> mobile pattern\" · \"try tier columns with row-aligned statements\" · \"make the overview cards more compact\"<\u002Fp>\n<\u002Fsection>\n\n<div id=\"term-popover\" popover=\"auto\" style=\"position:fixed; inset:auto; margin:0; width:360px; max-width:90vw; background:var(--ec-white); color:var(--ec-ink); border:2px solid var(--ec-black); border-radius:10px; padding:20px 22px; box-shadow:0 12px 32px rgba(0,0,0,.22); font-family:var(--font-brand)\">\n  <p style=\"margin:0 0 8px; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ec-grey-600)\">UK-SPEC definition · esc to close<\u002Fp>\n  <h4 style=\"margin:0 0 8px; font-size:17px; font-weight:600\">{{ termLabel }}<\u002Fh4>\n  <p style=\"margin:0; font-size:14.5px; line-height:1.6\">{{ termBody }}<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;groupsOpen&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behaviour&quot;, &quot;description&quot;: &quot;Open all comparison areas by default&quot;}\n}\">\nclass Component extends DCLogic {\n  state = { cmp: null, std: null, term: null, mobSel: ['IEng', 'CEng'] };\n\n  componentDidMount() {\n    fetch((window.__resources && window.__resources.cmpData) || 'data/index-comparison.json')\n      .then((r) => r.json())\n      .then((cmp) => this.setState({ cmp }))\n      .catch((err) => console.error('Failed to load index-comparison.json', err));\n    fetch((window.__resources && window.__resources.cengData) || 'data/ceng-standard.json')\n      .then((r) => r.json())\n      .then((std) => this.setState({ std }))\n      .catch((err) => console.error('Failed to load ceng-standard.json', err));\n  }\n\n  openTerm = (e) => {\n    const rect = e.currentTarget.getBoundingClientRect();\n    const key = e.currentTarget.dataset.term;\n    this.setState({ term: key }, () => {\n      const el = document.getElementById('term-popover');\n      if (!el || !el.showPopover) return;\n      try { el.hidePopover(); } catch (_) { /* not open */ }\n      const left = Math.max(12, Math.min(rect.left, window.innerWidth - 392));\n      let top = rect.bottom + 10;\n      if (top > window.innerHeight - 280) top = Math.max(12, rect.top - 280);\n      el.style.left = left + 'px';\n      el.style.top = top + 'px';\n      el.showPopover();\n    });\n  };\n\n  toggleTier = (e) => {\n    const t = e.currentTarget.dataset.tier;\n    let sel = this.state.mobSel.slice();\n    if (sel.includes(t)) {\n      if (sel.length > 1) sel = sel.filter((x) => x !== t);\n    } else {\n      sel.push(t);\n      if (sel.length > 2) sel = sel.slice(-2);\n    }\n    this.setState({ mobSel: sel });\n  };\n\n  renderVals() {\n    const cmp = this.state.cmp;\n    const std = this.state.std;\n    const stripNote = (t) => (t || '').replace(/\\s*\\[[^\\]]*\\]\\s*$/, '');\n    const TIERS = ['EngTech', 'IEng', 'CEng'];\n    const FULL = { EngTech: 'Engineering Technician', IEng: 'Incorporated Engineer', CEng: 'Chartered Engineer' };\n\n    const overview = cmp\n      ? cmp.overview.map((o) => ({\n          ...o,\n          fullName: FULL[o.title] || o.title,\n          isActive: o.title === 'CEng',\n          isStub: o.title !== 'CEng',\n          href: { EngTech: 'prototype0.3.html#3b', IEng: 'prototype0.3.html#3c', CEng: 'prototype0.3.html#3a' }[o.title],\n          cta: 'View the full ' + o.title + ' standard →',\n          isEngTech: o.title === 'EngTech',\n        }))\n      : undefined;\n\n    const compareGroups = cmp\n      ? cmp.tiers.CEng.map((cg) => ({\n          id: cg.id,\n          title: cg.title,\n          cols: TIERS.map((t) => {\n            const g = (cmp.tiers[t] || []).find((x) => x.id === cg.id);\n            return { tier: t, framing: g ? g.framing : '', statements: g ? g.statements : [] };\n          }),\n        }))\n      : undefined;\n\n    const chipBase = 'font-family:inherit; font-size:13px; font-weight:700; padding:9px 16px; border-radius:999px; cursor:pointer; min-height:40px;';\n    const mobChips = TIERS.map((t) => {\n      const on = this.state.mobSel.includes(t);\n      return {\n        tier: t,\n        on,\n        style: on\n          ? chipBase + 'background:var(--ec-copper); color:var(--ec-black-on-warm); border:2px solid var(--ec-copper);'\n          : chipBase + 'background:transparent; color:#fff; border:2px solid rgba(255,255,255,.35);',\n      };\n    });\n\n    const mobGroups = compareGroups\n      ? compareGroups.map((g) => ({\n          ...g,\n          mobCols: g.cols.filter((c) => this.state.mobSel.includes(c.tier)),\n        }))\n      : undefined;\n\n    const term = std && this.state.term ? std.terms[this.state.term] : null;\n\n    return {\n      overview,\n      compareGroups,\n      mobGroups,\n      mobChips,\n      toggleTier: this.toggleTier,\n      termLabel: term ? term.label : '',\n      termBody: term ? stripNote(term.html) : '',\n      openTerm: this.openTerm,\n      printPage: () => window.print(),\n      groupsOpen: this.props.groupsOpen ?? false,\n      logoH: 34,\n      logoHsm: 26,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
