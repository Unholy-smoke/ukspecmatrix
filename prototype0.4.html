  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

e: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"35eab778-ceac-46eb-a5d7-5364a5ddae89\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"28f77ec3-952c-4d6f-8189-75fa5b848172\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"cd1a0689-bd0b-4feb-a555-a83318e3448d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"6492a4c2-eab7-4261-8c0a-15ef2f5a1c9e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"35eab778-ceac-46eb-a5d7-5364a5ddae89\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0 y: swap;\n  src: url(\"cd1a0689-bd0b-4feb-a555-a83318e3448d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"6492a4c2-eab7-4261-8c0a-15ef2f5a1c9e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"35eab778-ceac-46eb-a5d7-5364a5ddae89\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"28f77ec3-952c-4d6f-8189-75fa5b848172\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"cd1a0689-bd0b-4feb-a555-a83318e3448d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6492a4c2-eab7-4261-8c0a-15ef2f5a1c9e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"35eab778-ceac-46eb-a5d7-5364a5ddae89\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"28f77ec3-952c-4d6f-8189-75fa5b848172\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"cd1a0689-bd0b-4feb-a555-a83318e3448d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"6492a4c2-eab7-4261-8c0a-15ef2f5a1c9e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"35eab778-ceac-46eb-a5d7-5364a5ddae89\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Colour tokens\n   --------------------------------------------------------------------\n   Copper is the HERO colour and should feature prominently. Despite its\n   name, the brand \"Copper\" is a bright aqua/turquoise (#35ffdc,\n   Pantone 333C) — the colour the brand wants to be known for.\n\n   Black provides strong contrast with Copper. Three supporting tones —\n   Orange, Blue, Red — add flexibility and are typically used as\n   background colours with black or white text over them.\n\n   Colour rules (from the guidelines):\n     • Never place Copper directly beside a supporting colour — always\n       keep visual separation.\n     • Copper on Black for headlines and large page titles.\n     • Supporting colours are usually background colours.\n     • Lead with Copper for hero communications; a supporting colour may\n       lead day-to-day design (social, slides).\n   ------------------------------------------------------------------ */\n\n:root {\n  /* ---- Brand palette (raw values) ---- */\n  --ec-copper: #35ffdc;   /* HERO — Pantone 333C */\n  --ec-orange: #ff9c3e;   /* Pantone 157C */\n  --ec-blue:   #4797f7;   /* Pantone 2727C */\n  --ec-red:    #ff7277;   /* Pantone 1777C */\n  --ec-black:  #000000;\n  --ec-white:  #ffffff;\n\n  /* ---- Accessibility text-blacks (WCAG AAA) ----\n     Use these instead of pure black when text sits ON a brand colour. */\n  --ec-black-on-blue:   #010000; /* black text over Blue */\n  --ec-black-on-warm:   #1d1d1b; /* black text over Copper, Orange, Red */\n\n  /* ---- Neutral scale (derived, for UI surfaces & borders) ---- */\n  --ec-ink:      #000000; /* primary text */\n  --ec-ink-2:    #1d1d1b; /* near-black text on warm colour */\n  --ec-grey-900: #111110;\n  --ec-grey-700: #3a3a37;\n  --ec-grey-600: #5c5c58;\n  --ec-grey-500: #78787330;\n  --ec-grey-500-solid: #787873;\n  --ec-grey-400: #a3a39d;\n  --ec-grey-300: #cfcfc9;\n  --ec-grey-200: #e6e6e1;\n  --ec-grey-100: #f2f2ee;\n  --ec-grey-050: #f9f9f6;\n\n  /* ---- Copper tint (for subtle fills on light UI) ---- */\n  --ec-copper-tint:   #e4fff9;\n  --ec-copper-strong: #10c9a6; /* accessible copper for small text/links on white */\n\n  /* =============================================================\n     SEMANTIC ALIASES — reference these in components, not the raw\n     values above.\n     ============================================================= */\n\n  /* Surfaces */\n  --surface-page:      var(--ec-white);\n  --surface-inverse:   var(--ec-black);\n  --surface-card:      var(--ec-white);\n  --surface-muted:     var(--ec-grey-050);\n  --surface-sunken:    var(--ec-grey-100);\n  --surface-copper:    var(--ec-copper);\n  --surface-orange:    var(--ec-orange);\n  --surface-blue:      var(--ec-blue);\n  --surface-red:       var(--ec-red);\n\n  /* Text */\n  --text-body:         var(--ec-ink);\n  --text-muted:        var(--ec-grey-600);\n  --text-subtle:       var(--ec-grey-500-solid);\n  --text-on-inverse:   var(--ec-white);\n  --text-on-copper:    var(--ec-black-on-warm);\n  --text-on-blue:      var(--ec-black-on-blue);\n  --text-link:         var(--ec-copper-strong);\n\n  /* Borders & lines */\n  --border-default:    var(--ec-grey-200);\n  --border-strong:     var(--ec-grey-300);\n  --border-ink:        var(--ec-black);\n  --border-focus:      var(--ec-blue);\n\n  /* Interactive (actions lead with Copper on Black or Black on Copper) */\n  --action-primary-bg:       var(--ec-black);\n  --action-primary-fg:       var(--ec-copper);\n  --action-primary-hover-bg: var(--ec-grey-900);\n  --action-secondary-bg:     var(--ec-copper);\n  --action-secondary-fg:     var(--ec-black-on-warm);\n  --action-secondary-hover-bg:#2be6c5;\n\n  /* Feedback (reuse brand supporting tones) */\n  --feedback-info:     var(--ec-blue);\n  --feedback-warning:  var(--ec-orange);\n  --feedback-danger:   var(--ec-red);\n  --feedback-success:  var(--ec-copper-strong);\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Typography tokens\n   --------------------------------------------------------------------\n   Primary typeface: Söhne (substituted here with Hanken Grotesk).\n   Fallback / Office system font: Aptos.\n\n   Type styles (from the guidelines):\n     • Display  — Söhne Halbfett (700), ALL CAPS, short phrases only.\n     • Headline — Söhne Kräftig (600), sentence case.\n     • Body     — Söhne Buch (400).\n     • Paragraph titles — Söhne Kräftig (600).\n\n   General rules: no custom kerning / tracking. Text is aligned left or\n   centred. Line-height 120–130% based on size.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* Families */\n  --font-brand: 'Hanken Grotesk', 'Söhne', 'Aptos', -apple-system, 'Segoe UI', system-ui, sans-serif;\n  --font-sans:  var(--font-brand);\n  --font-mono:  ui-monospace, 'SFMono-Regular', 'Consolas', monospace;\n\n  /* Weights (mapped from Söhne: Leicht/Buch/Kräftig/Halbfett) */\n  --fw-light:    300; /* @kind font */\n  --fw-book:     400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* Fluid display sizes (clamped for responsive hero use) */\n  --fs-display-xl: clamp(3rem, 1.5rem + 6vw, 6rem); /* @kind other */\n  --fs-display-lg: clamp(2.5rem, 1.4rem + 4.5vw, 4.5rem); /* @kind other */\n  --fs-display-md: clamp(2rem, 1.2rem + 3vw, 3.25rem); /* @kind other */\n\n  /* Static type scale */\n  --fs-h1: 2.5rem; /* @kind font */\n  --fs-h2: 2rem; /* @kind font */\n  --fs-h3: 1.5rem; /* @kind font */\n  --fs-h4: 1.25rem; /* @kind font */\n  --fs-lead: 1.25rem; /* @kind font */\n  --fs-body: 1rem; /* @kind font */\n  --fs-sm: 0.875rem; /* @kind font */\n  --fs-xs: 0.75rem; /* @kind font */\n  --fs-eyebrow: 0.8125rem; /* @kind font */\n\n  /* Line-heights (120–130% brand range; looser for body) */\n  --lh-display: 1.05; /* @kind font */\n  --lh-heading: 1.15; /* @kind font */\n  --lh-snug:    1.25; /* @kind font */\n  --lh-body:    1.5; /* @kind font */\n\n  /* Letter-spacing — brand avoids tracking; only eyebrows get a touch */\n  --ls-tight:   -0.01em; /* @kind font */\n  --ls-normal:  0; /* @kind font */\n  --ls-eyebrow: 0.08em; /* @kind font */\n\n  /* Semantic aliases */\n  --text-display-weight: var(--fw-bold);\n  --text-heading-weight: var(--fw-semibold);\n  --text-body-weight:    var(--fw-book);\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Spacing & layout tokens\n   --------------------------------------------------------------------\n   The brand embraces clean lines and purposeful negative space, so the\n   spacing scale is generous. 4px base unit.\n   ------------------------------------------------------------------ */\n\n:root {\n  --space-0:  0;\n  --space-1:  0.25rem;  /* 4  */\n  --space-2:  0.5rem;   /* 8  */\n  --space-3:  0.75rem;  /* 12 */\n  --space-4:  1rem;     /* 16 */\n  --space-5:  1.5rem;   /* 24 */\n  --space-6:  2rem;     /* 32 */\n  --space-7:  3rem;     /* 48 */\n  --space-8:  4rem;     /* 64 */\n  --space-9:  6rem;     /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-narrow: 760px;\n  --gutter: clamp(1rem, 4vw, 3rem); /* @kind spacing */\n  --section-y: clamp(3rem, 6vw, 6rem); /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Radius, borders, shadow & the Stack shape\n   --------------------------------------------------------------------\n   The signature brand device is \"The Stack\": a rectangle with a curved\n   (semicircle) edge at the beginning OR the end, inspired by the bars of\n   the monogram. The --stack-radius token drives that half-round end.\n\n   The overall visual style is refined and sharp with clean lines, so\n   general UI radii are modest and elevation is used sparingly.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* General UI radii */\n  --radius-none: 0;\n  --radius-xs: 3px;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-pill: 999px;      /* fully rounded — both ends (stadium) */\n\n  /* The Stack — half-round end. Applied to one side only, e.g.\n     border-radius: 0 var(--stack-radius) var(--stack-radius) 0; */\n  --stack-radius: 999px;\n\n  /* Border widths */\n  --border-1: 1px; /* @kind other */\n  --border-2: 2px; /* @kind other */\n\n  /* Elevation — sparing, neutral, low-spread. */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);\n  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.08);\n  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);\n\n  /* Focus ring */\n  --ring-focus: 0 0 0 3px rgba(71, 151, 247, 0.45); /* Blue @ 45% */\n\n  /* Motion — calm, confident. Short fades / eases; no bounce. */\n  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-med: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ------------------------------------------------------------------\n   Engineering Council — Base element defaults\n   --------------------------------------------------------------------\n   Light, unobtrusive resets + brand typographic defaults. Keeps\n   specimens and consuming pages consistent without heavy opinionated\n   normalisation.\n   ------------------------------------------------------------------ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-brand);\n  font-weight: var(--fw-book);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headlines — Söhne Kräftig (600), sentence case, tight leading */\nh1, h2, h3, h4, h5, h6 {\n  margin: 0 0 0.5em;\n  font-weight: var(--fw-semibold);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--ls-tight);\n  color: var(--text-body);\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); }\nh4 { font-size: var(--fs-h4); }\n\np { margin: 0 0 1em; text-wrap: pretty; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; }\n\n/* Display utility — Söhne Halbfett, ALL CAPS, short phrases only */\n.ec-display {\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-display-lg);\n  line-height: var(--lh-display);\n  letter-spacing: var(--ls-tight);\n  text-transform: uppercase;\n}\n\n/* Eyebrow / label */\n.ec-eyebrow {\n  font-size: var(--fs-eyebrow);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--ring-focus);\n  border-radius: var(--radius-xs);\n}\n\nimg { max-width: 100%; display: block; }\n<\u002Fstyle>\n<style>/* ==================================================================\n   Engineering Council — Design System\n   Global stylesheet entry point.\n\n   Consumers link THIS file only. It is a manifest of @import lines;\n   never add rules directly here.\n   ================================================================== */\n\n/* ------------------------------------------------------------------\n   Engineering Council — Webfonts\n   --------------------------------------------------------------------\n   Brand primary typeface is Söhne (Klim Type Foundry, commercial).\n   Söhne is NOT freely redistributable, so this system ships a close\n   open substitute — Hanken Grotesk — a neutral grotesque with subtle\n   humanist touches that mirrors Söhne's proportions and weight range.\n   Replace with licensed Söhne web binaries when available.\n\n   Weight map (Söhne -> substitute):\n     Söhne Leicht (Light)      -> 300\n     Söhne Buch (Book)         -> 400\n     Söhne Kräftig (Semi-Bold) -> 600\n     Söhne Halbfett (Bold)     -> 700\n   ------------------------------------------------------------------ */\n\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"28f77ec3-952c-4d6f-8189-75fa5b848172\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"cd1a0689-bd0b-4feb-a555-a83318e3448d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"6492a4c2-eab7-4261-8c0a-15ef2f5a1c9e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 300;\n  font-display: swap;\n  src: url(\"35eab778-ceac-46eb-a5d7-5364a5ddae89\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEF font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"28f77ec3-952c-4d6f-8189-75fa5b848172\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"cd1a0689-bd0b-4feb-a555-a83318e3448d\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"6492a4c2-eab7-4261-8c0a-15ef2f5a1c9e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Hanken Grotesk';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"35eab778-ceac-46eb-a5d7-5364a5ddae89\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ------------------------------------------------------------------\n   Engineering Council — Colour tokens\n   --------------------------------------------------------------------\n   Copper is the HERO colour and should feature prominently. Despite its\n   name, the brand \"Copper\" is a bright aqua/turquoise (#35ffdc,\n   Pantone 333C) — the colour the brand wants to be known for.\n\n   Black provides strong contrast with Copper. Three supporting tones —\n   Orange, Blue, Red — add flexibility and are typically used as\n   background colours with black or white text over them.\n\n   Colour rules (from the guidelines):\n     • Never place Copper directly beside a supporting colour — always\n       keep visual separation.\n     • Copper on Black for headlines and large page titles.\n     • Supporting colours are usually background colours.\n     • Lead with Copper for hero communications; a supporting colour may\n       lead day-to-day design (social, slides).\n   ------------------------------------------------------------------ */\n\n:root {\n  /* ---- Brand palette (raw values) ---- */\n  --ec-copper: #35ffdc;   /* HERO — Pantone 333C */\n  --ec-orange: #ff9c3e;   /* Pantone 157C */\n  --ec-blue:   #4797f7;   /* Pantone 2727C */\n  --ec-red:    #ff7277;   /* Pantone 1777C */\n  --ec-black:  #000000;\n  --ec-white:  #ffffff;\n\n  /* ---- Accessibility text-blacks (WCAG AAA) ----\n     Use these instead of pure black when text sits ON a brand colour. */\n  --ec-black-on-blue:   #010000; /* black text over Blue */\n  --ec-black-on-warm:   #1d1d1b; /* black text over Copper, Orange, Red */\n\n  /* ---- Neutral scale (derived, for UI surfaces & borders) ---- */\n  --ec-ink:      #000000; /* primary text */\n  --ec-ink-2:    #1d1d1b; /* near-black text on warm colour */\n  --ec-grey-900: #111110;\n  --ec-grey-700: #3a3a37;\n  --ec-grey-600: #5c5c58;\n  --ec-grey-500: #78787330;\n  --ec-grey-500-solid: #787873;\n  --ec-grey-400: #a3a39d;\n  --ec-grey-300: #cfcfc9;\n  --ec-grey-200: #e6e6e1;\n  --ec-grey-100: #f2f2ee;\n  --ec-grey-050: #f9f9f6;\n\n  /* ---- Copper tint (for subtle fills on light UI) ---- */\n  --ec-copper-tint:   #e4fff9;\n  --ec-copper-strong: #10c9a6; /* accessible copper for small text/links on white */\n\n  /* =============================================================\n     SEMANTIC ALIASES — reference these in components, not the raw\n     values above.\n     ============================================================= */\n\n  /* Surfaces */\n  --surface-page:      var(--ec-white);\n  --surface-inverse:   var(--ec-black);\n  --surface-card:      var(--ec-white);\n  --surface-muted:     var(--ec-grey-050);\n  --surface-sunken:    var(--ec-grey-100);\n  --surface-copper:    var(--ec-copper);\n  --surface-orange:    var(--ec-orange);\n  --surface-blue:      var(--ec-blue);\n  --surface-red:       var(--ec-red);\n\n  /* Text */\n  --text-body:         var(--ec-ink);\n  --text-muted:        var(--ec-grey-600);\n  --text-subtle:       var(--ec-grey-500-solid);\n  --text-on-inverse:   var(--ec-white);\n  --text-on-copper:    var(--ec-black-on-warm);\n  --text-on-blue:      var(--ec-black-on-blue);\n  --text-link:         var(--ec-copper-strong);\n\n  /* Borders & lines */\n  --border-default:    var(--ec-grey-200);\n  --border-strong:     var(--ec-grey-300);\n  --border-ink:        var(--ec-black);\n  --border-focus:      var(--ec-blue);\n\n  /* Interactive (actions lead with Copper on Black or Black on Copper) */\n  --action-primary-bg:       var(--ec-black);\n  --action-primary-fg:       var(--ec-copper);\n  --action-primary-hover-bg: var(--ec-grey-900);\n  --action-secondary-bg:     var(--ec-copper);\n  --action-secondary-fg:     var(--ec-black-on-warm);\n  --action-secondary-hover-bg:#2be6c5;\n\n  /* Feedback (reuse brand supporting tones) */\n  --feedback-info:     var(--ec-blue);\n  --feedback-warning:  var(--ec-orange);\n  --feedback-danger:   var(--ec-red);\n  --feedback-success:  var(--ec-copper-strong);\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Typography tokens\n   --------------------------------------------------------------------\n   Primary typeface: Söhne (substituted here with Hanken Grotesk).\n   Fallback / Office system font: Aptos.\n\n   Type styles (from the guidelines):\n     • Display  — Söhne Halbfett (700), ALL CAPS, short phrases only.\n     • Headline — Söhne Kräftig (600), sentence case.\n     • Body     — Söhne Buch (400).\n     • Paragraph titles — Söhne Kräftig (600).\n\n   General rules: no custom kerning / tracking. Text is aligned left or\n   centred. Line-height 120–130% based on size.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* Families */\n  --font-brand: 'Hanken Grotesk', 'Söhne', 'Aptos', -apple-system, 'Segoe UI', system-ui, sans-serif;\n  --font-sans:  var(--font-brand);\n  --font-mono:  ui-monospace, 'SFMono-Regular', 'Consolas', monospace;\n\n  /* Weights (mapped from Söhne: Leicht/Buch/Kräftig/Halbfett) */\n  --fw-light:    300; /* @kind font */\n  --fw-book:     400; /* @kind font */\n  --fw-medium:   500; /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold:     700; /* @kind font */\n\n  /* Fluid display sizes (clamped for responsive hero use) */\n  --fs-display-xl: clamp(3rem, 1.5rem + 6vw, 6rem); /* @kind other */\n  --fs-display-lg: clamp(2.5rem, 1.4rem + 4.5vw, 4.5rem); /* @kind other */\n  --fs-display-md: clamp(2rem, 1.2rem + 3vw, 3.25rem); /* @kind other */\n\n  /* Static type scale */\n  --fs-h1: 2.5rem; /* @kind font */\n  --fs-h2: 2rem; /* @kind font */\n  --fs-h3: 1.5rem; /* @kind font */\n  --fs-h4: 1.25rem; /* @kind font */\n  --fs-lead: 1.25rem; /* @kind font */\n  --fs-body: 1rem; /* @kind font */\n  --fs-sm: 0.875rem; /* @kind font */\n  --fs-xs: 0.75rem; /* @kind font */\n  --fs-eyebrow: 0.8125rem; /* @kind font */\n\n  /* Line-heights (120–130% brand range; looser for body) */\n  --lh-display: 1.05; /* @kind font */\n  --lh-heading: 1.15; /* @kind font */\n  --lh-snug:    1.25; /* @kind font */\n  --lh-body:    1.5; /* @kind font */\n\n  /* Letter-spacing — brand avoids tracking; only eyebrows get a touch */\n  --ls-tight:   -0.01em; /* @kind font */\n  --ls-normal:  0; /* @kind font */\n  --ls-eyebrow: 0.08em; /* @kind font */\n\n  /* Semantic aliases */\n  --text-display-weight: var(--fw-bold);\n  --text-heading-weight: var(--fw-semibold);\n  --text-body-weight:    var(--fw-book);\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Spacing & layout tokens\n   --------------------------------------------------------------------\n   The brand embraces clean lines and purposeful negative space, so the\n   spacing scale is generous. 4px base unit.\n   ------------------------------------------------------------------ */\n\n:root {\n  --space-0:  0;\n  --space-1:  0.25rem;  /* 4  */\n  --space-2:  0.5rem;   /* 8  */\n  --space-3:  0.75rem;  /* 12 */\n  --space-4:  1rem;     /* 16 */\n  --space-5:  1.5rem;   /* 24 */\n  --space-6:  2rem;     /* 32 */\n  --space-7:  3rem;     /* 48 */\n  --space-8:  4rem;     /* 64 */\n  --space-9:  6rem;     /* 96 */\n  --space-10: 8rem;     /* 128 */\n\n  /* Layout */\n  --container-max: 1200px;\n  --container-narrow: 760px;\n  --gutter: clamp(1rem, 4vw, 3rem); /* @kind spacing */\n  --section-y: clamp(3rem, 6vw, 6rem); /* @kind spacing */\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Radius, borders, shadow & the Stack shape\n   --------------------------------------------------------------------\n   The signature brand device is \"The Stack\": a rectangle with a curved\n   (semicircle) edge at the beginning OR the end, inspired by the bars of\n   the monogram. The --stack-radius token drives that half-round end.\n\n   The overall visual style is refined and sharp with clean lines, so\n   general UI radii are modest and elevation is used sparingly.\n   ------------------------------------------------------------------ */\n\n:root {\n  /* General UI radii */\n  --radius-none: 0;\n  --radius-xs: 3px;\n  --radius-sm: 6px;\n  --radius-md: 10px;\n  --radius-lg: 16px;\n  --radius-pill: 999px;      /* fully rounded — both ends (stadium) */\n\n  /* The Stack — half-round end. Applied to one side only, e.g.\n     border-radius: 0 var(--stack-radius) var(--stack-radius) 0; */\n  --stack-radius: 999px;\n\n  /* Border widths */\n  --border-1: 1px; /* @kind other */\n  --border-2: 2px; /* @kind other */\n\n  /* Elevation — sparing, neutral, low-spread. */\n  --shadow-none: none;\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);\n  --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.08);\n  --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.12);\n\n  /* Focus ring */\n  --ring-focus: 0 0 0 3px rgba(71, 151, 247, 0.45); /* Blue @ 45% */\n\n  /* Motion — calm, confident. Short fades / eases; no bounce. */\n  --ease-standard: cubic-bezier(0.2, 0, 0.2, 1); /* @kind other */\n  --ease-out: cubic-bezier(0, 0, 0.2, 1); /* @kind other */\n  --dur-fast: 120ms; /* @kind other */\n  --dur-med: 200ms; /* @kind other */\n  --dur-slow: 320ms; /* @kind other */\n}\n\n/* ------------------------------------------------------------------\n   Engineering Council — Base element defaults\n   --------------------------------------------------------------------\n   Light, unobtrusive resets + brand typographic defaults. Keeps\n   specimens and consuming pages consistent without heavy opinionated\n   normalisation.\n   ------------------------------------------------------------------ */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n  margin: 0;\n  font-family: var(--font-brand);\n  font-weight: var(--fw-book);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--text-body);\n  background: var(--surface-page);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Headlines — Söhne Kräftig (600), sentence case, tight leading */\nh1, h2, h3, h4, h5, h6 {\n  margin: 0 0 0.5em;\n  font-weight: var(--fw-semibold);\n  line-height: var(--lh-heading);\n  letter-spacing: var(--ls-tight);\n  color: var(--text-body);\n  text-wrap: balance;\n}\nh1 { font-size: var(--fs-h1); }\nh2 { font-size: var(--fs-h2); }\nh3 { font-size: var(--fs-h3); }\nh4 { font-size: var(--fs-h4); }\n\np { margin: 0 0 1em; text-wrap: pretty; }\n\na { color: var(--text-link); text-decoration: none; }\na:hover { text-decoration: underline; }\n\n/* Display utility — Söhne Halbfett, ALL CAPS, short phrases only */\n.ec-display {\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-display-lg);\n  line-height: var(--lh-display);\n  letter-spacing: var(--ls-tight);\n  text-transform: uppercase;\n}\n\n/* Eyebrow / label */\n.ec-eyebrow {\n  font-size: var(--fs-eyebrow);\n  font-weight: var(--fw-semibold);\n  letter-spacing: var(--ls-eyebrow);\n  text-transform: uppercase;\n  color: var(--text-muted);\n}\n\n:focus-visible {\n  outline: none;\n  box-shadow: var(--ring-focus);\n  border-radius: var(--radius-xs);\n}\n\nimg { max-width: 100%; display: block; }\n\n<\u002Fstyle>\n<script src=\"ee38d685-6e2e-4a7e-8cdc-6b12bb0465f7\"><\u002Fscript>\n<style>\nbody{margin:0;background:#edebe5;font-family:var(--font-brand)}\nsummary{list-style:none}\nsummary::-webkit-details-marker{display:none}\ndetails[open] > summary .chev{transform:rotate(180deg)}\nbutton:focus-visible, summary:focus-visible, a:focus-visible{outline:3px solid var(--ec-blue);outline-offset:2px}\n.dv-turn{padding:40px 44px 32px;border-bottom:1px solid rgba(0,0,0,.08);scroll-margin-top:16px}\n.dv-thd{display:flex;align-items:baseline;gap:10px;margin:0 0 20px}\n.dv-tid{font:600 10px ui-monospace,Menlo,monospace;padding:3px 7px;background:#1a1a1a;color:#fff;border-radius:4px;text-decoration:none}\n.dv-tname{font:600 13px/1.2 var(--font-brand);color:#1a1a1a}\n.dv-opts{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}\n.dv-opt{flex:none;display:flex;flex-direction:column;gap:9px;scroll-margin-top:16px}\n.dv-oid{font:600 10.5px ui-monospace,Menlo,monospace;padding:3px 7px;background:rgba(0,0,0,.08);color:#1a1a1a;border-radius:5px;text-decoration:none}\n.dv-olabel{display:flex;align-items:baseline;gap:8px;font:400 11px/1.3 var(--font-brand);color:rgba(0,0,0,.55)}\n.dv-card{max-width:100%;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:8px;box-shadow:0 1px 3 splay:flex; align-items:center; gap:26px; padding:24px 4px; cursor:pointer\">\n            <span aria-hidden=\"true\" style=\"flex:none; font-size:58px; font-weight:300; line-height:1; color:var(--ec-copper); width:64px\">{{ g.id }}<\u002Fspan>\n            <span style=\"flex:1; font-size:22px; font-weight:600; color:#fff\">{{ g.title }}<\u002Fspan>\n            <span style=\"flex:none; font-size:13px; color:var(--ec-grey-400)\">{{ g.countLabel }}<\u002Fspan>\n            <span class=\"chev\" aria-hidden=\"true\" style=\"flex:none; font-size:13px; color:var(--ec-copper); transition:transform .2s ease\">▾<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding:0 4px 36px 90px\">\n            <p style=\"margin:0 0 12px; font-size:19px; font-weight:600; line-height:1.5; color:var(--ec-copper); max-width:640px\">{{ g.framing }}<\u002Fp>\n            <p style=\"margin:0; font-size:14.5px; line-height:1.65; color:var(--ec-grey-300); max-width:660px\">{{ g.explanation }}<\u002Fp>\n            <div style=\"margin-top:24px; display:flex; flex-direction:column; gap:20px\">\n              <sc-for list=\"{{ g.statements }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"border-top:1px solid rgba(255,255,255,.12); padding-top:18px\">\n                  <h3 style=\"display:flex; gap:14px; align-items:baseline; text-wrap:pretty; margin:0; font-size:16px\">\n                    <span style=\"flex:none; font-size:12.5px; font-weight:700; background:var(--ec-copper); color:var(--ec-black-on-warm); padding:3px 10px; border-radius:0 999px 999px 0\">{{ s.id }}<\u002Fspan>\n                    <span style=\"font-weight:500; line-height:1.55; color:#fff\">{{ s.text }}<\u002Fspan>\n                  <\u002Fh3>\n                  <sc-if value=\"{{ showExamples }}\" hint-placeholder-val=\"{{ true }}\">\n                    <details style=\"margin:12px 0 0 0\">\n                      <summary style=\"display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:13.5px; font-weight:600; color:var(--ec-copper)\"><span class=\"chev\" aria-hidden=\"true\" style=\"font-size:10px; transition:transform .2s ease\">▾<\u002Fspan>{{ s.exLabel }}<\u002Fsummary>\n                      <div style=\"margin-top:10px; background:var(--ec-grey-900); border:1px solid rgba(255,255,255,.1); border-radius:10px; padding:14px 18px\">\n                        <p style=\"margin:0 0 8px; font-size:12.5px; font-style:italic; color:var(--ec-grey-400)\">Illustrative, not a checklist – the most appropriate evidence varies with each individual role.<\u002Fp>\n                        <ul style=\"margin:0; padding:0 0 0 18px; display:flex; flex-direction:column; gap:5px\">\n                          <sc-for list=\"{{ s.illustrativeExamples }}\" as=\"ex\" hint-placeholder-count=\"4\">\n                            <li style=\"font-size:14px; line-height:1.55; color:var(--ec-grey-100)\">{{ ex }}<\u002Fli>\n                          <\u002Fsc-for>\n                        <\u002Ful>\n                      <\u002Fdiv>\n                    <\u002Fdetails>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fsc-for>\n      <div style=\"border-top:1px solid rgba(255,255,255,.2)\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fmain>\n\n<footer style=\"border-top:1px solid rgba(255,255,255,.14); color:var(--ec-grey-400); padding:28px 40px; display:flex; align-items:center; gap:24px; flex-wrap:wrap\">\n  <span style=\"font-size:12px; flex:1\">© Engineering Council 2026. Registered Charity Number 286142<\u002Fspan>\n  <nav aria-label=\"Related\" style=\"display:flex; gap:22px; font-size:13.5px; align-items:center\">\n    <a href=\"#1c\" style=\"color:var(--ec-copper); text-decoration:none\">Full UK-SPEC (PDF)<\u002Fa>\n    <a href=\"#1c\" style=\"color:var(--ec-copper); text-decoration:none\">Ethical Principles<\u002Fa>\n    <a href=\"#1c\" style=\"color:var(--ec-copper); text-decoration:none\">Glossary<\u002Fa>\n    <button type=\"button\" sc-camel-on-click=\"{{ printPage }}\" style=\"background:none; border:1px solid var(--ec-copper); color:var(--ec-copper); font:inherit; font-size:13px; font-weight:600; padding:7px 16px; border-radius:999px; cursor:pointer\">Print this standard<\u002Fbutton>\n  <\u002Fnav>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ============ 1d – Mobile pattern ============ -->\n<div class=\"dv-opt\" id=\"1d\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#1d\">1d<\u002Fa>Mobile pattern (of <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>) – 390px, examples omitted per spec §6<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:390px\" data-screen-label=\"1d CEng detail – Mobile\">\n\n<header style=\"background:var(--ec-black); color:#fff; display:flex; align-items:center; gap:16px; padding:0 20px; height:60px\">\n  <x-import component-from-global-scope=\"EngineeringCouncilDesignSystem_019dd8.Logo\" tone=\"copper-on-black\" height=\"{{ logoHsm }}\" hint-size=\"120px,26px\"><\u002Fx-import>\n  <span style=\"flex:1\"><\u002Fspan>\n  <button type=\"button\" aria-label=\"Menu\" style=\"background:none; border:none; cursor:pointer; display:flex; flex-direction:column; gap:5px; padding:8px\">\n    <span style=\"width:22px; height:2px; background:#fff\"><\u002Fspan>\n    <span style=\"width:22px; height:2px; background:#fff\"><\u002Fspan>\n    <span style=\"width:22px; height:2px; background:#fff\"><\u002Fspan>\n  <\u002Fbutton>\n<\u002Fheader>\n\n<div style=\"background:var(--ec-black); color:#fff; padding:36px 20px 40px\">\n  <p style=\"margin:0 0 12px; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ec-grey-400)\">UK-SPEC · Registration standard<\u002Fp>\n  <h1 style=\"margin:0 0 14px; font-size:40px; line-height:1.05; font-weight:700; text-transform:uppercase; color:var(--ec-copper)\">Chartered Engineer<\u002Fh1>\n  <p style=\"margin:0; font-size:16px; line-height:1.5; color:var(--ec-grey-100)\">The standard for engineers who develop solutions to complex problems through innovation and creativity.<\u002Fp>\n<\u002Fdiv>\n\n<main style=\"background:#fff; padding:32px 20px 40px; display:flex; flex-direction:column; gap:32px\">\n  <section aria-labelledby=\"d-what\">\n    <h2 id=\"d-what\" style=\"margin:0 0 10px; font-size:22px; font-weight:600\">What is a Chartered Engineer?<\u002Fh2>\n    <p style=\"margin:0; font-size:15px; line-height:1.6\">{{ lead }}<\u002Fp>\n  <\u002Fsection>\n  <section aria-labelledby=\"d-how\">\n    <h2 id=\"d-how\" style=\"margin:0 0 10px; font-size:22px; font-weight:600\">How to get registered<\u002Fh2>\n    <p style=\"margin:0 0 14px; font-size:14.5px; line-height:1.6\">You apply through a <button type=\"button\" data-term=\"licensee\" sc-camel-on-click=\"{{ openTerm }}\" style=\"background:none; border:none; padding:0; font:inherit; cursor:pointer; color:var(--ec-copper-strong); font-weight:600; border-bottom:1.5px dotted currentColor\">Professional Engineering Institution<\u002Fbutton> – the institution is the awarding body, not the Engineering Council.<\u002Fp>\n    <x-import component-from-global-scope=\"EngineeringCouncilDesignSystem_019dd8.Button\" variant=\"primary\" size=\"sm\" hint-size=\"230px,36px\">Find your Licensed PEI →<\u002Fx-import>\n  <\u002Fsection>\n  <section aria-labelledby=\"d-comp\">\n    <h2 id=\"d-comp\" style=\"margin:0 0 14px; font-size:22px; font-weight:600\">The competence standard<\u002Fh2>\n    <div style=\"display:flex; flex-direction:column; gap:10px\">\n      <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"5\">\n        <details style=\"border:1px solid var(--border-strong); border-radius:10px; overflow:hidden\">\n          <summary style=\"display:flex; align-items:center; gap:12px; padding:12px 14px 12px 0; cursor:pointer; min-height:44px\">\n            <span aria-hidden=\"true\" style=\"flex:none; width:40px; height:30px; display:flex; align-items:center; justify-content:center; background:var(--ec-copper); color:var(--ec-black-on-warm); font-weight:700; font-size:15px; border-radius:0 999px 999px 0\">{{ g.id }}<\u002Fspan>\n            <span style=\"flex:1; font-size:15px; font-weight:600; line-height:1.3\">{{ g.title }}<\u002Fspan>\n            <span class=\"chev\" aria-hidden=\"true\" style=\"flex:none; font-size:11px; transition:transform .2s ease\">▾<\u002Fspan>\n          <\u002Fsummary>\n          <div style=\"padding:2px 16px 18px 16px\">\n            <p style=\"margin:0 0 8px; font-size:14.5px; font-weight:600; line-height:1.5\">{{ g.framing }}<\u002Fp>\n            <p style=\"margin:0 0 14px; font-size:13.5px; line-height:1.6; color:var(--ec-grey-600)\">{{ g.explanation }}<\u002Fp>\n            <div style=\"display:flex; flex-direction:column; gap:12px\">\n              <sc-for list=\"{{ g.statements }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div style=\"border-top:1px solid var(--border-default); padding-top:12px\">\n                  <h3 style=\"display:flex; gap:10px; align-items:baseline; text-wrap:pretty; margin:0; font-size:13.5px\">\n                    <span style=\"flex:none; font-size:11px; font-weight:700; background:var(--ec-black); color:var(--ec-copper); padding:2px 8px; border-radius:0 999px 999px 0\">{{ s.id }}<\u002Fspan>\n                    <span style=\"font-weight:500; line-height:1.5\">{{ s.text }}<\u002Fspan>\n                  <\u002Fh3>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:14px 0 0; font-size:12px; line-height:1.5; color:var(--ec-grey-500-solid)\">Illustrative examples for each competence are available on larger screens and in the printable standard.<\u002Fp>\n  <\u002Fsection>\n<\u002Fmain>\n\n<footer style=\"background:var(--ec-black); color:var(--ec-grey-400); padding:24px 20px; display:flex; flex-direction:column; gap:12px\">\n  <a href=\"#1d\" style=\"color:var(--ec-copper); text-decoration:none; font-size:14px\">Read the full UK-SPEC (PDF)<\u002Fa>\n  <a href=\"#1d\" style=\"color:var(--ec-copper); text-decoration:none; font-size:14px\">Statement of Ethical Principles<\u002Fa>\n  <a href=\"#1d\" style=\"color:var(--ec-copper); text-decoration:none; font-size:14px\">Glossary of terms<\u002Fa>\n  <span style=\"font-size:11px; margin-top:8px\">© Engineering Council 2026. Registered Charity Number 286142<\u002Fspan>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<p class=\"dv-next\">Try next: “build the index page in the style of <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>” · “make <a class=\"dv-oid\" href=\"#1b\">1b<\u002Fa>’s sidebar collapsible” · “mix <a class=\"dv-oid\" href=\"#1c\">1c<\u002Fa>’s hero with <a class=\"dv-oid\" href=\"#1a\">1a<\u002Fa>’s body”<\u002Fp>\n<\u002Fsection>\n\n<div id=\"term-popover\" popover=\"auto\" style=\"position:fixed; inset:auto; margin:0; width:360px; max-width:90vw; background:var(--ec-white); color:var(--ec-ink); border:2px solid var(--ec-black); border-radius:10px; padding:20px 22px; box-shadow:0 12px 32px rgba(0,0,0,.22); font-family:var(--font-brand)\">\n  <p style=\"margin:0 0 8px; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ec-grey-600)\">UK-SPEC definition · esc to close<\u002Fp>\n  <h4 style=\"margin:0 0 8px; font-size:17px; font-weight:600\">{{ termLabel }}<\u002Fh4>\n  <p style=\"margin:0; font-size:14.5px; line-height:1.6\">{{ termBody }}<\u002Fp>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;groupsOpen&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behaviour&quot;, &quot;description&quot;: &quot;Open all competence areas by default&quot;},\n  &quot;showExamples&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Behaviour&quot;, &quot;description&quot;: &quot;Render the nested Illustrative Examples disclosures&quot;}\n}\">\nclass Component extends DCLogic {\n  state = { data: null, et: null, ie: null, ict: null, term: null };\n\n  componentDidMount() {\n    fetch((window.__resources && window.__resources.cengData) || 'data/ceng-standard.json')\n      .then((r) => r.json())\n      .then((data) => this.setState({ data }))\n      .catch((err) => console.error('Failed to load ceng-standard.json', err));\n    fetch((window.__resources && window.__resources.etData) || 'data/engtech-standard.json')\n      .then((r) => r.json())\n      .then((et) => this.setState({ et }))\n      .catch((err) => console.error('Failed to load engtech-standard.json', err));\n    fetch((window.__resources && window.__resources.ieData) || 'data/ieng-standard.json')\n      .then((r) => r.json())\n      .then((ie) => this.setState({ ie }))\n      .catch((err) => console.error('Failed to load ieng-standard.json', err));\n    fetch((window.__resources && window.__resources.ictData) || 'data/icttech-standard.json')\n      .then((r) => r.json())\n      .then((ict) => this.setState({ ict }))\n      .catch((err) => console.error('Failed to load icttech-standard.json', err));\n  }\n\n  // Opens the target <details> (and any ancestors) before the browser's own\n  // anchor scroll runs, so nav links to collapsed groups don't read as broken.\n  openTarget = (e) => {\n    const href = e.currentTarget.getAttribute('href') || '';\n    if (href.charAt(0) !== '#') return;\n    const el = document.getElementById(href.slice(1));\n    if (!el) return;\n    let n = el;\n    while (n) {\n      if (n.tagName === 'DETAILS') n.open = true;\n      n = n.parentElement;\n    }\n  };\n\n  openTerm = (e) => {\n    const rect = e.currentTarget.getBoundingClientRect();\n    const key = e.currentTarget.dataset.term;\n    const src = e.currentTarget.dataset.src || 'ceng';\n    this.setState({ term: { src, key } }, () => {\n      const el = document.getElementById('term-popover');\n      if (!el || !el.showPopover) return;\n      try { el.hidePopover(); } catch (_) { /* not open */ }\n      const left = Math.max(12, Math.min(rect.left, window.innerWidth - 392));\n      let top = rect.bottom + 10;\n      if (top > window.innerHeight - 280) top = Math.max(12, rect.top - 280);\n      el.style.left = left + 'px';\n      el.style.top = top + 'px';\n      el.showPopover();\n    });\n  };\n\n  renderVals() {\n    const d = this.state.data;\n    const stripNote = (t) => (t || '').replace(/\\s*\\[[^\\]]*\\]\\s*$/, '');\n    const groups = d\n      ? d.groups.map((g) => ({\n          ...g,\n          count: g.statements.length,\n          countLabel: g.statements.length + ' competence' + (g.statements.length === 1 ? '' : 's'),\n          statements: g.statements.map((s) => ({\n            ...s,\n            exLabel: 'Illustrative examples (' + s.illustrativeExamples.length + ')',\n          })),\n        }))\n      : undefined;\n    const total = groups ? groups.reduce((n, g) => n + g.count, 0) : '';\n    const srcJs = { ceng: d, et: this.state.et, ie: this.state.ie };\n    const sel = this.state.term;\n    const tdata = sel ? srcJs[sel.src] : null;\n    const term = tdata && tdata.terms && sel ? tdata.terms[sel.key] : null;\n\n    const prep2 = (j, exWord) => j.groups.map((g) => ({\n      ...g,\n      count: g.statements.length,\n      countLabel: g.statements.length + ' competence' + (g.statements.length === 1 ? '' : 's'),\n      hasIntro: !!g.statementsIntro,\n      statements: g.statements.map((s) => ({ ...s, exLabel: exWord + ' (' + s.illustrativeExamples.length + ')' })),\n    }));\n\n    const itSplit = (s) => { const i = s.indexOf('ICTTech'); return i < 0 ? { a: s, it: '', b: '' } : { a: s.slice(0, i) + 'ICT', it: 'Tech', b: s.slice(i + 7) }; };\n    const PH = 'Professional Engineering Institution (a Licensee)';\n    const mkPage = (j, cfg) => {\n      const pgroups = prep2(j, cfg.exWord);\n      const tot = pgroups.reduce((n, g) => n + g.count, 0);\n      const fm = j.frontMatter;\n      const what = fm ? (fm.whatIsCEng || fm.whatIsEngTech || fm.whatIsIEng) : null;\n      const how = fm ? fm.howToRegister : '';\n      const ix = cfg.termSrc ? how.indexOf(PH) : -1;\n      const stats = [{ v: '5', l: 'Competence areas' }, { v: String(tot), l: 'Competences' }];\n      if (cfg.stat3) stats.push(cfg.stat3);\n      const eb = itSplit(cfg.eyebrow);\n      const cb = itSplit(cfg.crumb);\n      const anch = pgroups.map((g) => ({ ...g, anchor: cfg.aid + '-group-' + g.id, hash: '#' + cfg.aid + '-group-' + g.id }));\n      return {\n        ...cfg,\n        idWhat: cfg.aid + '-what', hashWhat: '#' + cfg.aid + '-what',\n        idHow: cfg.aid + '-how', hashHow: '#' + cfg.aid + '-how',\n        idComp: cfg.aid + '-comp', hashComp: '#' + cfg.aid + '-comp',\n        notVariant: !cfg.isVariant,\n        groups: anch,\n        eyebrowA: eb.a, eyebrowIt: eb.it, eyebrowB: eb.b,\n        crumbA: cb.a, crumbIt: cb.it, crumbB: cb.b,\n        hash: '#' + cfg.aid,\n        groups: pgroups,\n        stats,\n        hasFront: !!what,\n        lead: what ? what.lead : cfg.lead,\n        demonstrates: what ? what.demonstrates : [],\n        caption: fm ? fm.illustrativeExamplesCaption : '',\n        hasCaption: !!fm,\n        whatHead: what ? 'What is ' + (cfg.aOrAn || 'a') + ' ' + cfg.fullName + '?' : '',\n        howPre: ix >= 0 ? how.slice(0, ix) : how,\n        howMid: ix >= 0 ? PH : '',\n        howPost: ix >= 0 ? how.slice(ix + PH.length) : '',\n        hasTermBtn: ix >= 0,\n        screenLabel: cfg.aid + ' ' + cfg.tier + ' detail page',\n      };\n    };\n\n    const pages = (d && this.state.et && this.state.ie && this.state.ict)\n      ? [\n          mkPage(d, { aid: '3a', tier: 'CEng', fullName: 'Chartered Engineer', plural: 'Chartered Engineers', line1: 'Chartered', line2: 'Engineer', crumb: 'Chartered Engineer (CEng)', eyebrow: 'UK-SPEC · UK standard for professional engineering competence and commitment', exHead: 'About the illustrative examples', exWord: 'Illustrative examples', termSrc: 'ceng', underUkspec: true, isVariant: false, stat3: { v: '2', l: 'Stage professional review' } }),\n          mkPage(this.state.et, { aid: '3b', tier: 'EngTech', fullName: 'Engineering Technician', plural: 'Engineering Technicians', aOrAn: 'an', line1: 'Engineering', line2: 'Technician', crumb: 'Engineering Technician (EngTech)', eyebrow: 'UK-SPEC · UK standard for professional engineering competence and commitment', exHead: 'About the illustrative examples', exWord: 'Illustrative examples', termSrc: 'et', underUkspec: true, isVariant: false, stat3: null }),\n          mkPage(this.state.ie, { aid: '3c', tier: 'IEng', fullName: 'Incorporated Engineer', plural: 'Incorporated Engineers', aOrAn: 'an', line1: 'Incorporated', line2: 'Engineer', crumb: 'Incorporated Engineer (IEng)', eyebrow: 'UK-SPEC · UK standard for professional engineering competence and commitment', exHead: 'About the illustrative examples', exWord: 'Illustrative examples', termSrc: 'ie', underUkspec: true, isVariant: false, stat3: { v: '2', l: 'Stage professional review' } }),\n          mkPage(this.state.ict, { aid: '3d', tier: 'ICTTech', fullName: 'ICT Technician', plural: 'ICT Technicians', aOrAn: 'an', line1: 'ICT', line2: 'Technician', crumb: 'ICTTech Standard', eyebrow: 'ICTTech Standard · third edition', exHead: 'About the examples of evidence', exWord: 'Examples of evidence', termSrc: null, underUkspec: false, isVariant: true, stat3: null, lead: 'The professional title for ICT technicians. ICTTech is derived from the EngTech standard.' }),\n        ]\n      : undefined;\n    return {\n      groups,\n      total,\n      lead: d ? d.frontMatter.whatIsCEng.lead : undefined,\n      demonstrates: d ? d.frontMatter.whatIsCEng.demonstrates : undefined,\n      caption: d ? d.frontMatter.illustrativeExamplesCaption : undefined,\n      termLabel: term ? term.label : '',\n      termBody: term ? stripNote(term.html) : '',\n      openTerm: this.openTerm,\n      openTarget: this.openTarget,\n      groupsB: groups ? groups.map((g) => ({ ...g, anchor: 'b-group-' + g.id, hash: '#b-group-' + g.id })) : undefined,\n      groups2a: groups ? groups.map((g) => ({ ...g, anchor: 'c2-group-' + g.id, hash: '#c2-group-' + g.id })) : undefined,\n      pages,\n      printPage: () => window.print(),\n      groupsOpen: this.props.groupsOpen ?? false,\n      showExamples: this.props.showExamples ?? true,\n      logoH: 34,\n      logoHsm: 26,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
